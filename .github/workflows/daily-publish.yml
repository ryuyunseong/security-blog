name: 매일 보안 글 작성 및 발행

on:
  schedule:
    - cron: '30 9 * * *' # 한국 시간 매일 18시 30분 (주말도 동일)
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: API 없이 검사 / preview: 생성·검증만 / publish: 검증 후 발행'
        type: choice
        options: [verify, preview, publish]
        default: verify

permissions:
  contents: read

concurrency:
  group: daily-publication
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  SITE_URL: ${{ vars.SITE_URL || 'https://ryuyunseong.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/security-blog/' }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      requested: ${{ steps.plan.outputs.requested }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 실행 모드
        id: mode
        env:
          DAILY_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
        run: echo "mode=$DAILY_MODE" >> "$GITHUB_OUTPUT"
      - name: 공식 PDF 읽기 도구
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: 한국 날짜·다음 항목·중복 확인
        id: plan
        env:
          DAILY_MODE: ${{ steps.mode.outputs.mode }}
          DAILY_ENABLED: ${{ vars.DAILY_PUBLISH_ENABLED }}
        run: |
          node scripts/daily-publish.mjs plan "$DAILY_MODE"
          if [ "$DAILY_MODE" = publish ] && [ "$DAILY_ENABLED" != true ]; then
            echo '클라우드 발행은 비활성 상태입니다. Secret 등록과 preview 검증 후 활성화합니다.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-plan
          path: |
            .qa/daily-plan.json
            .qa/daily-prompt.md
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  generate:
    needs: plan
    if: needs.plan.outputs.mode != 'verify' && needs.plan.outputs.requested == 'true' && (needs.plan.outputs.mode == 'preview' || vars.DAILY_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daily-plan
          path: .qa
      - name: Secret 등록 확인
        env:
          KEY_READY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$KEY_READY" != true ]; then
            echo '::error::OPENAI_API_KEY Secret이 등록되지 않았습니다.'
            exit 1
          fi
      - name: 공식 자료를 확인하며 읽기 전용으로 작성
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          effort: medium
          codex-args: '["--search", "--ephemeral"]'
          prompt-file: .qa/daily-prompt.md
          output-schema-file: scripts/daily-output.schema.json
          output-file: .qa/daily-generation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-generated
          path: .qa/daily-generation.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: [plan, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-plan
          path: .qa
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-generated
          path: .qa
      - name: 검증 도구 준비
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
          docker pull python:3.12-slim
      - name: 출처·본문·격리 실행 확인
        run: node scripts/daily-publish.mjs validate
      - name: 콘텐츠·타입·빌드 검사
        run: |
          npm run check
          npm test
          npm run build
          npm run verify
      - name: 데스크톱·모바일 확인
        run: |
          npm run preview -- --port 4322 > .qa/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4322/security-blog/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-daily-browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-validated
          path: .qa/daily-bundle.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-browser
          path: .qa/browser
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: plan
    if: needs.plan.outputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: 검증 도구 준비
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
          docker pull python:3.12-slim
      - name: 키 전달·네트워크·파일시스템 격리 확인
        run: node scripts/daily-publish.mjs verify-runtime
      - name: 기존 사이트 회귀 검사
        run: |
          npm run check
          npm test
          npm run build
          npm run verify
      - name: 화면 확인
        run: |
          npm run preview -- --port 4322 > .qa/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4322/security-blog/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-daily-browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-browser
          path: .qa/browser
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: [plan, validate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'publish' && vars.DAILY_PUBLISH_ENABLED == 'true' && (needs.validate.result == 'success' || needs.plan.outputs.requested == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-plan
          path: .qa
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.requested == 'true'
        with:
          name: daily-validated
          path: .qa
      - name: 원격 충돌 확인 후 허용한 글만 커밋·푸시
        id: commit
        run: node scripts/daily-publish.mjs publish

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      source_ref: ${{ needs.publish.outputs.sha }}

  public-check:
    needs: [plan, publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: daily-plan
          path: .qa
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.plan.outputs.requested == 'true'
        with:
          name: daily-validated
          path: .qa
      - name: 공개 글·그림·검색·RSS 확인
        run: node scripts/daily-publish.mjs verify-public
