<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">조건과 정렬로 도서 두 권 고르기</title><desc id="desc">가격이 같으면 book_id를 추가 정렬 기준으로 쓴다. 도서 번호는 조건 적용 뒤에도 유지된다. 가격 단위는 원이며 이 그림의 순서는 논리적 결과를 설명한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">입력</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">도서 목록 5행</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">번호는 book_id</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">조건</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">재고 있음·2만원 이상</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">1·4·5번이 대상</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">정렬·제한</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">가격 내림차순·2행</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">5번 다음 4번</text></g></svg>
