<svg xmlns="http://www.w3.org/2000/svg" width="360" height="473" viewBox="0 0 360 473" data-diagram-kind="matrix" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">계정 잠금 횟수·집계 구간·해제 시간</title><desc id="desc">집계 구간, 실패 횟수, 해제 시간은 서로 다른 정책이다. 이 값들을 사용하는 PAM 경로가 연결돼 있는지도 확인한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="473" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">실패 집계</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">fail_interval</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">얼마 동안 셀 것인가</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">잠금 임계값</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">deny</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">몇 번 실패하면 잠그나</tspan></text><rect x="16" y="310" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="348" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">해제 시간</tspan></text><text x="32" y="383" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">unlock_time</tspan></text><text x="32" y="417" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">얼마 뒤 풀 것인가</tspan></text></g></svg>
