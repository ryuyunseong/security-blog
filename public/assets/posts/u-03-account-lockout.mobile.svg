<svg xmlns="http://www.w3.org/2000/svg" width="360" height="673" viewBox="0 0 360 673" data-diagram-kind="matrix" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">계정 잠금 횟수·집계 구간·해제 시간</title><desc id="desc">900초는 실패를 세는 구간이고 600초는 잠금 뒤 해제까지의 설정값이에요. 칸의 간격은 실제 실패 시각을 뜻하지 않아요. 이 값들을 사용하는 PAM 경로가 연결돼 있는지도 확인해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="673" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="array"><rect x="16" y="16" width="328" height="193" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">실패 횟수: 정책 예시</tspan></text><rect x="32" y="79" width="59.2" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="61.6" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="61.6" dy="0">1</tspan></text><rect x="91.2" y="79" width="59.2" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="120.80000000000001" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="120.80000000000001" dy="0">2</tspan></text><rect x="150.4" y="79" width="59.2" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="180" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="180" dy="0">3</tspan></text><rect x="209.60000000000002" y="79" width="59.2" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="239.20000000000002" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="239.20000000000002" dy="0">4</tspan></text><rect x="268.8" y="79" width="59.2" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="298.40000000000003" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="298.40000000000003" dy="0">5</tspan></text><text x="32" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">집계 구간</tspan></text><text x="32" y="176" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">fail_interval = 900초</tspan></text></g><g data-panel="actor"><rect x="16" y="257" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="286" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 286h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="295" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">잠금 임계값</tspan></text><text x="32" y="351" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">deny</tspan></text><text x="32" y="384" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">5</tspan></text></g><g data-panel="actor"><rect x="16" y="465" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="502" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 492l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="503" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">자동 해제 대기</tspan></text><text x="32" y="559" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">unlock_time</tspan></text><text x="32" y="592" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">600초</tspan></text></g><path d="M180 214V249" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 422V457" fill="none" stroke="#7eaa93" stroke-width="2" marker-en