<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">umask가 같은데 결과가 다른 이유</title><desc id="desc">같은 umask라도 부모 디렉터리의 기본 ACL에 따라 생성 권한이 달라진다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트  /  구조로 읽기</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">umask가 같은데 결과가 다른 이유</text><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700">기본 ACL 없음</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400">요청 0666 · umask 0077</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400">새 파일 0600</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700">기본 ACL 있음</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400">u:rwx / g:r-x / o:---</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400">요청 0666 → 새 파일 0640</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">기본 ACL을 상속하는 경우 프로그램이 요청한 모드도 함께 적용된다.</text></g></svg>
