<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">umask가 같은데 결과가 다른 이유</title><desc id="desc">같은 umask라도 부모 디렉터리의 기본 ACL에 따라 생성 권한이 달라진다. 기본 ACL을 상속하는 경우 프로그램이 요청한 모드도 함께 적용된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">기본 ACL 없음</text><text x="66" y="235" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 0666 · umask 0077</text><text x="66" y="265" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">새 파일 0600</text><g data-illustration="permission-bits" data-mode="0600"><text x="128" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="70" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="88" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="110" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="128" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="150" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="168" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="252" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="194" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="212" y="336" font-size="22" fill="#19