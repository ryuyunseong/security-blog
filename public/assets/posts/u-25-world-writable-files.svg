<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">U-25의 파일 검색과 설정 사유 조사</title><desc id="desc">검색 결과에는 쓰기 비트가 필요한 이유가 담기지 않는다. 후보 파일의 용도와 변경 영향을 조사해 설정 사유를 판단한다. 격리 예제는 일반 파일과 other 쓰기 비트로 후보를 수집한다. 공식 기준의 최종 판정에는 설정 사유의 인정 여부가 필요하다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">일반 파일 선별</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일 형식 조회</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">디렉터리·링크 제외</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">other 쓰기 조회</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">mode &amp; 0002</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">0666·0602가 후보</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">설정 사유 조사</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일 용도·변경 영향</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">필요성을 검토</text></g></svg>
