<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 120 960 340" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">호스트 탐색과 프로토콜별 검사 범위</title><desc id="desc">ICMP 탐색 방식과 실제 포트 번호는 생략했다. TCP·UDP의 구체적인 선택 목록은 작업 당시의 프로필과 대조한다. 탐색과 TCP·UDP 선택의 역할을 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="120" width="960" height="340" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">호스트 탐색</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">대상 응답 수집</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">살아 있는 호스트 식별</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">TCP 검사</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">TCP 목록 대조</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">TCP 서비스별 범위</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">UDP 검사</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">UDP 목록 대조</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">UDP 서비스별 범위</text></g></svg>
