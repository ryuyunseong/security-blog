<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">UID 재사용과 소유자 이름의 변화</title><desc id="desc">GID 조회 결과와 실제 접근 권한은 이 그림에서 생략했다. 가상 계정표만 바꾸고 파일 속성 목록은 유지했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">조회 실패</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID 41001 → 없음</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일 UID 41001</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">UID 재사용</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID 41001 → newapp</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일 UID 41001</text></g></svg>
