<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">UID 재사용과 소유자 이름의 변화</title><desc id="desc">파일의 숫자는 그대로인데 계정표를 바꾸면 보이는 이름이 달라져요. 가상 이름 조회이며 실제 접근 권한 전체를 판정한 결과는 아니에요. 가상 계정표만 바꾸고 파일 속성 목록은 유지했어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="302" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="448" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">같은 파일: UID 이름 대응 없음</tspan></text><text x="32" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">파일에 남은 UID</tspan></text><text x="32" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">41001</tspan></text><text x="32" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">계정표 조회 결과</tspan></text><text x="32" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대응 이름 없음</tspan></text></g><g data-panel="file"><rect x="496" y="16" width="448" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M512 32h23l9 9v32H512Z M535 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="512" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">같은 파일: UID 재사용 뒤</tspan></text><text x="512" y="150" font-size="20" fill="#536b60" font-weight="400" tex