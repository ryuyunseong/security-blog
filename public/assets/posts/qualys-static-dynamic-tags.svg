<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">태그 이름이 같아도 분류 근거는 다르다</title><desc id="desc">같은 업무 이름의 태그라도 직접 지정한 목록과 조건으로 고른 목록은 다를 수 있다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">태그 이름이 같아도 분류 근거는 다르다</text><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700">직접 지정한 목록</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400">lab-01 · lab-02</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400">업무 목적과 지정 이력 확인</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700">Linux + prod 조건</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400">lab-01</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400">자산 정보와 평가 시점 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">가상 자산의 Python 비교이며 실제 Qualys 태그 평가 결과가 아니다.</text></g></svg>
