<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">태그 이름이 같아도 분류 근거는 다르다</title><desc id="desc">가상 자산 목록의 비교다. 직접 지정한 자산과 Linux·prod 조건에 맞는 자산이 다르게 선택된다. 가상 자산의 Python 비교이며 실제 Qualys 태그 평가 결과가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">직접 지정한 목록</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">lab-01 · lab-02</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">업무 목적과 지정 이력 확인</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">Linux + prod 조건</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">lab-01</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">자산 정보와 평가 시점 확인</text></g></svg>
