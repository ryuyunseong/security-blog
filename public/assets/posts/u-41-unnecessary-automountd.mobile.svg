<svg xmlns="http://www.w3.org/2000/svg" width="360" height="688" viewBox="0 0 360 688" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">가상 PID 101과 102에서 automountd가 들어간 인수의 위치</title><desc id="desc">두 줄 모두 같은 철자를 담고 있어도 비교에 쓰는 칸은 argv[0] 하나예요. 가상 mixed 사례의 두 행. 첫 인수의 끝 이름을 비교하며 검색 명령의 다음 인수는 검사 대상에서 빠진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="688" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 43l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">PID 101</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">argv[0]</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/usr/sbin/automountd</tspan></text><text x="32" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">끝 이름</tspan></text><text x="32" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">automountd</tspan></text><text x="32" y="262" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">비교 결과</tspan></text><text x="32" y="295" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이름 후보</tspan></text></g><g data-panel="actor"><rect x="16" y="352" width="328" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="389" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 379l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="390" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">PID 102</tspan></text><text x="32" y="446" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">argv[0]</tspan></text><text x="32" y="479" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">grep</tspan></text><text x="32" y="522" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">argv[1]</tspan></text><text x="32" y="555" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">automountd</tspan></text><text x="32" y="598" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">비교 결과</tspan></text><text x="32" y="631" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">검색어만 일치</tspan></text></g></g></svg>
