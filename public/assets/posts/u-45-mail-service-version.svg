<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">같은 설치 버전을 두 공급 경로의 기준과 대조한 결과</title><desc id="desc">각 화살표는 한 입력 행이 참조한 공급 경로를 가리켜요. match와 different는 해당 기준값과의 비교 결과예요. 가상 입력 두 줄의 설치값은 1.0-2예요. 각 행의 공급 경로가 참조하는 기준이 달라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="524" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="534" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M550 39v29c0 10 36 10 36 0V39" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><ellipse cx="568" cy="39" rx="18" ry="7" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="604" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="604" dy="0">lab-a</tspan></text><text x="550" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">기준</tspan></text><text x="550" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">1.0-2</tspan></text><text x="550" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">결과</tspan></text><text x="550" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">match · 일치</tspan></text></g><g data-panel="actor"><rect x="534" y="270" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M550 293v29c0 10 36 10 36 0V293" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><ellipse cx="568" cy="293" rx="18" ry="7" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="604" y="308" font-size="22" fill="