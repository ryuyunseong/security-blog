<svg xmlns="http://www.w3.org/2000/svg" width="960" height="367" viewBox="0 117 960 367" data-diagram-kind="merge" role="img" aria-labelledby="title desc"><title id="title">계정 UID와 홈 디렉터리 메타데이터 비교</title><desc id="desc">계정 목록의 다른 경로에서 얻은 메타데이터를 섞지 않는다는 가정을 둔다. 가상 계정의 홈 경로와 그 경로의 소유 UID·모드를 결합해 비교한다. 소유자 일치와 쓰기 비트는 별도 조건이다. 실제 조회·접근·권한 변경을 수행한 그림이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="117" width="960" height="367" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="141" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="169" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="206" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">계정 UID 1002</text><text x="66" y="242" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">/home/bravo</text><text x="66" y="273" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">가상 계정 자료</text><rect x="44" y="306" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="334" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="66" y="371" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">소유 UID 1002</text><text x="66" y="407" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">mode 0770</text><text x="66" y="438" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">같은 경로의 가상 자료</text><path d="M434 218H480V300H524 M434 382H480V300" fill="none" stroke="#7eaa93" stroke-width="3"/><rect x="524" y="202" width="392" height="205" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="237" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="546" y="279" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">소유 UID 일치</text><text x="546" y="321" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹 쓰기 0020</text><text x="546" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">검토 후보</text></g></svg>
