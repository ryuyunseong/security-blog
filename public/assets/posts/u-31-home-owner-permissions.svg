<svg xmlns="http://www.w3.org/2000/svg" width="960" height="715" viewBox="0 0 960 715" data-diagram-kind="merge" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">계정 UID와 홈 디렉터리 메타데이터 비교</title><desc id="desc">같은 홈 경로에서 소유 UID와 권한을 합쳐 보는 사례예요. 계정 UID가 맞아도 그룹 쓰기 0020은 별도로 남아요. 가상 계정의 홈 경로와 그 경로의 소유 UID·모드를 결합해 비교해요. 소유자 일치와 쓰기 비트는 별도 조건이며 실제 조회·접근·권한 변경을 수행한 그림은 아니에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="715" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="50" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">가상 계정</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">UID</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1002</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">홈 경로</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/home/bravo</tspan></text></g><g data-panel="file"><rect x="16" y="270" width="410" height="421" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 294v28h38V294H52l-8-8H32v8Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="360" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">