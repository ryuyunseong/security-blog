<svg xmlns="http://www.w3.org/2000/svg" width="360" height="701" viewBox="0 0 360 701" data-diagram-kind="timeline" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">192.0.2.10의 0·4·9초 실패가 최근 10초 구간에 함께 남아 9초에 처음 알린다. 점 간격은 시간 비례가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="701" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">같은 IP의 세 번째 실패가</tspan><tspan x="16" dy="31">들어오는 시점</tspan></text><rect x="52" y="104" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">0초</tspan></text><text x="68" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">첫 실패: 1회</tspan></text><text x="68" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">192.0.2.10</tspan></text><rect x="52" y="263" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="301" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">4초</tspan></text><text x="68" y="336" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">구간 안에 2회</tspan></text><text x="68" y="370" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">0초·4초가 남음</tspan></text><rect x="52" y="422" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="460" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">9초</tspan></text><text x="68" y="495" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">3회 도달: 첫 알림</tspan></text><text x="68" y="529" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">구간 (-1, 9]</tspan></text><path d="M26 116V444" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="26" cy="116" r="6" fill="#287056"/><circle cx="26" cy="275" r="6" fill="#287056"/><circle cx="26" cy="434" r="6" fill="#287056"/><path d="M16 581H344" stroke="#cadbd1"/><text x="16" y="617" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">본문의 W=10, K=3 예제에서 한</tspan><tspan x="16" dy="28">IP만 골랐다. 왼쪽 경계는</tspan><tspan x="16" dy="28">제외한다.</tspan></text></g></svg>
