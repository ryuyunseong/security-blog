<svg xmlns="http://www.w3.org/2000/svg" width="360" height="739" viewBox="0 0 360 739" data-diagram-kind="timeline" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">칸 안의 숫자는 가상 실패 시각(초)이에요. 9초의 구간에는 0·4·9초가 함께 남으며 칸 간격은 시간 비례가 아니에요. 본문의 W=10, K=3 예제에서 한 IP만 골랐고 왼쪽 경계는 제외해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="739" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="array"><rect x="16" y="16" width="328" height="193" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">0초: 남은 실패 시각</tspan></text><rect x="32" y="79" width="296" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="180" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="180" dy="0">0</tspan></text><text x="32" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">건수</tspan></text><text x="32" y="176" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1회</tspan></text></g><g data-panel="array"><rect x="16" y="257" width="328" height="193" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="295" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">4초: 남은 실패 시각</tspan></text><rect x="32" y="320" width="148" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="106" y="349" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="106" dy="0">0</tspan></text><rect x="180" y="320" width="148" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="254" y="349" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="254" dy="0">4</tspan></text><text x="32" y="384" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">건수</tspan></text><text x="32" y="417" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">2회</tspan></text></g><g data-panel="array"><rect x="16" y="498" width="328" height="193" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="536" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">9초: 구간 (-1, 9]</tspan></text><rect x="32" y="561" width="98.66666666666667" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="81.33333333333334" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="81.33333333333334" dy="0">0</tspan></text><rect x="130.66666666666669" y="561" width="98.66666666666667" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="180" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="180" dy="0">4</tspan></text><rect x="229.33333333333334" y="561" width="98.66666666666667" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="278.6666666666667" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="278.6666666666667" dy="0">9</tspan></text><text x="32" y="625" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">건수</tspan></text><text x="32" y="658" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">3회: 첫 알림</tspan></text></g><path d="M180 214V249" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 455V490" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
