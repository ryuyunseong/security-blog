<svg xmlns="http://www.w3.org/2000/svg" width="360" height="501" viewBox="0 0 360 501" data-diagram-kind="timeline" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">W=10, K=3일 때 192.0.2.10은 9초에 처음 알린다. 왼쪽 경계는 제외하며 점 간격은 시간에 비례하지 않는다. 본문의 W=10, K=3 예제에서 한 IP만 골랐다. 왼쪽 경계는 제외한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="501" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="52" y="16" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">0초</tspan></text><text x="68" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">첫 실패: 1회</tspan></text><text x="68" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">192.0.2.10</tspan></text><rect x="52" y="175" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="213" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">4초</tspan></text><text x="68" y="248" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">구간 안에 2회</tspan></text><text x="68" y="282" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">0초·4초가 남음</tspan></text><rect x="52" y="334" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="372" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">9초</tspan></text><text x="68" y="407" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">3회 도달: 첫 알림</tspan></text><text x="68" y="441" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">구간 (-1, 9]</tspan></text><path d="M26 28V356" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="26" cy="28" r="6" fill="#287056"/><circle cx="26" cy="187" r="6" fill="#287056"/><circle cx="26" cy="346" r="6" fill="#287056"/></g></svg>
