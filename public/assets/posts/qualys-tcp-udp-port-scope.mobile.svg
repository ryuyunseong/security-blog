<svg xmlns="http://www.w3.org/2000/svg" width="360" height="628" viewBox="0 0 360 628" data-diagram-kind="matrix" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">TCP 53과 UDP 53의 가상 선택 목록</title><desc id="desc">UDP 53이 선택돼 있어도 TCP 53은 다른 조합이에요. 이 가상 목록에서는 TCP 53과 TCP 8443이 빠져 있어요. 가상 서비스와 프로토콜별 선택 목록을 비교해요. Qualys의 Standard나 Light 기본 목록을 복제한 것은 아니에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="628" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="304" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 서비스</tspan></text><rect x="28" y="79" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">프로토콜</tspan></text><path d="M180 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">포트</tspan></text><rect x="28" y="126" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TCP</tspan></text><path d="M180 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">443</tspan></text><rect x="28" y="170" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TCP</tspan></text><path d="M180 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">8443</tspan></text><rect x="28" y="214" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TCP</tspan></text><path d="M180 214v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">53</tspan></text><rect x="28" y="258" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="286" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">UDP</tspan></text><path d="M180 258v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="286" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">53</tspan></text></g><g data-panel="table"><rect x="16" y="344" width="328" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 선택 목록</tspan></text><rect x="28" y="407" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="437" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">프로토콜</tspan></text><path d="M180 407v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="437" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">포트</tspan></text><rect x="28" y="454" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="482" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TCP</tspan></text><path d="M180 454v44" fill="none" stroke="#7eaa93" s