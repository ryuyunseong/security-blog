<svg xmlns="http://www.w3.org/2000/svg" width="360" height="513" viewBox="0 0 360 513" data-diagram-kind="cycle" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">수정과 재탐지 사이의 상태 전이</title><desc id="desc">화살표는 조건에 맞는 새 결과를 처리했을 때의 전이다. 재탐지 후에도 계속 탐지되면 Active이며, 자료가 없는 회차는 상태 변경 근거에서 뺀다. 동일한 자산과 탐지 항목을 비교하는 흐름이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="513" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="42" y="16" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">탐지</tspan></text><text x="58" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">New·Active</tspan></text><text x="58" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">스캔 결과 처리</tspan></text><path d="M193 152v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="183" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="221" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">수정 검증</tspan></text><text x="58" y="256" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">Fixed</tspan></text><text x="58" y="290" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">새 검사로 검증</tspan></text><path d="M193 319v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="350" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="388" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">재탐지</tspan></text><text x="58" y="423" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">Re-Opened</tspan></text><text x="58" y="457" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">연속 탐지→Active</tspan></text><path d="M42 415.5H20V44H36" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
