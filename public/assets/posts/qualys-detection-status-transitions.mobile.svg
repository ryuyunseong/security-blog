<svg xmlns="http://www.w3.org/2000/svg" width="360" height="866" viewBox="0 0 360 866" data-diagram-kind="cycle" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">수정과 재탐지 사이의 상태 전이</title><desc id="desc">각 줄은 다음 검사 결과에 따라 이전 상태가 바뀌는 경로예요. 같은 상태가 유지되는 경로는 생략했어요. 동일한 자산과 탐지 항목을 비교하는 흐름이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="866" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="states"><rect x="16" y="16" width="328" height="826" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">재검사 결과에 따른 주요 상태</tspan><tspan x="32" dy="31">변경</tspan></text><rect x="32" y="110" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="190" y="110" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="101" y="142" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="101" dy="0">New</tspan></text><text x="259" y="142" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="259" dy="0">Active</tspan></text><path d="M172 135.5H187" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 검사에서도 탐지</tspan></text><rect x="32" y="221" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="190" y="221" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="101" y="253" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="101" dy="0">New</tspan></text><text x="259" y="253" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="259" dy="0">Fixed</tspan></text><path d="M172 246.5H187" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="300" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 검사에서 더 이상 탐지되지</tspan><tspan x="32" dy="28">않음</tspan></text><rect x="32" y="360" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="190" y="360" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="101" y="392" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="101" dy="0">Active</tspan></text><text x="259" y="392" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="259" dy="0">Fixed</tspan></text><path d="M172 385.5H187" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="439" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">새 검사로 수정 검증</tspan></text><rect x="32" y="471" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="190" y="471" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="101" y="503" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="101" dy="0">Fixed</tspan></text><text x="259" y="503" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="259" dy="0">Re-Opened</tspan></text><path d="M172 496.5H187" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="550" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수정 뒤 다시 탐지</tspan></text><rect x="32" y="582" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="190" y="582" width="138" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="101" y="614" font-size="22"