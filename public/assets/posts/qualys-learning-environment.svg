<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">교육 계정과 제품 사용 환경을 구분한다</title><desc id="desc">접속한 환경에서 제공하는 앱, 사용자 권한, 할당된 자산을 확인한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">교육 계정과 제품 사용 환경을 구분한다</text><rect x="44" y="145" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700">교육 사이트</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400">학습 자료 · 교육 과정</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400">제품 구독과 별개</text><rect x="44" y="233" width="872" height="76" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700">제품 환경</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400">Community Edition · VMDR</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400">제공 앱과 범위 확인</text><rect x="44" y="321" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700">실습 준비</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400">사용자 역할 · 자산 할당</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400">스캔 가능한 조건 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">Qualys 공식 문서의 실습 준비 항목을 정리한 도식이다.</text></g></svg>
