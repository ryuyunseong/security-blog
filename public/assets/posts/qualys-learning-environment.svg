<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">교육 계정과 제품 사용 환경을 구분한다</title><desc id="desc">교육 과정에 접속하는 계정과 제품에서 검사할 권한을 구별했어요. 교육 등록만으로 제품 구독과 자산 권한이 생기지는 않아요. Qualys 공식 문서의 실습 준비 항목을 정리한 도식이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="262" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="448" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 39v29c0 10 36 10 36 0V39" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><ellipse cx="50" cy="39" rx="18" ry="7" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">교육 사이트</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">계정의 목적</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">자료 · 교육 과정</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">학습과 제품</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">제품 구독과 별개</tspan></text></g><g data-panel="actor"><rect x="496" y="16" width="448" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="512" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M520 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="566" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="566" dy="0">제품의 허용 범위</tspan></text><text x="512" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">사용 환경</tspan></text><text x="512" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">Community Edition · VMDR</tspan></text><text x="512" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">사용 조건</tspan></text><text x="512" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">역할 · 자산 할당</tspan></text></g></g></svg>
