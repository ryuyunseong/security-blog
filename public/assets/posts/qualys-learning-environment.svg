<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 121 960 300" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">교육 계정과 제품 사용 환경을 구분한다</title><desc id="desc">접속한 환경에서 제공하는 앱, 사용자 권한, 할당된 자산을 확인한다. Qualys 공식 문서의 실습 준비 항목을 정리한 도식이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="121" width="960" height="300" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">교육 사이트</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">학습 자료 · 교육 과정</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">제품 구독과 별개</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">제품 환경</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">Community Edition · VMDR</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">제공 앱과 범위 확인</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">실습 준비</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">사용자 역할 · 자산 할당</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">스캔 가능한 조건 확인</text></g></svg>
