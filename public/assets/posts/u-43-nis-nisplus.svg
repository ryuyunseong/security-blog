<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">NIS+가 켜진 가상 사례에서 기존 NIS 상태 비교</title><desc id="desc">두 사례 모두 NIS+가 켜져 있어요. 강조한 NIS 행에서 기존 서비스가 함께 남아 있는지 볼 수 있어요. 두 사례에서 NIS+는 활성이고 기존 NIS는 각각 활성과 비활성이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="260" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="448" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">both · 두 서비스 활성</tspan></text><rect x="28" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">서비스</tspan></text><path d="M240 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="248" dy="0">상태</tspan></text><rect x="28" y="126" width="424" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">NIS</tspan></text><path d="M240 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">on · 활성</tspan></text><rect x="28" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">NIS+</tspan></text><path d="M240 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">on · 활성</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">plus · NIS+만 활성</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">서비스</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">상태</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">NIS</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">off · 비활성</tspan></text><rect x="508" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">NIS+</tspan></text><path d="M720 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">on · 활성</tspan></text></g></g></svg>
