<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 121 960 300" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">Qualys의 플랫폼·앱·수집 구성</title><desc id="desc">에이전트와 스캐너 외에도 클라우드 커넥터 등으로 정보를 수집할 수 있다. 세 구성의 역할을 구분한 개념도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="121" width="960" height="300" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">플랫폼</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">수집 정보 저장·연계</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">자산·결과를 함께 관리</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">보안 앱</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">VMDR·CSAM 등</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">목적별 분석과 보고서</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">수집 구성</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">Cloud Agent·스캐너</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">대상 호스트·네트워크 조회</text></g></svg>
