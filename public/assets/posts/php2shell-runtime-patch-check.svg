<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">같은 워커의 요청 사이에 남은 상태 참조</title><desc id="desc">세 칸은 사건 순서이며 시간 간격을 나타내지 않는다. 구체적인 상태 생성·사용 연산은 실행 방식과 설정에 따라 달라진다. CVE-2026-109619의 요청 간 관계를 단순화했다. 구체적인 생산·소비 연산과 적용 조건은 본문 권고를 따른다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">앞 요청</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 상태를 참조</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">정리 누락·메모리 해제</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">같은 워커</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">이전 참조가 남음</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">다음 요청을 처리</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">다음 요청</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">초기화 전 상태 사용</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">해제된 메모리 참조</text></g></svg>
