<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">같은 워커의 요청 사이에 남은 상태 참조</title><desc id="desc">같은 워커가 다음 요청을 처리하는 시간 순서예요. 실제 메모리 주소와 구체적인 생산·소비 연산은 생략했어요. CVE-2026-109619의 요청 간 관계를 단순화했어요. 구체적인 생산·소비 연산과 적용 조건은 본문 권고를 따라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="302" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="157" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 43l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">앞 요청의 종료</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수명 종료</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">요청 메모리 해제</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">워커에 남은 이전 참조</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">가리키는 대상</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">이미 해제된 메모리</tspan></text><text x="352" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">계속 처리하는 주체</tspan></text><text x="352" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">같은 워커</tspan></text></g><g data-panel="actor"><rect x="656" y="16" width="288" height="250" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="691" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M686 43l14 10-14 10Z" fill="#7eaa93"/><text x="726" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="726" dy="0">다음 요청의 초기화</tspan><tspan x="726" dy="31">전</tspan></text><text x="672" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">문제 동작</tspan></text><text x="672" y="161" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">남은 참조를 사용</tspan></text><text x="672" y="203" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">발생 가능한 결과</tspan></text><text x="672" y="234" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">해제된 메모리에 다시 접근</tspan></text></g><path d="M307 94.5H320V151H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 151H640V141H650" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
