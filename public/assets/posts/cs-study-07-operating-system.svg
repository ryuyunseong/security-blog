<svg xmlns="http://www.w3.org/2000/svg" width="960" height="367" viewBox="0 0 960 367" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">4096바이트 페이지의 가상 주소 변환</title><desc id="desc">페이지 번호는 프레임 번호로 바뀌어도 변위 3은 유지돼요. 권한·여러 단계의 표·TLB는 생략한 가상 산술 모형이에요. 한 단계 사전으로 계산한 예시이며 실제 커널의 페이지 테이블·TLB·권한 비트를 수집한 결과는 아니에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="367" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="split"><rect x="16" y="16" width="288" height="189" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 주소 8195바이트</tspan></text><rect x="32" y="79" width="128" height="100" rx="0" fill="#fff" stroke="#cadbd1"/><text x="96" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="96" dy="0">페이지</tspan></text><text x="96" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="96" dy="0">2</tspan></text><rect x="160" y="79" width="128" height="100" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="224" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="224" dy="0">변위</tspan></text><text x="224" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="224" dy="0">3</tspan></text></g><g data-panel="table"><rect x="336" y="16" width="288" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="352" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">한 단계 페이지 표</tspan></text><rect x="348" y="79" width="264" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="356" y