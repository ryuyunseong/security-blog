<svg xmlns="http://www.w3.org/2000/svg" width="360" height="672" viewBox="0 0 360 672" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 echo의 TCP 주석 행과 UDP 활성 설정 행</title><desc id="desc">같은 문자열의 두 행을 따로 읽은 결과예요. TCP 행의 주석이 UDP 행에 전파되지 않아요. 가상 split-echo 문자열의 1행과 2행을 독립적으로 비교한다. 실제 서비스 실행·통신 결과가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="672" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="304" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1행: TCP</tspan></text><rect x="28" y="79" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">필드</tspan></text><path d="M180 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">입력</tspan></text><rect x="28" y="126" width="304" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">서비스</tspan></text><path d="M180 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0"># echo</tspan></text><rect x="28" y="170" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">소켓</tspan></text><path d="M180 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">stream</tspan></text><rect x="28" y="214" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">프로토콜</tspan></text><path d="M180 214v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">tcp</tspan></text><rect x="28" y="258" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="286" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">추출</tspan></text><path d="M180 258v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="286" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">주석 설정</tspan></text></g><g data-panel="table"><rect x="16" y="344" width="328" height="304" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">2행: UDP</tspan></text><rect x="28" y="407" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="437" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">필드</tspan></text><path d="M180 407v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="437" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">입력</tspan></text><rect x="28" y="454" width="304" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="36" y="482" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">서비스</tspan></text><path d="M180 454v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="482" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">echo</tspan></text><rect x="28" y="498" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="526" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">소켓</tspan></text><path d="M180 498v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="526" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">dgram</tspan></text><rect x="28" y="542" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="570" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">프로토콜</tspan></text><path d="M180 542v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="570" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">udp</tspan></text><rect x="28" y="586" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="614" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">추출</tspan></text><path d="M180 586v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="614" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">활성 설정 후보</tspan></text></g></g></svg>
