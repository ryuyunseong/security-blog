<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">LEFT JOIN에서 결제 조건을 적용하는 두 위치</title><desc id="desc">status가 NULL인 보충 행은 paid 상태를 고르는 WHERE 조건을 통과하지 못한다. status=paid 조건을 적용한 가상 회원·주문 자료의 결과다. 두 조회 모두 결제 주문만 계산한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">ON에서 선택</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">회원은 모두 보존</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">다온: 주문 0건</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">WHERE에서 선택</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">NULL 보충 행 제외</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">다온 행은 사라짐</text></g></svg>
