<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">LEFT JOIN에서 결제 조건을 적용하는 두 위치</title><desc id="desc">같은 회원·주문 자료를 사용했어요. WHERE 조건의 표에서는 NULL로 보충된 3번 행의 조건이 참이 되지 않아 빠져요. status=paid 조건을 적용한 가상 회원·주문 자료의 결과예요. 두 조회 모두 결제 주문만 계산해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="336" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="448" height="304" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">paid 조건을 ON에 둠</tspan></text><rect x="28" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">회원 번호</tspan></text><path d="M240 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="248" dy="0">주문 수</tspan></text><rect x="28" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">1</tspan></text><path d="M240 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">1</tspan></text><rect x="28" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">2</tspan></text><path