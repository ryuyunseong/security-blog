<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">접근 거부 QID와 취약점 결과를 함께 대조해 검사 범위를 좁힌다. 인증 성공을 전체 취약점 검사의 완료나 안전 판정으로 해석하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">로그인</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">인증 보고서 Passed</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">접속 성공 확인</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">접근 가능한 범위</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일 · 레지스트리 등</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">실제 읽기 권한 확인</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">취약점 평가</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">탐지 근거와 검사 시점</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">실행된 검사 범위 확인</text></g></svg>
