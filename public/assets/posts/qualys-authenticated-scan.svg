<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">같은 호스트·스캔에서 두 QID가 함께 보인다고 가정한 해석 예예요. 로그인 성공과 모든 파일 접근 성공을 구분해요. 인증 성공을 전체 취약점 검사의 완료나 안전 판정으로 해석하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="335" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="250" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="45" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 45h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">Windows 로그인</tspan><tspan x="86" dy="31">성공 예</tspan></text><text x="32" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 상태</tspan></text><text x="32" y="161" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Passed</tspan></text><text x="32" y="203" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 성공 QID</tspan></text><text x="32" y="234" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">70053</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="298" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">같은 스캔의 파일 접근</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">일부 파일 읽기 거부 QID</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">90399</tspan></text><text x="352" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">읽지 못한 파일</tspan></text><text x="352" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">해당 QID의 Results에</tspan><tspan x="352" dy="28">표시</tspan></text></g><g data-panel="actor"><rect x="656" y="16" width="288" height="303" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="691" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M686 43l14 10-14 10Z" fill="#7eaa93"/><text x="726" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="726" dy="0">남은 평가 근거 조사</tspan></text><text x="672" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">로그인</tspan></text><text x="672" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">성공</tspan></text><text x="672" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">파일 접근</tspan></text><text x="672" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">일부 거부</tspan></text><text x="672" y="256" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">다음 조사</tspan></text><text x="672" y="287" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">빠진 파일과 관련 검사 근거</tspan></text></g><path d="M307 141H320V165H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 165H640V167.5H65