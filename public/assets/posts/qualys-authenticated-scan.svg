<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">Passed에서 곧바로 전체 검사 성공으로 건너뛰지 않도록 접근할 자료와 평가 근거를 사이에 뒀어요. 제품 실행 결과를 재현한 화면은 아니에요. 인증 성공을 전체 취약점 검사의 완료나 안전 판정으로 해석하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="260" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="157" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="45" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 45h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">로그인 단계</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 보고서</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Passed</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">파일 · 레지스트리</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">다음 조건</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">실제로 읽을 권한</tspan></text></g><g data-panel="file"><rect x="656" y="16" width="288" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M672 32h23l9 9v32H672Z M695 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="672" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">취약점 평가 근거</tspan></text><text x="672" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">해석할 자료</tspan></text><text x="672" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">실행된 검사 · 평가 시점</tspan></text></g><path d="M307 94.5H320V114.5H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 114.5H640V114.5H650" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
