<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1158" viewBox="0 0 360 1158" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">xinetd 주 설정과 포함 파일의 관계</title><desc id="desc">주 설정에서 디렉터리로, 다시 서비스 파일로 이어지는 포함 경로예요. 예시 모드와 실제 수집된 운영 속성은 구별해서 읽어요. 화살표는 설정을 불러오는 관계이며 권한 상속이나 권한 변경을 뜻하지 않아요. 경로와 모드는 가상 입력이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1158" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="382" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/etc/xinetd.conf</tspan></text><text x="32" y="155" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">mode 0600</tspan></text><g data-illustration="permission-bits" data-mode="0600"><text x="81.33333333333334" y="192" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="36" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="49.77777777777778" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="67.55555555555556" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="81.33333333333334" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="99.11111111111111" y="202" width="27.555555555555557" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="112.88888888888889" y="224" font-s