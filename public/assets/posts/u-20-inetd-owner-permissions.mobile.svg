<svg xmlns="http://www.w3.org/2000/svg" width="360" height="513" viewBox="0 0 360 513" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">xinetd 주 설정과 포함 파일의 관계</title><desc id="desc">화살표는 포함 관계다. 주 설정의 권한이 서비스별 파일로 상속된다는 뜻은 아니다. 화살표는 설정을 불러오는 관계이며 권한 상속이나 권한 변경을 뜻하지 않는다. 경로와 모드는 가상 입력이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="513" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">주 설정 파일</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">/etc/xinetd.conf</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">가상 모드 0600</tspan></text><path d="M180 152v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="183" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="221" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">includedir</tspan></text><text x="32" y="256" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">/etc/xinetd.d</tspan></text><text x="32" y="290" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">읽을 디렉터리 지정</tspan></text><path d="M180 319v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="350" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="388" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">서비스 파일</tspan></text><text x="32" y="423" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">/etc/xinetd.d/example</tspan></text><text x="32" y="457" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">가상 모드 0644</tspan></text></g></svg>
