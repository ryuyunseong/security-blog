<svg xmlns="http://www.w3.org/2000/svg" width="360" height="549" viewBox="0 0 360 549" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">저장된 비밀번호 형식을 분류하기</title><desc id="desc">분기는 저장 형식을 읽는 방법을 고른다. 화살표가 양호·취약 판정이나 비밀번호 변경을 뜻하지는 않는다. 형식 분류와 계정의 최종 점검 판정은 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">$번호$ 형식인가</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">잠금 접두부 분리</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">저장값의 형식 조회</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">알고리즘 조회</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">$1$·$5$·$6$</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">새 비밀번호 정책과 대조</tspan></text><text x="60" y="374" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="386" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="424" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">기타 필드</tspan></text><text x="76" y="459" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">대상 OS 형식</tspan></text><text x="76" y="493" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">빈값·잠금·AIX 등 구분</tspan></text><path d="M180 147v18H26V414" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 414H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
