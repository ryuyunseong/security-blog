<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" data-diagram-kind="decision" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">U-26의 일반 파일 검색과 종류 구분</title><desc id="desc">종류별로 어느 검색에 들어가는지 구별했어요. 일반 파일 후보가 곧 악성 파일이라는 판정은 아니에요. find -type f가 고르는 일반 파일과 다른 종류를 나눠요. 예외 영역의 일반 파일도 수집 목록에 남겨 용도를 조사해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="440" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="928" height="408" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">st_mode로 종류 구별</tspan></text><rect x="28" y="79" width="904" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">종류</tspan></text><path d="M480 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="488" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="488" dy="0">분류</tspan></text><rect x="28" y="126" width="904" height="56" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><path d="M36 134h23l9 9v32H36Z M59 134v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="84" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="84" dy="0">일반 파일</tspan></text><path d="M480 126v56" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="488" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="488" dy="0">용도 조사 후보</tspan></text><rect x="28" y="182" width="904" height="56" rx="0" fill="#fff" stroke="#cadbd1"/><rect x="36" y="190" width="38" heig