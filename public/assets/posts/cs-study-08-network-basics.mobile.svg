<svg xmlns="http://www.w3.org/2000/svg" width="360" height="513" viewBox="0 0 360 513" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">원격 IPv4 목적지와 다음 홉을 나누는 가상 계산</title><desc id="desc">목적지 IP는 원격 서버를 가리키고 링크 주소를 구할 대상은 같은 연결망의 다음 홉이다. 192.0.2.0/24가 직접 연결된 가상 경로표다. 실제 ARP·소켓·패킷·운영 경로표는 수집하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="513" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">원격 목적지</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">198.51.100.8</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">직접 연결망 밖</tspan></text><path d="M180 152v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="183" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="221" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">가상 경로 선택</tspan></text><text x="32" y="256" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">198.51.100.0/24</tspan></text><text x="32" y="290" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">다음 홉 192.0.2.254</tspan></text><path d="M180 319v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="350" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="388" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">링크 전달 대상</tspan></text><text x="32" y="423" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">게이트웨이 주소</tspan></text><text x="32" y="457" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">목적지 IP와 구분</tspan></text></g></svg>
