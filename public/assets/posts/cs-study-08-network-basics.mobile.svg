<svg xmlns="http://www.w3.org/2000/svg" width="360" height="765" viewBox="0 0 360 765" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">원격 IPv4 목적지와 다음 홉을 나누는 가상 계산</title><desc id="desc">링크에서 보낼 곳은 게이트웨이지만 IP 패킷의 목적지는 원격 주소 그대로예요. 실제 ARP 교환과 정책 라우팅은 이 모형에 없어요. 192.0.2.0/24가 직접 연결된 가상 경로표예요. 실제 ARP·소켓·패킷·운영 경로표는 수집하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="765" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">보낼 IP 패킷</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">최종 목적지 IP</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">198.51.100.8</tspan></text></g><g data-panel="table"><rect x="16" y="224" width="328" height="209" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 경로 선택</tspan></text><rect x="28" y="287" width="304" height="118" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="319" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">목적지 경로:</tspan><tspan x="40" dy="31">198.51.100.0/24</tspan></text><text x="40" y="384" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">다음 홉: 192.0.2.254</tspan></text></g><g data-panel="actor"><rect x="16" y="481" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="497" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 509h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="519" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">현재 링크의 전달 대상</tspan></text><text x="32" y="575" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">게이트웨이 IP</tspan></text><text x="32" y="608" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">192.0.2.254</tspan></text><text x="32" y="651" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">패킷의 목적지 IP</tspan></text><text x="32" y="684" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">198.51.100.8</tspan></text></g><path d="M180 181V216" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 438V473" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
