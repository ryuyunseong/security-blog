<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">passwd의 x가 알려 주는 것</title><desc id="desc">계정 파일에서 필요한 표지와 메타데이터만 확인한다. x 표지와 파일 존재만으로 계정별 저장 상태를 확정하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">/etc/passwd</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">두 번째 필드: x</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">쉐도우 저장소 참조 표지</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">/etc/shadow</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">접근 권한과 저장 상태</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">해시 원문은 수집하지 않음</text></g></svg>
