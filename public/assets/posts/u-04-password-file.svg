<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">U-04 수집기의 두 가지 조회 범위</title><desc id="desc">passwd의 잠금 표지 집계에는 shadow 내부의 잠금 상태가 포함되지 않는다. 계정별 저장 방식과 실제 인증 동작은 별도로 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">/etc/passwd</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">필드 유형별 건수</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">x·잠금·빈 값 구분</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">/etc/shadow</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID·GID·모드만 조회</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">내용·대응 관계는 미검사</text></g></svg>
