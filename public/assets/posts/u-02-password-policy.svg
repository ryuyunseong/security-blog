<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">비밀번호 정책의 세 가지 확인 지점</title><desc id="desc">복잡성과 이력은 PAM 호출을, 사용 기간은 계정별 만료 정보까지 대조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">비밀번호 정책의 세 가지 확인 지점</text><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">복잡성</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">pwquality 설정과 인수</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">PAM 호출 경로 확인</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">사용 기간</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">신규 계정의 기본값</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">기존 계정의 만료 정보</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">재사용 제한</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">pwhistory 설정</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">검사 순서와 우회 분기</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">설정 후보를 읽는 일과 실제 인증 경로를 확인하는 일은 다르다.</text></g></svg>
