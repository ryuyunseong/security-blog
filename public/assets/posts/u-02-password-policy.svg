<svg xmlns="http://www.w3.org/2000/svg" width="960" height="375" viewBox="0 0 960 375" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">파일과 PAM 인수의 minlen 차이</title><desc id="desc">파일의 14보다 PAM 인수의 8이 우선하는 예시예요. 이 호출이 실제 비밀번호 변경 경로에 있는지는 별도로 따라가야 해요. 설정 후보를 읽는 일과 실제 인증 경로를 확인하는 일은 달라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="375" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="288" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">pwquality.conf</tspan></text><text x="32" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">파일의 길이 기준</tspan></text><text x="32" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">minlen = 14</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="343" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">PAM 호출의 인수</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">모듈</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">pam_pwquality.so</tspan></text><text x="352" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">호출 인수</tspan></text><text x="352" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">minlen=8</tspan></text><text x="352" y="296" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">실패 처리</tspan></text><text x="352" y="327" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">enforcing=0</tspan></text></g><g data-panel="actor"><rect x="656" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="691" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M686 43l14 10-14 10Z" fill="#7eaa93"/><text x="726" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="726" dy="0">이 호출이 적용될 때</tspan></text><text x="672" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">길이 기준</tspan></text><text x="672" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">8</tspan></text><text x="672" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">복잡성 실패</tspan></text><text x="672" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">경고로 끝날 수 있음</tspan></text></g><path d="M307 114.5H320V187.5H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 187.5H640V131H650" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
