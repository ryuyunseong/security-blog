<svg xmlns="http://www.w3.org/2000/svg" width="360" height="872" viewBox="0 0 360 872" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">가상 inetd 파일의 서비스 이름과 서버 파일</title><desc id="desc">shell의 2행 주석은 1행의 활성 후보를 없애지 않아요. TCP 포트는 정해 둔 대응값이며 실제 네트워크 관찰값은 아니에요. 가상 파일의 세 서비스 행을 독립적으로 비교한다. 포트는 가이드의 대응값이며 실제 대기 포트 조회 결과가 아니다. rsync 5행은 별도 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="872" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">shell → rsh</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">TCP 514</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">in.rshd</tspan></text><text x="32" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 파일 1행</tspan></text><text x="32" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">활성 행 후보</tspan></text><text x="32" y="262" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">같은 이름의 2행</tspan></text><text x="32" y="295" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">주석도 있음</tspan></text></g><g data-panel="actor"><rect x="16" y="352" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 368h23l9 9v32H32Z M55 368v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="390" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">login → rlogin</tspan></text><text x="32" y="446" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">TCP 513</tspan></text><text x="32" y="479" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">in.rlogind</tspan></text><text x="32" y="522" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 파일 3행</tspan></text><text x="32" y="555" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">주석 행만 있음</tspan></text></g><g data-panel="actor"><rect x="16" y="612" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 628h23l9 9v32H32Z M55 628v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="650" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">exec → rexec</tspan></text><text x="32" y="706" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">TCP 512</tspan></text><text x="32" y="739" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">in.rexecd</tspan></text><text x="32" y="782" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 파일 4행</tspan></text><text x="32" y="815" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">활성 행 후보</tspan></text></g></g></svg>
