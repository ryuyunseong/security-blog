<svg xmlns="http://www.w3.org/2000/svg" width="360" height="777" viewBox="0 0 360 777" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">가상 접근표의 첫 두 규칙 순서 비교</title><desc id="desc">두 표 모두 먼저 일치한 행에서 멈추는 가상 규칙이에요. 행 순서가 바뀌면 같은 요청의 계산 결과도 달라져요. 첫 일치에서 반환하는 가상 모형이에요. 단일 주소 거부와 넓은 주소 범위 허용의 순서를 바꿔 같은 요청을 비교했어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="777" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="372" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">192.0.2.13 · TCP 22:</tspan><tspan x="32" dy="31">거부 우선</tspan></text><rect x="28" y="110" width="304" height="120" rx="10" fill="#d5e8dc" stroke="#cadbd1"/><text x="40" y="142" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">순서: 1</tspan></text><text x="40" y="176" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">출발지: 192.0.2.13/32</tspan></text><text x="40" y="209" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">동작: deny</tspan></text><rect x="28" y="240" width="304" height="120" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="272" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">순서: 2</tspan></text><text x="40" y="306" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">출발지: 192.0.2.0/25</tspan></text><text x="40" y="339" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">동작: allow</tspan></text></g><g data-panel="table"><rect x="16" y="412" width="328" height="341" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="450" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">같은 요청: 허용 우선</tspan></text><rect x="28" y="475" width="304" height="120" rx="10" fill="#d5e8dc" stroke="#cadbd1"/><text x="40" y="507" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">순서: 1</tspan></text><text x="40" y="541" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">출발지: 192.0.2.0/25</tspan></text><text x="40" y="574" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">동작: allow</tspan></text><rect x="28" y="605" width="304" height="120" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="637" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">순서: 2</tspan></text><text x="40" y="671" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">출발지: 192.0.2.13/32</tspan></text><text x="40" y="704" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">동작: deny</tspan></text></g></g></svg>
