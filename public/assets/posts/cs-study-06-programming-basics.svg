<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">음수 정수 나눗셈의 몫과 나머지 비교</title><desc id="desc">입력은 같은 두 정수다. Python 쪽에는 정수 몫을 내리는 // 연산자를 사용했다. 피연산자는 정수 -7과 3이다. Python의 / 실수 나눗셈과 비교한 그림이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">C11 · Java 25</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">-7 / 3 = -2</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">-7 % 3 = -1</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">Python 3.12</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">-7 // 3 = -3</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">-7 % 3 = 2</text></g></svg>
