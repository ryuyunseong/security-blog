<svg xmlns="http://www.w3.org/2000/svg" width="360" height="607" viewBox="0 0 360 607" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">가상 NFS 유닛의 현재 활성 상태와 기동 설정</title><desc id="desc">화살표는 한 유닛에 속한 속성값 두 개를 가리켜요. 가상 disabled-active 사례의 같은 유닛에서 두 속성을 얻었다는 가정이다. 실제 systemd 조회·NFS 실행·서비스 변경 결과가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="607" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="149" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">nfs-server.service</tspan></text><text x="52" y="99" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">usage</tspan></text><text x="52" y="132" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">unused</tspan></text></g><g data-panel="actor"><rect x="36" y="213" width="308" height="149" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="251" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">ActiveState</tspan></text><text x="52" y="296" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">현재</tspan></text><text x="52" y="329" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">active</tspan></text></g><g data-panel="actor"><rect x="36" y="410" width="308" height="149" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="448" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">UnitFileState</tspan></text><text x="52" y="493" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">기동 설정</tspan></text><text x="52" y="526" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">disabled</tspan></text></g><path d="M36 90.5H16V287.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 90.5H16V484.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
