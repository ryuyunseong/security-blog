<svg xmlns="http://www.w3.org/2000/svg" width="360" height="549" viewBox="0 0 360 549" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">해석한 경로가 허용 폴더 안에 있는가</title><desc id="desc">실제 경로가 기준 폴더 안에 있으면 일반 파일인지 검사한다. 폴더 밖 경로는 거부한다. 경로 해석과 열기 사이의 파일 변경 경쟁은 이 예제가 해결하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">내부 경로인가</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">resolve 후 포함 검사</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">상대 경로만 입력</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">일반 파일 검사</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">파일이면 읽기 진행</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">없는 파일·디렉터리는 거부</tspan></text><text x="60" y="374" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="386" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="424" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">범위 거부</tspan></text><text x="76" y="459" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">이웃 폴더·외부 링크</tspan></text><text x="76" y="493" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">파일 내용을 반환하지 않음</tspan></text><path d="M180 147v18H26V414" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 414H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
