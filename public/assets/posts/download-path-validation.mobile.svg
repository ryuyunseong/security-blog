<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684" data-diagram-kind="decision" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">해석한 경로가 허용 폴더 안에 있는가</title><desc id="desc">접두부가 같은 이웃 폴더를 나란히 그렸어요. 경로를 해석한 뒤 실제 포함 관계를 비교해야 둘을 구별할 수 있어요. 경로 해석과 열기 사이의 파일 변경 경쟁은 이 예제가 해결하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="684" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="310" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/app/files/</tspan><tspan x="32" dy="31">report.txt</tspan></text><text x="32" y="184" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">허용 루트</tspan></text><text x="32" y="217" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/app/files</tspan></text><text x="32" y="260" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">해석 결과</tspan></text><text x="32" y="293" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">루트 내부</tspan></text></g><g data-panel="file"><rect x="16" y="350" width="328" height="310" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 366h23l9 9v32H32Z M55 366v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="442" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/app/files_backup/</tspan><tspan x="32" dy="31">secret.txt<