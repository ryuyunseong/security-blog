<svg xmlns="http://www.w3.org/2000/svg" width="360" height="736" viewBox="0 0 360 736" data-diagram-kind="topology" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">Cloud Agent와 Scanner는 플랫폼으로 HTTPS 연결을 시작한다. 선은 작업·결과 통신을 나타내며 대상 검사 경로를 뜻하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="736" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">두 센서가 플랫폼과 통신하는</tspan><tspan x="16" dy="31">경로</tspan></text><rect x="52" y="104" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">Cloud Agent</tspan></text><text x="68" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">호스트 내부 정보</tspan></text><text x="68" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">VM 활성화·평가 시점</tspan></text><rect x="52" y="259" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="297" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">Scanner</tspan></text><text x="68" y="332" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">대상 네트워크 검사</tspan></text><text x="68" y="366" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">대상까지의 접근 경로</tspan></text><text x="52" y="436" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="52" dy="0">HTTPS로 플랫폼 연결</tspan></text><path d="M52 169.5H26V445H180V455 M52 324.5H26" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="461" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="499" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">Qualys 플랫폼</tspan></text><text x="32" y="534" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">작업·업데이트·결과</tspan></text><text x="32" y="568" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">최신 평가 결과 확인</tspan></text><path d="M16 616H344" stroke="#cadbd1"/><text x="16" y="652" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">선은 플랫폼 통신이다. 센서에서</tspan><tspan x="16" dy="28">검사 대상까지의 접근 경로는</tspan><tspan x="16" dy="28">별도다.</tspan></text></g></svg>
