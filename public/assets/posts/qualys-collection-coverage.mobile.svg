<svg xmlns="http://www.w3.org/2000/svg" width="360" height="536" viewBox="0 0 360 536" data-diagram-kind="topology" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">선은 센서에서 플랫폼으로 시작하는 HTTPS 통신이다. 검사 대상까지의 접근 경로는 생략했다. 선은 플랫폼 통신이다. 센서에서 검사 대상까지의 접근 경로는 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="536" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="52" y="16" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">Cloud Agent</tspan></text><text x="68" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">호스트 내부 정보</tspan></text><text x="68" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">VM 활성화·평가 시점</tspan></text><rect x="52" y="171" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="209" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">Scanner</tspan></text><text x="68" y="244" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">대상 네트워크 검사</tspan></text><text x="68" y="278" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">대상까지의 접근 경로</tspan></text><text x="52" y="348" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="52" dy="0">HTTPS로 플랫폼 연결</tspan></text><path d="M52 81.5H26V357H180" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M52 236.5H26" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M180 357V367" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="373" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="411" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">Qualys 플랫폼</tspan></text><text x="32" y="446" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">작업·업데이트·결과</tspan></text><text x="32" y="480" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">최신 평가 결과 확인</tspan></text></g></svg>
