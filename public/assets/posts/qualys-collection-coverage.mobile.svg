<svg xmlns="http://www.w3.org/2000/svg" width="360" height="908" viewBox="0 0 360 908" data-diagram-kind="topology" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">두 수집 주체가 플랫폼으로 연결되는 관계예요. Scanner가 대상에 닿는 경로와 호스트 내부 평가의 범위는 따로 살펴야 해요. 선은 플랫폼 통신을 나타내요. 센서에서 검사 대상까지의 접근 경로는 별도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="908" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="256" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">호스트 안의 Cloud</tspan><tspan x="106" dy="31">Agent</tspan></text><text x="52" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">수집 위치</tspan></text><text x="52" y="163" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">호스트 내부</tspan></text><text x="52" y="206" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">평가 조건</tspan></text><text x="52" y="239" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">VM 활성화 · 평가 시점</tspan></text></g><g data-panel="actor"><rect x="36" y="320" width="308" height="256" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="336" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 348h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="358" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">네트워크 쪽</tspan><tspan x="106" dy="31">Scanner</tspan></text><text x="52" y="434" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">수집 위치</tspan></text><text x="52" y="467" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">대상 네트워크</tspan></text><text x="52" y="510" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">검사 조건</tspan></text><text x="52" y="543" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">대상까지 접근 경로</tspan></text></g><g data-panel="actor"><rect x="36" y="624" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M59 674a10 10 0 0 1 0-20a14 14 0 0 1 27-2a11 11 0 0 1 3 22Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="662" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">Qualys 플랫폼</tspan></text><text x="52" y="718" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">연결</tspan></text><text x="52" y="751" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">HTTPS</tspan></text><text x="52" y="794" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">모으는 자료</tspan></text><text x="52" y="827" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">작업 · 업데이트 · 결과</tspan></text></g><path d="M36 144H16V742H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 448H16V742H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
