<svg xmlns="http://www.w3.org/2000/svg" width="360" height="987" viewBox="0 0 360 987" data-diagram-kind="topology" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">연결선은 관리 통신과 대상 검사 경로를 구분해요. 플랫폼에 연결됐다는 사실만으로 대상까지 검사됐다고 볼 수는 없어요. 선은 플랫폼 통신을 나타내요. 센서에서 검사 대상까지의 접근 경로는 별도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="987" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="332" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">호스트 안의 Cloud</tspan><tspan x="86" dy="31">Agent</tspan></text><text x="32" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 위치</tspan></text><text x="32" y="163" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">설치된 호스트 내부</tspan></text><text x="32" y="206" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">플랫폼 연결</tspan></text><text x="32" y="239" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">HTTPS 443</tspan></text><text x="32" y="282" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">평가 조건</tspan></text><text x="32" y="315" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">VM 활성화 · 평가 시점</tspan></text></g><g data-panel="attachments"><rect x="16" y="372" width="328" height="591" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="410" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">스캐너의 두 통신 경로</tspan></text><rect x="40" y="435" width="280" height="112" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><rect x="162" y="447" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M170 459h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="180" y="519" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="180" dy="0">Scanner Appliance</tspan></text><rect x="64" y="599" width="264" height="167" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M87 645a10 10 0 0 1 0-20a14 14 0 0 1 27-2a11 11 0 0 1 3 22Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="126" y="633" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="126" dy="0">Qualys 플랫폼</tspan></text><text x="80" y="678" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="80" dy="0">HTTPS 443:</tspan><tspan x="80" dy="28">작업·업데이트 수신,</tspan><tspan x="80" dy="28">상태·결과 전송</tspan></text><path d="M40 491H28V682.5H58" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="790" width="264" height="139" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="80" y="802" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M88 814h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="126" y="824" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="126" dy="0">허가된 검사 대상</tspan></text><text x="80" y="869" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="80" dy="0">포트·QID·인증 조건에</tspan><tspan x="80" dy="28">따른 검사</tspan></text><path d="M40 491H28V859.5H58" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></g></svg>
