<svg xmlns="http://www.w3.org/2000/svg" width="960" height="333" viewBox="0 119 960 333" data-diagram-kind="cycle" role="img" aria-labelledby="title desc"><title id="title">요구조건과 실행 사례를 대조하는 반복</title><desc id="desc">수정한 조건의 재시험과 기존 사례의 회귀를 함께 반복한다. 순환선은 단계별 소요 시간이나 일정 비율을 나타내지 않는다. 이 그림은 개발 모델이나 UML 상태 다이어그램의 표준 표기가 아니라 이 글 예제의 검토 반복을 설명한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="119" width="960" height="333" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M600 214Q744 218 744 298" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 377H347" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M215 308Q211 211 350 211" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="143" width="240" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="382" y="177" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">요구조건 정의</text><text x="382" y="210" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">금액 0~100000</text><text x="382" y="239" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">50000부터 무료</text><rect x="620" y="308" width="250" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="642" y="342" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">사례 실행</text><text x="642" y="375" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">경계·범위 오류</text><text x="642" y="404" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">상태 허용·거부</text><rect x="90" y="308" width="250" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="112" y="342" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">비교·수정</text><text x="112" y="375" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">기대값과 대조</text><text x="112" y="404" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">기존 사례 재실행</text></g></svg>
