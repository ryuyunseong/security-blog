<svg xmlns="http://www.w3.org/2000/svg" width="360" height="471" viewBox="0 0 360 471" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">음수 정수 나눗셈의 몫과 나머지 비교</title><desc id="desc">화살표는 몫에 3을 곱한 위치에서 나머지만큼 이동하는 방향이에요. 두 계산 모두 끝점은 -7이며 축은 정수 간격에 비례해요. 피연산자는 정수 -7과 3이며 Python의 / 실수 나눗셈과 비교한 그림은 아니에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="471" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="numberline"><rect x="16" y="16" width="328" height="431" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">같은 -7, 다른 몫과 나머지</tspan></text><text x="32" y="101" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">C11 · Java 25</tspan></text><path d="M50 128h260" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M50 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="50" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="50" dy="0">-9</tspan></text><path d="M136.66666666666669 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="136.66666666666669" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="136.66666666666669" dy="0">-8</tspan></text><path d="M223.33333333333334 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="223.33333333333334" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="223.33333333333334" dy="0">-7</tspan></text><path d="M310 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="310" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="310" dy="0">-6</tspan></text><path d="M310 186H223.33333333333334" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="223.33333333333334" cy="186" r="5" fill="#193e2f"/><text x="32" y="228" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">-2 × 3 + (-1) = -7</tspan></text><text x="32" y="280" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Python 3.12</tspan></text><path d="M50 307h260" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M50 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="50" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="50" dy="0">-9</tspan></text><path d="M136.66666666666669 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="136.66666666666669" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="136.66666666666669" dy="0">-8</tspan></text><path d="M223.33333333333334 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="223.33333333333334" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="223.33333333333334" dy="0">-7</tspan></text><path d="M310 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="310" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="310" dy="0">-6</tspan></text><path d="M50 365H223.33333333333334" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="223.33333333333334" cy="365" r="5" fill="#193e2f"/><text x="32" y="407" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">-3 × 3 + 2 = -7</tspan></text></g></g></svg>
