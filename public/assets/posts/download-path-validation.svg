<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">해석한 경로가 허용 폴더 안에 있는가</title><desc id="desc">실제 경로가 기준 폴더 안에 있으면 일반 파일인지 검사한다. 폴더 밖 경로는 거부한다. 경로 해석과 열기 사이의 파일 변경 경쟁은 이 예제가 해결하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">내부 경로인가</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">resolve 후 포함 검사</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">상대 경로만 입력</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">일반 파일 검사</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">파일이면 읽기 진행</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">없는 파일·디렉터리는 거부</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">범위 거부</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">이웃 폴더·외부 링크</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">파일 내용을 반환하지 않음</text></g></svg>
