<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">비슷한 문자열과 실제 디렉터리 경계</title><desc id="desc">startswith로는 files와 files_backup의 디렉터리 경계를 구분할 수 없다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">비슷한 문자열과 실제 디렉터리 경계</text><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700">files/report.txt</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400">허용 폴더 내부</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400">해석 후 포함 관계 확인</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700">files_backup/secret.txt</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400">files와 같은 접두사</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400">실제 경로는 이웃 폴더</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">resolve로 경로를 해석한 뒤 is_relative_to로 포함 관계를 확인한다.</text></g></svg>
