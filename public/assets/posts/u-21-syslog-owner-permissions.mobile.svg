<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1018" viewBox="0 0 360 1018" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">로그 설정의 소유자와 권한을 조사하는 세 지점</title><desc id="desc">허용 소유자와 일반 권한 조건이 같은 설정 파일에 함께 적용돼요. 실제 경로와 계정은 해당 OS 자료로 대조해야 해요. 세 항목은 별도의 조사 자료예요. 코드의 계정명과 모드는 가상 입력이며 실제 로그 전송이나 권한을 수집하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1018" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="set"><rect x="36" y="16" width="308" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">원문이 제시한 소유자</tspan></text><rect x="52" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="97" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="97" dy="0">root</tspan></text><rect x="152" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="197" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="197" dy="0">bin</tspan></text><rect x="52" y="139" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="97" y="170" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="97" dy="0">sys</tspan></text></g><g data-panel="file"><rect x="36" y="261" width="308" height="382" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 277h23l9 9v32H52Z M75 277v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="353" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">일반 권한 기준</tspan></text><text x="5