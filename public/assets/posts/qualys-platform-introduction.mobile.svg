<svg xmlns="http://www.w3.org/2000/svg" width="360" height="769" viewBox="0 0 360 769" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">Qualys의 플랫폼·앱·수집 구성</title><desc id="desc">정보를 수집하는 구성과 그 정보를 사용하는 앱을 플랫폼에 연결했어요. 실제로 제공되는 앱은 구독과 권한 범위에 따라 확인해요. 세 구성의 역할을 구분한 개념도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="769" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">호스트 · 네트워크</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 구성</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Cloud Agent · 스캐너</tspan></text></g><g data-panel="actor"><rect x="16" y="224" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M39 274a10 10 0 0 1 0-20a14 14 0 0 1 27-2a11 11 0 0 1 3 22Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">Qualys 플랫폼</tspan></text><text x="32" y="318" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">공유할 자료</tspan></text><text x="32" y="351" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">자산 · 수집 정보 