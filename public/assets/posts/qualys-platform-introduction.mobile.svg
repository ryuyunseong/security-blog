<svg xmlns="http://www.w3.org/2000/svg" width="360" height="473" viewBox="0 0 360 473" data-diagram-kind="layers" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">Qualys의 플랫폼·앱·수집 구성</title><desc id="desc">에이전트와 스캐너 외에도 클라우드 커넥터 등으로 정보를 수집할 수 있다. 세 구성의 역할을 구분한 개념도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="473" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">플랫폼</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">수집 정보 저장·연계</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">자산·결과를 함께 관리</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">보안 앱</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">VMDR·CSAM 등</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">목적별 분석과 보고서</tspan></text><rect x="16" y="310" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="348" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">수집 구성</tspan></text><text x="32" y="383" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">Cloud Agent·스캐너</tspan></text><text x="32" y="417" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">대상 호스트·네트워크 조회</tspan></text></g></svg>
