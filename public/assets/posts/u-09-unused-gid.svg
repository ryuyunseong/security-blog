<svg xmlns="http://www.w3.org/2000/svg" width="960" height="483" viewBox="0 0 960 483" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">구성원 없는 그룹이 곧 불필요한 그룹은 아니다</title><desc id="desc">alice 그룹의 구성원 칸이 비어 있어도 기본 GID가 연결돼 있어요. 서비스와 파일의 GID 사용 여부는 이 두 표 밖에서 더 조사해야 해요. 계정 연결이 없는 그룹은 검토 후보로 남기고 용도를 확인해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="483" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="410" height="172" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">passwd</tspan></text><rect x="28" y="79" width="386" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">계정</tspan></text><path d="M221 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="229" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="229" dy="0">기본 GID</tspan></text><rect x="28" y="126" width="386" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">alice</tspan></text><path d="M221 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="229" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="229" dy="0">1000</tspan></text></g><g data-panel="table"><rect x="16" y="212" width="410" height="247" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="250" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy