<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">구성원 없는 그룹이 곧 불필요한 그룹은 아니다</title><desc id="desc">기본·보조 구성원을 조회하고 서비스와 파일에서 해당 GID를 사용하는지 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">구성원 없는 그룹이 곧 불필요한 그룹은 아니다</text><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">계정 연결</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">기본 GID · 추가 그룹</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">두 경로 모두 확인</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">운영 연결</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">서비스 실행 그룹</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">예약 작업 · 할당 계획</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">파일 연결</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">숫자 소유 GID</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">삭제해도 번호는 남음</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">계정 연결이 없는 그룹은 검토 후보로 남기고 용도를 확인한다.</text></g></svg>
