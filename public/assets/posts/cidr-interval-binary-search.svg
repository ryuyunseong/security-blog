<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">CIDR 목록을 정수 구간으로 바꾸기</title><desc id="desc">정리된 시작점 배열에서 이진 탐색으로 후보 구간을 좁힌다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">CIDR 목록을 정수 구간으로 바꾸기</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">구간 만들기</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">네트워크 · 마지막 주소</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">IPv4를 정수로 변환</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">정렬하고 병합</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">겹치거나 인접한 범위</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">합집합의 의미 유지</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">후보 하나 찾기</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">시작점 ≤ 조회 IP</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">끝점까지 포함되는지 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">거부 규칙과 우선순위가 있는 방화벽 정책으로 그대로 확장하지 않는다.</text></g></svg>
