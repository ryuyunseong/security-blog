<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="intervals" role="img" aria-labelledby="title desc"><title id="title">192.0.2.0/24 안의 중첩·인접 구간</title><desc id="desc">인접한 두 /25를 합치면 0~255가 된다. 그 안의 /26은 주소를 추가하지 않는다. 별도의 /32는 이 그림에서 제외했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">192.0.2.0/24 안의 중첩·인접 구간</text><path d="M300 145V437" stroke="#dbe6df"/><text x="300" y="462" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">0</text><path d="M450 145V437" stroke="#dbe6df"/><text x="450" y="462" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">64</text><path d="M600 145V437" stroke="#dbe6df"/><text x="600" y="462" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">128</text><path d="M750 145V437" stroke="#dbe6df"/><text x="750" y="462" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">192</text><path d="M897.65625 145V437" stroke="#dbe6df"/><text x="897.65625" y="462" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">255</text><text x="44" y="188" font-size="18" fill="#193e2f" font-weight="700" text-anchor="start">192.0.2.0/25</text><rect x="300" y="166" width="300" height="26" rx="4" fill="#9abfa9"/><text x="300" y="213" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">0 ~ 127</text><text x="44" y="255" font-size="18" fill="#193e2f" font-weight="700" text-anchor="start">192.0.2.128/25</text><rect x="600" y="233" width="300" height="26" rx="4" fill="#9abfa9"/><text x="600" y="280" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">128 ~ 255</text><text x="44" y="322" font-size="18" fill="#193e2f" font-weight="700" text-anchor="start">192.0.2.64/26</text><rect x="450" y="300" width="150" height="26" rx="4" fill="#9abfa9"/><text x="450" y="347" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">64 ~ 127</text><text x="44" y="389" font-size="18" fill="#193e2f" font-weight="700" text-anchor="start">병합 결과</text><rect x="300" y="367" width="600" height="26" rx="4" fill="#287056"/><text x="300" y="414" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">0 ~ 255</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">가로축은 주소의 마지막 옥텟이다. 양 끝 주소를 모두 포함한다.</text></g></svg>
