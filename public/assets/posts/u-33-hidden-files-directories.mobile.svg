<svg xmlns="http://www.w3.org/2000/svg" width="360" height="502" viewBox="0 0 360 502" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">점 이름과 숨김 디렉터리 내부 파일</title><desc id="desc">점 이름의 존재는 내용의 악성 여부를 판정하는 자료가 아니다. 끝 이름의 점 여부와 상위 디렉터리의 점 이름을 구별한다. 가상 트리의 두 파일을 비교하며 Windows 숨김 속성이나 악성 여부를 판단하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="502" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="219" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">자기 이름이 점으로 시작</tspan></text><g data-illustration="path-tree"><path d="M32 77v24h36V77H49l-5-6H32v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="80" y="96" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">docs/</text><path d="M50 108v38h28" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M80 126h23l9 9v29H80Z M103 126v9h9" fill="#f8e9b8" stroke="#536b60" stroke-width="2"/><text x="124" y="153" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">.draft.txt</text></g><text x="32" y="203" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">끝 이름: .draft.txt</tspan></text><rect x="16" y="251" width="328" height="219" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">상위 이름이 점으로 시작</tspan></text><g data-illustration="path-tree"><path d="M32 312v24h36V312H49l-5-6H32v6Z" fill="#f8e9b8" stroke="#536b60" stroke-width="2"/><text x="80" y="331" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">.cache/</text><path d="M50 343v38h28" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M80 361h23l9 9v29H80Z M103 361v9h9" fill="#fff" stroke="#536b60" stroke-width="2"/><text x="124" y="388" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">session.txt</text></g><text x="32" y="438" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">끝 이름: session.txt</tspan></text></g></svg>
