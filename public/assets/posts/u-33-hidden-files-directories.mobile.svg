<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">점 이름과 숨김 디렉터리 내부 파일</title><desc id="desc">점 이름의 존재는 내용의 악성 여부를 판정하는 자료가 아니다. 끝 이름의 점 여부와 상위 디렉터리의 점 이름을 구별한다. 가상 트리의 두 파일을 비교하며 Windows 숨김 속성이나 악성 여부를 판단하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="326" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">자기 이름이 점으로 시작</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">docs/.draft.txt</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">끝 이름: .draft.txt</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">상위 이름이 점으로 시작</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">.cache/session.txt</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">끝 이름: session.txt</tspan></text></g></svg>
