<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">서비스 이름표를 조회하는 순서</title><desc id="desc">53은 이 가상 이름표의 반환값이며 실제 연결이나 대기 상태의 측정값이 아니다. 가상 파일의 조회 순서다. 별칭도 해당 행의 번호·프로토콜로 조회하며 실제 소켓 상태는 수집하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">조회할 입력</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">domain + udp</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">이름과 프로토콜 지정</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">같은 키 찾기</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">(domain, udp)</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">tcp 행과 구분</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">등록값 반환</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">53</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">소켓 상태는 별도 자료</text></g></svg>
