<svg xmlns="http://www.w3.org/2000/svg" width="360" height="792" viewBox="0 0 360 792" data-diagram-kind="topology" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 ro 옵션에서 host1과 전체 대상 표기의 차이</title><desc id="desc">선은 각각의 가상 입력이 지정한 공유 경로를 연결해요. bound-ro와 all-clients를 비교한 설명 그림이다. 두 가상 입력은 독립된 사례이며 실제 접속·동시 공유 적용 결과가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="792" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">bound-ro</tspan></text><text x="52" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">대상</tspan></text><text x="52" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">host1</tspan></text><text x="52" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">옵션</tspan></text><text x="52" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">ro,root_squash</tspan></text></g><g data-panel="actor"><rect x="36" y="300" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="316" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 328h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="338" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">all-clients</tspan></text><text x="52" y="394" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">대상</tspan></text><text x="52" y="427" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">* (전체 클라이언트)</tspan></text><text x="52" y="470" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">옵션</tspan></text><text x="52" y="503" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">ro,root_squash</tspan></text></g><g data-panel="actor"><rect x="36" y="584" width="308" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 608v28h38V608H72l-8-8H52v8Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="622" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">/home/example</tspan></text><text x="52" y="678" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">공유 경로</tspan></text><text x="52" y="711" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">가상 입력 두 건에서 동일</tspan></text></g><path d="M36 134H16V664H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 418H16V664H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
