<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 148 960 220" data-diagram-kind="timeline" role="img" aria-labelledby="title desc"><title id="title">별도 Bash에서 TMOUT=2를 시험한다</title><desc id="desc">별도 Bash에서 TMOUT=2로 유휴 종료를 시험했다. 운영 로그인 경로의 600초 설정과 네트워크 연결 종료는 시험 범위 밖이다. 2초 유휴 종료 실습이다. 운영 로그인 경로의 600초 적용 시험은 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="148" width="960" height="220" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M110 232H850" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="130" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">새 셸 시작</text><text x="130" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">env -i · TMOUT=2</text><text x="130" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">시작 파일 생략</text><circle cx="480" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="480" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">프롬프트 대기</text><text x="480" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">입력 없이 2초</text><text x="480" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">별도 가상 터미널</text><circle cx="830" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="830" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">셸 자동 종료</text><text x="830" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">auto-logout 메시지</text><text x="830" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">실제 출력과 대조</text></g></svg>
