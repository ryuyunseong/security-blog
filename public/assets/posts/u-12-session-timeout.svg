<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">유휴 셸 설정과 실제 세션을 나눠 본다</title><desc id="desc">설정 파일의 값뿐 아니라 새 로그인 세션에 적용된 값과 유휴 종료를 확인한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">유휴 셸 설정과 실제 세션을 나눠 본다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">로그인 경로</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">계정 · 셸 · 시작 파일</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">적용 대상을 먼저 확인</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">설정과 유효값</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">TMOUT · autologout</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">값과 단위를 대조</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">새 세션 시험</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">유휴 종료 시각</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">예외와 영향 기록</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">TMOUT은 모든 실행 중 작업을 10분에 종료하는 설정이 아니다.</text></g></svg>
