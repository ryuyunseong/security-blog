<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">여덟 원소를 FIFO로 전부 꺼내는 두 구현</title><desc id="desc">같은 여덟 원소를 전부 꺼낸다. 이동 모형과 호출 수는 서로 다른 연산이며 초 단위 시간 비교가 아니다. 리스트 이동 칸 수는 남은 원소 수를 합산한 모형이다. 두 수치는 서로 다른 연산이며 실행 시간을 측정하지 않았다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="326" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">list.pop(0)</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">8건 FIFO</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">앞당김 모형 28칸</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">deque.popleft()</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">8건 FIFO</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">삭제 호출 8회</tspan></text></g></svg>
