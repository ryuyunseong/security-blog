<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">UMASK 0022와 0031의 일반 파일 생성 권한</title><desc id="desc">0646의 마지막 6에는 기타 사용자 쓰기 2가 포함된다. 숫자 크기 비교만으로 이 비트를 알아낼 수 없다. 기본 ACL이 없는 부모 디렉터리에서 새 일반 파일을 0666으로 요청한 가상 계산이다. 숫자 크기와 쓰기 비트 차단은 별도 비교다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="326" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">umask 0022</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청 0666 → 0644</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">그룹·기타 쓰기 차단</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">umask 0031</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청 0666 → 0646</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">기타 쓰기 비트 남음</tspan></text></g></svg>
