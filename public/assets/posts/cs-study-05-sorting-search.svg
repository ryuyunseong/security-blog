<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">삽입 정렬에서 정렬된 앞부분이 늘어나는 과정</title><desc id="desc">각 단계가 끝난 전체 배열이다. 아직 처리하지 않은 뒤쪽 원소도 함께 표시했다. 입력은 [5, 2, 4, 2]다. 각 노드는 삽입 한 단계가 끝난 전체 배열이며 화살표 간격은 시간에 비례하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">2를 삽입</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">[2, 5, 4, 2]</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">앞의 두 원소 정렬</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">4를 삽입</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">[2, 4, 5, 2]</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">앞의 세 원소 정렬</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">두 번째 2 삽입</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">[2, 2, 4, 5]</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">네 원소 정렬 완료</text></g></svg>
