<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">가상 승인 대역과 수집 대역이 갈라지는 마지막 옥텟</title><desc id="desc">x는 주소의 마지막 숫자예요. 양 끝을 포함해 주소를 세므로 네트워크 주소와 브로드캐스트 주소도 개수에 들어가요. 가상 승인 기록보다 수집 기록에 주소 16개가 더 있어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="260" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="448" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">승인 /28</tspan></text><rect x="28" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">192.0.2.x의 x</tspan></text><path d="M240 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="248" dy="0">포함 여부</tspan></text><rect x="28" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">0~15</tspan></text><path d="M240 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">포함</tspan></text><rect x="28" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">16~31</tspan></text><path d="M240 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">제외</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">수집 /27</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">192.0.2.x의 x</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">포함 여부</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">0~15</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">포함</tspan></text><rect x="508" y="170" width="424" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">16~31</tspan></text><path d="M720 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">포함</tspan></text></g></g></svg>
