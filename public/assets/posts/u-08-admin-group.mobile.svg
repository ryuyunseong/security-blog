<svg xmlns="http://www.w3.org/2000/svg" width="360" height="673" viewBox="0 0 360 673" data-diagram-kind="merge" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">root 그룹의 구성원은 두 곳에서 찾는다</title><desc id="desc">기본 그룹과 명시적 추가 그룹을 합친 뒤 승인 계정과 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="673" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">root 그룹의 구성원은 두</tspan><tspan x="16" dy="31">곳에서 찾는다</tspan></text><rect x="52" y="104" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">기본 그룹</tspan></text><text x="68" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">passwd의 GID 필드</tspan></text><text x="68" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">예: deploy의 GID = 0</tspan></text><rect x="52" y="259" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="297" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">추가 그룹</tspan></text><text x="68" y="332" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">group의 구성원 필드</tspan></text><text x="68" y="366" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">예: root:x:0:audit</tspan></text><path d="M52 169.5H26V410H180V420 M52 324.5H26" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="426" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="464" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">합쳐서 대조</tspan></text><text x="32" y="499" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">root · deploy · audit</tspan></text><text x="32" y="533" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">승인 목록과 비교</tspan></text><path d="M16 581H344" stroke="#cadbd1"/><text x="16" y="617" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">group의 구성원 칸이 비어 있어도</tspan><tspan x="16" dy="28">기본 그룹 사용자는 남아 있다.</tspan></text></g></svg>
