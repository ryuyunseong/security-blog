<svg xmlns="http://www.w3.org/2000/svg" width="360" height="471" viewBox="0 0 360 471" data-diagram-kind="cycle" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">50000원 앞뒤의 배송비 비교</title><desc id="desc">0~100000원의 가상 정수 입력 중 50000 근처만 확대한 축이에요. 양쪽 생략 범위는 본문의 허용 구간과 함께 읽어요. 가상 허용 범위는 0~100000원이에요. 수직선은 원 단위이며 49999~50001만 보여 주고 나머지 구간은 생략했어요. 실제 배송비 정책을 뜻하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="471" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="numberline"><rect x="16" y="16" width="328" height="431" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">배송비가 바뀌는 경계</tspan></text><text x="32" y="101" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">49999원: 배송비 3000원</tspan></text><path d="M50 128h260" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M50 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="50" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="50" dy="0">49999</tspan></text><path d="M180 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="180" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">50000</tspan></text><path d="M310 123v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="310" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="310" dy="0">50001</tspan></text><circle cx="50" cy="186" r="5" fill="#193e2f"/><text x="32" y="228" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">50000 미만</tspan></text><text x="32" y="280" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">50000원: 배송비 0원</tspan></text><path d="M50 307h260" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M50 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="50" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="50" dy="0">49999</tspan></text><path d="M180 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="180" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="180" dy="0">50000</tspan></text><path d="M310 302v10" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="310" y="337" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="310" dy="0">50001</tspan></text><circle cx="180" cy="365" r="5" fill="#193e2f"/><text x="32" y="407" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">50000 이상</tspan></text></g></g></svg>
