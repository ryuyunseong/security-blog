<svg xmlns="http://www.w3.org/2000/svg" width="360" height="513" viewBox="0 0 360 513" data-diagram-kind="cycle" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">요구조건과 실행 사례를 대조하는 반복</title><desc id="desc">수정한 조건의 재시험과 기존 사례의 회귀를 함께 반복한다. 순환선은 단계별 소요 시간이나 일정 비율을 나타내지 않는다. 이 그림은 개발 모델이나 UML 상태 다이어그램의 표준 표기가 아니라 이 글 예제의 검토 반복을 설명한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="513" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="42" y="16" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">요구조건 정의</tspan></text><text x="58" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">금액 0~100000</tspan></text><text x="58" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">50000부터 무료</tspan></text><path d="M193 152v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="183" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="221" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">사례 실행</tspan></text><text x="58" y="256" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">경계·범위 오류</tspan></text><text x="58" y="290" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">상태 허용·거부</tspan></text><path d="M193 319v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="350" width="302" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="58" y="388" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="58" dy="0">비교·수정</tspan></text><text x="58" y="423" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">기대값과 대조</tspan></text><text x="58" y="457" font-size="20" fill="#536b60" font-weight="400"><tspan x="58" dy="0">기존 사례 재실행</tspan></text><path d="M42 415.5H20V44H36" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
