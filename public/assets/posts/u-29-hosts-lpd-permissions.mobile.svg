<svg xmlns="http://www.w3.org/2000/svg" width="360" height="549" viewBox="0 0 360 549" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">hosts.lpd 부재 근거와 수집 상태 분리</title><desc id="desc">조회 실패를 파일 부재로 바꾸면 ‘예’ 쪽으로 잘못 분류된다. 가상 수집 자료를 나누는 분기다. 미수집은 보류하며 존재가 입증된 일반 파일의 사용 필요성·UID·권한을 이어서 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">파일 부재 입증?</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">가상 수집 자료의</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">부재 근거를 비교</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">예: 부재 근거</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">소유자·모드</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">비교 생략</tspan></text><text x="60" y="374" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="386" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="424" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">아니요: 분리</tspan></text><text x="76" y="459" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">존재: 필요성 조사</tspan></text><text x="76" y="493" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">미수집: 보류</tspan></text><path d="M180 147v18H26V414" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 414H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
