<svg xmlns="http://www.w3.org/2000/svg" width="360" height="736" viewBox="0 0 360 736" data-diagram-kind="decision" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">hosts.lpd 부재 근거와 수집 상태 분리</title><desc id="desc">같은 파일 이름도 부재를 입증한 자료와 미수집은 다른 상태예요. 미수집 자료를 부재나 양호로 바꾸지 않아요. 가상 수집 자료를 나누는 분기예요. 미수집은 보류하며 존재가 입증된 일반 파일의 사용 필요성·UID·권한을 이어서 비교해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="736" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="336" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 34l34 34m0-34-34 34" stroke="#956c30" stroke-width="3"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/etc/hosts.lpd</tspan></text><rect x="28" y="130" width="304" height="45" rx="10" fill="#f8e9b8" stroke="#cadbd1"/><text x="32" y="155" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">부재 근거</tspan></text><text x="32" y="210" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 수집 자료</tspan></text><text x="32" y="243" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">부재가 기록됨</tspan></text><text x="32" y="286" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">소유자·모드 비교</tspan></text><text x="32" y="319" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">생략</tspan></text></g><g data-panel="file"><rect x="16" y="376" width="328" height="336" rx="10" fill="#fff" 