<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">UID 재사용과 소유자 이름의 변화</title><desc id="desc">GID 조회 결과와 실제 접근 권한은 이 그림에서 생략했다. 가상 계정표만 바꾸고 파일 속성 목록은 유지했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="326" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">조회 실패</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">UID 41001 → 없음</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">파일 UID 41001</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">UID 재사용</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">UID 41001 → newapp</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">파일 UID 41001</tspan></text></g></svg>
