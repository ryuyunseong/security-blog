<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">gzip 544바이트 → 해제 결과 512 KiB</title><desc id="desc">544바이트 입력이 512 KiB로 풀린 실행 예다. 출력은 실제 반환량을 누적해 제한한다. 압축 크기 수치는 이번 실행 환경의 값이며 버전에 따라 달라질 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">압축 입력</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">실습 예제 544바이트</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">입력 한도는 통과</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">압축 해제</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">원문 524,288바이트</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">실제 반환량을 누적</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">출력 제한</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">한도 65,536바이트</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">한도 + 1에서 초과 감지</text></g></svg>
