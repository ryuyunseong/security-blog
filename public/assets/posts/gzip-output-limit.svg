<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">작은 입력 뒤에 큰 출력이 숨어 있다</title><desc id="desc">입력 크기와 해제 출력량에 각각 상한을 둔다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트  /  구조로 읽기</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">작은 입력 뒤에 큰 출력이 숨어 있다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">압축 입력</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">실습 예제 544바이트</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">입력 한도는 통과</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">압축 해제</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">원문 524,288바이트</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">실제 반환량을 누적</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">출력 제한</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">한도 65,536바이트</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">한도 + 1에서 초과 감지</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">압축 크기 수치는 이번 실행 환경의 값이며 버전에 따라 달라질 수 있다.</text></g></svg>
