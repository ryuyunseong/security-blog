<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">root 그룹의 구성원은 두 곳에서 찾는다</title><desc id="desc">기본 그룹과 명시적 추가 그룹을 합친 뒤 승인 계정과 비교한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">root 그룹의 구성원은 두 곳에서 찾는다</text><rect x="44" y="141" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="176" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="218" font-size="25" fill="#193e2f" font-weight="700">기본 그룹</text><text x="66" y="260" font-size="19" fill="#536b60" font-weight="400">passwd의 GID 필드</text><text x="66" y="291" font-size="19" fill="#536b60" font-weight="400"></text><rect x="44" y="306" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="341" font-size="16" fill="#287056" font-weight="700">02</text><text x="66" y="383" font-size="25" fill="#193e2f" font-weight="700">추가 그룹</text><text x="66" y="425" font-size="19" fill="#536b60" font-weight="400">group의 구성원 필드</text><text x="66" y="456" font-size="19" fill="#536b60" font-weight="400"></text><path d="M434 218H480V300H524 M434 382H480V300" fill="none" stroke="#7eaa93" stroke-width="3"/><rect x="524" y="202" width="392" height="205" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="237" font-size="16" fill="#287056" font-weight="700">03</text><text x="546" y="279" font-size="25" fill="#193e2f" font-weight="700">합쳐서 대조</text><text x="546" y="321" font-size="19" fill="#536b60" font-weight="400">root · deploy · audit</text><text x="546" y="352" font-size="19" fill="#536b60" font-weight="400">승인 목록과 비교</text><text x="66" y="278" font-size="18" fill="#536b60" font-weight="400">예: deploy의 GID = 0</text><text x="66" y="443" font-size="18" fill="#536b60" font-weight="400">예: root:x:0:audit</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">group의 구성원 칸이 비어 있어도 기본 그룹 사용자는 남아 있다.</text></g></svg>
