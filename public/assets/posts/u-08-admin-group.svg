<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" data-diagram-kind="merge" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">root 그룹의 구성원은 두 곳에서 찾는다</title><desc id="desc">가상 자료의 기본 그룹과 추가 구성원 목록을 합친 모습이에요. group의 마지막 칸만 읽으면 deploy를 놓칠 수 있어요. group의 구성원 칸이 비어 있어도 기본 그룹 사용자는 남아 있어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="452" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="410" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">passwd: 기본 그룹</tspan></text><rect x="28" y="79" width="386" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">이름</tspan></text><path d="M221 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="229" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="229" dy="0">GID</tspan></text><rect x="28" y="126" width="386" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">root</tspan></text><path d="M221 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="229" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="229" dy="0">0</tspan></text><rect x="28" y="170" width="386" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">deploy</tspan></text><path d="M221 170v44" fill=