<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">가상 NFS 유닛의 현재 활성 상태와 기동 설정</title><desc id="desc">화살표는 한 유닛에 속한 속성값 두 개를 가리켜요. 가상 disabled-active 사례의 같은 유닛에서 두 속성을 얻었다는 가정이다. 실제 systemd 조회·NFS 실행·서비스 변경 결과가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="356" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="534" y="16" width="410" height="146" rx="10" fill="#fff" stroke="#cadbd1"/><text x="550" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">ActiveState</tspan></text><text x="550" y="99" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">현재</tspan></text><text x="550" y="130" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">active</tspan></text></g><g data-panel="actor"><rect x="534" y="186" width="410" height="146" rx="10" fill="#fff" stroke="#cadbd1"/><text x="550" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">UnitFileState</tspan></text><text x="550" y="269" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">기동 설정</tspan></text><text x="550" y="300" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">disabled</tspan></text></g><g data-panel="actor"><rect x="16" y="16" width="410" height="146" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">nfs-server.service</tspan></text><text x="32" y="99" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">usage</tspan></text><text x="32" y="130" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">unused</tspan></text></g><path d="M429 89H480V89H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M429 89H480V259H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
