<svg xmlns="http://www.w3.org/2000/svg" width="360" height="501" viewBox="0 0 360 501" data-diagram-kind="timeline" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">별도 Bash에서 TMOUT=2를 시험한다</title><desc id="desc">별도 Bash에서 TMOUT=2로 유휴 종료를 시험했다. 운영 로그인 경로의 600초 설정과 네트워크 연결 종료는 시험 범위 밖이다. 2초 유휴 종료 실습이다. 운영 로그인 경로의 600초 적용 시험은 별도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="501" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="52" y="16" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">새 셸 시작</tspan></text><text x="68" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">env -i · TMOUT=2</tspan></text><text x="68" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">시작 파일 생략</tspan></text><rect x="52" y="175" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="213" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">프롬프트 대기</tspan></text><text x="68" y="248" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">입력 없이 2초</tspan></text><text x="68" y="282" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">별도 가상 터미널</tspan></text><rect x="52" y="334" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="372" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">셸 자동 종료</tspan></text><text x="68" y="407" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">auto-logout 메시지</tspan></text><text x="68" y="441" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">실제 출력과 대조</tspan></text><path d="M26 28V356" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="26" cy="28" r="6" fill="#287056"/><circle cx="26" cy="187" r="6" fill="#287056"/><circle cx="26" cy="346" r="6" fill="#287056"/></g></svg>
