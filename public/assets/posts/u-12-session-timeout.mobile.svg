<svg xmlns="http://www.w3.org/2000/svg" width="360" height="536" viewBox="0 0 360 536" data-diagram-kind="timeline" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">TMOUT=2가 세는 프롬프트 입력 대기</title><desc id="desc">TMOUT은 프롬프트에서 완전한 입력 행을 기다리는 시간이에요. 2초 설정의 메시지 비교를 정확한 2.000초 측정으로 바꾸지 않았어요. 2초 유휴 종료 실습이며 운영 로그인 경로의 600초 적용 시험은 별도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="536" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 43l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">프롬프트에서 입력 대기</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">별도 가상 셸</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">TMOUT=2</tspan></text><text x="32" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">입력이 없을 때</tspan></text><text x="32" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">셸 자동 종료</tspan></text></g><g data-panel="actor"><rect x="16" y="276" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="313" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 303l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="314" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">명령 실행 중</tspan></text><text x="32" y="370" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">구별할 동작</tspan></text><text x="32" y="403" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">프롬프트 입력 대기</tspan></text><text x="32" y="446" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">이번 보장 범위 밖</tspan></text><text x="32" y="479" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">모든 작업의 강제 중지</tspan></text></g></g></svg>
