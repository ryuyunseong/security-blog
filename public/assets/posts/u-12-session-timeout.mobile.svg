<svg xmlns="http://www.w3.org/2000/svg" width="360" height="701" viewBox="0 0 360 701" data-diagram-kind="timeline" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">별도 Bash에서 TMOUT=2를 시험한다</title><desc id="desc">최소 환경으로 시작한 Bash가 입력을 기다리다가 자동 종료 메시지를 남긴다. 실행 중인 작업이나 네트워크 종료까지 시험한 결과는 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="701" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">별도 Bash에서 TMOUT=2를</tspan><tspan x="16" dy="31">시험한다</tspan></text><rect x="52" y="104" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">새 셸 시작</tspan></text><text x="68" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">env -i · TMOUT=2</tspan></text><text x="68" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">시작 파일 생략</tspan></text><rect x="52" y="263" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="301" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">프롬프트 대기</tspan></text><text x="68" y="336" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">입력 없이 2초</tspan></text><text x="68" y="370" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">별도 가상 터미널</tspan></text><rect x="52" y="422" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="460" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">셸 자동 종료</tspan></text><text x="68" y="495" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">auto-logout 메시지</tspan></text><text x="68" y="529" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">실제 출력과 대조</tspan></text><path d="M26 116V444" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><circle cx="26" cy="116" r="6" fill="#287056"/><circle cx="26" cy="275" r="6" fill="#287056"/><circle cx="26" cy="434" r="6" fill="#287056"/><path d="M16 581H344" stroke="#cadbd1"/><text x="16" y="617" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">2초 유휴 종료 실습이다. 운영</tspan><tspan x="16" dy="28">로그인 경로의 600초 적용 시험은</tspan><tspan x="16" dy="28">별도다.</tspan></text></g></svg>
