<svg xmlns="http://www.w3.org/2000/svg" width="360" height="713" viewBox="0 0 360 713" data-diagram-kind="matrix" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">Search List의 연결 위치를 확인한다</title><desc id="desc">같은 QID 목록이 서로 다른 지점에 꽂히는 관계예요. 보고서 필터를 바꾼 것을 검사 범위 변경과 혼동하지 않도록 나눴어요. 목록에 QID가 있어도 해당 호스트의 탐지 결과를 뜻하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="713" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="attachments"><rect x="16" y="16" width="328" height="673" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">목록을 연결하는 세 지점</tspan></text><rect x="40" y="79" width="280" height="112" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><path d="M162 91h23l9 9v32H162Z M185 91v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="180" y="163" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="180" dy="0">Search List</tspan></text><rect x="64" y="243" width="264" height="142" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="80" y="255" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M88 267h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="126" y="277" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="126" dy="0">스캔 옵션</tspan><tspan x="126" dy="31">Custom</tspan></text><text x="80" y="353" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="80" dy="0">검사할 QID</tspan></text><path d="M40 135H28V314H58" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="409" width="264" height="111" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M80 421h23l9 9v32H80Z M103 421v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="126" y="443" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="126" dy="0">보고서 템플릿</tspan></text><text x="80" y="488" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="80" dy="0">원본 결과 중 표시할 QID</tspan></text><path d="M40 135H28V464.5H58" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="544" width="264" height="111" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M80 556h23l9 9v32H80Z M103 556v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="126" y="578" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="126" dy="0">티켓 규칙</tspan></text><text x="80" y="623" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="80" dy="0">티켓을 만들 탐지</tspan></text><path d="M40 135H28V599.5H58" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></g></svg>
