<svg xmlns="http://www.w3.org/2000/svg" width="360" height="645" viewBox="0 0 360 645" data-diagram-kind="matrix" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">Search List의 연결 위치를 확인한다</title><desc id="desc">Search List가 스캔·보고서·티켓 중 어디에 연결됐는지에 따라 결과의 의미가 달라진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="645" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">Search List의 연결 위치를</tspan><tspan x="16" dy="31">확인한다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">스캔 옵션</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">검사할 QID 선택</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">Custom 범위 확인</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">보고서 템플릿</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">표시할 QID 선택</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">원본 결과와 대조</tspan></text><rect x="16" y="398" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="436" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">티켓 규칙</tspan></text><text x="32" y="471" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">생성할 대상 선택</tspan></text><text x="32" y="505" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">탐지와 티켓 구분</tspan></text><path d="M16 553H344" stroke="#cadbd1"/><text x="16" y="589" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">목록에 QID가 있어도 해당 호스트의</tspan><tspan x="16" dy="28">탐지 결과를 뜻하지 않는다.</tspan></text></g></svg>
