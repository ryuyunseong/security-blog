<svg xmlns="http://www.w3.org/2000/svg" width="360" height="768" viewBox="0 0 360 768" data-diagram-kind="intervals" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">192.0.2.0/24 안의 중첩·인접 구간</title><desc id="desc">인접한 두 /25를 합치면 0~255가 된다. 그 안의 /26은 주소를 추가하지 않는다. 별도의 /32는 이 그림에서 제외했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="768" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">192.0.2.0/24 안의</tspan><tspan x="16" dy="31">중첩·인접 구간</tspan></text><text x="16" y="126" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">192.0.2.0/25</tspan></text><rect x="16" y="143" width="328" height="24" rx="4" fill="#e0ebe4"/><rect x="16" y="143" width="164" height="24" rx="3" fill="#9abfa9"/><text x="16" y="197" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">0 ~ 127</tspan></text><text x="16" y="256" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">192.0.2.128/25</tspan></text><rect x="16" y="273" width="328" height="24" rx="4" fill="#e0ebe4"/><rect x="180" y="273" width="164" height="24" rx="3" fill="#9abfa9"/><text x="16" y="327" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">128 ~ 255</tspan></text><text x="16" y="386" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">192.0.2.64/26</tspan></text><rect x="16" y="403" width="328" height="24" rx="4" fill="#e0ebe4"/><rect x="98" y="403" width="82" height="24" rx="3" fill="#9abfa9"/><text x="16" y="457" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">64 ~ 127</tspan></text><text x="16" y="516" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">병합 결과</tspan></text><rect x="16" y="533" width="328" height="24" rx="4" fill="#e0ebe4"/><rect x="16" y="533" width="328" height="24" rx="3" fill="#287056"/><text x="16" y="587" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">0 ~ 255</tspan></text><path d="M16 624H344" stroke="#cadbd1"/><text x="16" y="652" font-size="20" fill="#536b60" text-anchor="start">0</text><text x="180" y="652" font-size="20" fill="#536b60" text-anchor="middle">128</text><text x="342.71875" y="652" font-size="20" fill="#536b60" text-anchor="end">255</text><path d="M16 676H344" stroke="#cadbd1"/><text x="16" y="712" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">가로축은 주소의 마지막 옥텟이다.</tspan><tspan x="16" dy="28">양 끝 주소를 모두 포함한다.</tspan></text></g></svg>
