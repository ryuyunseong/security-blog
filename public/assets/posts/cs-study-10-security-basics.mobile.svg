<svg xmlns="http://www.w3.org/2000/svg" width="360" height="835" viewBox="0 0 360 835" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">reader 역할과 문서 소유권 비교</title><desc id="desc">가상 정책에서 reader 역할과 소유자 ID가 함께 맞아야 해요. 관리자 예외와 미인증 거부는 본문 분기에서 따로 다뤄요. 신원이 이미 검증됐다고 가정한 가상 주체와 문서 7을 사용해요. 로그인 구현과 SQL 매개변수 예제는 이 그림의 범위 밖이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="835" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="256" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="70" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">검증됐다고 가정한</tspan><tspan x="106" dy="31">신원</tspan></text><text x="52" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">역할</tspan></text><text x="52" y="163" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">reader</tspan></text><text x="52" y="206" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">비교할 ID</tspan></text><text x="52" y="239" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1001 / 1002</tspan></text></g><g data-panel="file"><rect x="36" y="320" width="308" height="203" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 336h23l9 9v32H52Z M75 336v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="412" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">가상 문서 7</tspan></text><text x="52" y="457" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">소유자 ID</tspan></text><text x="52" y="490" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1001</tspan></text></g><g data-panel="table"><rect x="36" y="571" width="308" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="609" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">reader의 소유권 비교</tspan></text><rect x="48" y="634" width="284" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="56" y="664" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="56" dy="0">ID</tspan></text><path d="M190 634v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="198" y="664" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="198" dy="0">읽기</tspan></text><rect x="48" y="681" width="284" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="56" y="709" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="56" dy="0">1001</tspan></text><path d="M190 681v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="198" y="709" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="198" dy="0">허용</tspan></text><rect x="48" y="725" width="284" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="56" y="753" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="56" dy="0">1002</tspan></text><path d="M190 725v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="198" y="753" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="198" dy="0">거부</tspan></text></g><path d="M36 144H16V679H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 421.5H16V679H30