<svg xmlns="http://www.w3.org/2000/svg" width="360" height="473" viewBox="0 0 360 473" data-diagram-kind="layers" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">인증·접근 권한·입력 해석의 역할</title><desc id="desc">세 항목은 서로 대신할 수 있는 검사가 아니다. 예제의 접근 정책은 신원이 검증된 주체를 입력으로 받는다고 가정한다. 이 글은 인증을 구현하지 않고 신뢰할 수 있는 주체를 가정한다. 접근 권한 예제와 SQL 매개변수 예제는 서로 다른 조건을 시험한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="473" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">인증</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">누가 요청했는가</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">신원을 검증</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">접근 권한</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">이 문서를 읽어도 되는가</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청마다 정책 적용</tspan></text><rect x="16" y="310" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="348" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">입력 해석</tspan></text><text x="32" y="383" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">값을 어디에 넣는가</tspan></text><text x="32" y="417" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">SQL 구조와 값 분리</tspan></text></g></svg>
