<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 121 960 300" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">인증·접근 권한·입력 해석의 역할</title><desc id="desc">세 항목은 서로 대신할 수 있는 검사가 아니다. 예제의 접근 정책은 신원이 검증된 주체를 입력으로 받는다고 가정한다. 이 글은 인증을 구현하지 않고 신뢰할 수 있는 주체를 가정한다. 접근 권한 예제와 SQL 매개변수 예제는 서로 다른 조건을 시험한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="121" width="960" height="300" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">인증</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">누가 요청했는가</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">신원을 검증</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">접근 권한</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">이 문서를 읽어도 되는가</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청마다 정책 적용</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">입력 해석</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">값을 어디에 넣는가</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">SQL 구조와 값 분리</text></g></svg>
