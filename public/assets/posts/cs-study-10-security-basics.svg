<svg xmlns="http://www.w3.org/2000/svg" width="960" height="491" viewBox="0 0 960 491" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">reader 역할과 문서 소유권 비교</title><desc id="desc">가상 정책에서 reader 역할과 소유자 ID가 함께 맞아야 해요. 관리자 예외와 미인증 거부는 본문 분기에서 따로 다뤄요. 신원이 이미 검증됐다고 가정한 가상 주체와 문서 7을 사용해요. 로그인 구현과 SQL 매개변수 예제는 이 그림의 범위 밖이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="491" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="50" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">검증됐다고 가정한 신원</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">역할</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">reader</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">비교할 ID</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1001 / 1002</tspan></text></g><g data-panel="file"><rect x="16" y="270" width="410" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 286h23l9 9v32H32Z M55 286v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="360" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 문서 7</tspan></text><text x="32" y="404" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">소유자 ID</tspan></text><text x="32" y="435" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1001</tspan></text></g><g data-panel="table"><rect x="534" y="16" width="410" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="550" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">reader의 소유권 비교</tspan></text><rect x="546" y="79" width="386" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="554" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="554" dy="0">ID</tspan></text><path d="M739 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="747" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="747" dy="0">읽기</tspan></text><rect x="546" y="126" width="386" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="554" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="554" dy="0">1001</tspan></text><path d="M739 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="747" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="747" dy="0">허용</tspan></text><rect x="546" y="170" width="386" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="554" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="554" dy="0">1002</tspan></text><path d="M739 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="747" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="747" dy="0">거부</tspan></text></g><path d="M429 131H480V124H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M429 368.5H480V124H528" fill="none" stroke="#7eaa93" stroke-w