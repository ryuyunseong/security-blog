<svg xmlns="http://www.w3.org/2000/svg" width="360" height="605" viewBox="0 0 360 605" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">직접 로그인 필요성에 따라 셸을 검토한다</title><desc id="desc">로그인 필요성을 정한 뒤 계정의 셸과 변경 시 영향을 받는 서비스·작업을 조사한다. 셸 제한은 모든 프로세스 실행을 차단하는 설정이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="605" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">로그인이 필요한가</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">계정 용도·담당자 확인</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">서비스 계정별 검토</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="159" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">업무용 셸 검토</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">승인된 로그인 방식과 대조</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">서비스·예약 작업 영향</tspan><tspan x="76" dy="28">조사</tspan></text><text x="60" y="402" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="414" width="284" height="159" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="452" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">제한용 셸 검토</tspan></text><text x="76" y="487" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">nologin 등 적용 여부</tspan></text><text x="76" y="521" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">서비스·예약 작업 영향</tspan><tspan x="76" dy="28">조사</tspan></text><path d="M180 147v18H26V442" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 442H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
