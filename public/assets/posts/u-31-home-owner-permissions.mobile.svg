<svg xmlns="http://www.w3.org/2000/svg" width="360" height="501" viewBox="0 0 360 501" data-diagram-kind="merge" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">계정 UID와 홈 디렉터리 메타데이터 비교</title><desc id="desc">계정 목록의 다른 경로에서 얻은 메타데이터를 섞지 않는다는 가정을 둔다. 가상 계정의 홈 경로와 그 경로의 소유 UID·모드를 결합해 비교한다. 소유자 일치와 쓰기 비트는 별도 조건이다. 실제 조회·접근·권한 변경을 수행한 그림이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="501" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="52" y="16" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">계정 UID 1002</tspan></text><text x="68" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">/home/bravo</tspan></text><text x="68" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">가상 계정 자료</tspan></text><rect x="52" y="171" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="209" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">소유 UID 1002</tspan></text><text x="68" y="244" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">mode 0770</tspan></text><text x="68" y="278" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">같은 경로의 가상 자료</tspan></text><path d="M52 81.5H26V322H180" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M52 236.5H26" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M180 322V332" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="338" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="376" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">소유 UID 일치</tspan></text><text x="32" y="411" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">그룹 쓰기 0020</tspan></text><text x="32" y="445" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">검토 후보</tspan></text></g></svg>
