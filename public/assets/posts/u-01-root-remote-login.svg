<svg xmlns="http://www.w3.org/2000/svg" width="960" height="403" viewBox="0 0 960 403" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">SSH 설정은 접속 조건까지 읽어야 한다</title><desc id="desc">두 주소는 설정 해석에 넣는 문자열이에요. 서비스 반영이나 실제 원격 로그인 결과를 그린 것은 아니에요. 한 줄의 설정과 특정 접속 조건의 적용값을 구분해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="403" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="288" height="371" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 sshd_config</tspan></text><text x="32" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">전역</tspan></text><text x="32" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">PermitRootLogin no</tspan></text><text x="32" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">주소 조건</tspan></text><text x="32" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Match Address</tspan><tspan x="32" dy="28">192.0.2.10</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">조건 안</tspan></text><text x="32" y="355" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">PermitRootLogin yes</tspan></text></g><g data-panel="actor"><rect x="336" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="371" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M366 43l14 10-14 10Z" fill="#7eaa93"/><text x="406" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="406" dy="0">sshd -T -C</tspan></text><text x="352" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">바뀌는 입력</tspan></text><text x="352" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">addr</tspan></text><text x="352" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">수행 범위</tspan></text><text x="352" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">설정 해석</tspan></text></g><g data-panel="table"><rect x="656" y="16" width="288" height="275" rx="10" fill="#fff" stroke="#cadbd1"/><text x="672" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">주소 조건별 유효값</tspan></text><rect x="668" y="79" width="264" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="680" y="111" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="680" dy="0">addr: 192.0.2.11</tspan></text><text x="680" y="145" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="680" dy="0">값: no</tspan></text><rect x="668" y="176" width="264" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="680" y="208" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="680" dy="0">addr: 192.0.2.10</tspan></text><text x="680" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="680" dy="0">값: yes</tspan></text></g><path d="M307 201.5H320V131H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 131H640V153.5H650" fill="none" stro