<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">SSH 설정은 접속 조건까지 읽어야 한다</title><desc id="desc">Include와 Match를 거친 값을 확인한 뒤 실제 서비스 적용 여부를 살핀다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">SSH 설정은 접속 조건까지 읽어야 한다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">설정 파일</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">Include로 다른 파일 포함</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">PermitRootLogin no</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">접속 조건</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">Match Address / User</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">조건별 설정 해석</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">적용값 확인</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">sshd -T -C</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">실제 로그인 시험은 별도</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">한 줄의 설정과 특정 접속 조건의 적용값을 구분한다.</text></g></svg>
