<svg xmlns="http://www.w3.org/2000/svg" width="360" height="549" viewBox="0 0 360 549" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">U-24의 기본 비교와 추가 조사 구분</title><desc id="desc">‘아니요’ 경로는 정상·취약 결과로 합산하지 않는다. 빠진 자료와 특수 설정을 조사한 뒤 비교 범위를 정한다. 소유자와 일반 쓰기 비트 비교에 앞서 링크·확장 ACL·미수집 자료와 특수 비트가 있는 행을 분리한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">비교 자료 충족?</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">일반 파일·ACL 없음</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">특수 비트 없음</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">예: 두 조건 비교</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">UID 0 또는 홈 UID</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">그룹·기타 쓰기 0</tspan></text><text x="60" y="374" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="386" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="424" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">아니요: 추가 조사</tspan></text><text x="76" y="459" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">링크 대상·ACL</tspan></text><text x="76" y="493" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">특수 비트 용도</tspan></text><path d="M180 147v18H26V414" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 414H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
