<svg xmlns="http://www.w3.org/2000/svg" width="360" height="614" viewBox="0 0 360 614" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">가상 승인 대역과 수집 대역이 갈라지는 마지막 옥텟</title><desc id="desc">x는 주소의 마지막 숫자예요. 양 끝을 포함해 주소를 세므로 네트워크 주소와 브로드캐스트 주소도 개수에 들어가요. 가상 승인 기록보다 수집 기록에 주소 16개가 더 있어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="614" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="275" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">승인 /28</tspan></text><rect x="28" y="79" width="304" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="111" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">192.0.2.x의 x: 0~15</tspan></text><text x="40" y="145" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">포함 여부: 포함</tspan></text><rect x="28" y="176" width="304" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="208" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">192.0.2.x의 x: 16~31</tspan></text><text x="40" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">포함 여부: 제외</tspan></text></g><g data-panel="table"><rect x="16" y="315" width="328" height="275" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="353" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">수집 /27</tspan></text><rect x="28" y="378" width="304" height="87" rx="10" fill="#fff" stroke="