<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">점 이름과 숨김 디렉터리 내부 파일</title><desc id="desc">점 이름의 존재는 내용의 악성 여부를 판정하는 자료가 아니다. 끝 이름의 점 여부와 상위 디렉터리의 점 이름을 구별한다. 가상 트리의 두 파일을 비교하며 Windows 숨김 속성이나 악성 여부를 판단하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">자기 이름이 점으로 시작</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">docs/.draft.txt</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">끝 이름: .draft.txt</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">상위 이름이 점으로 시작</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">.cache/session.txt</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">끝 이름: session.txt</text></g></svg>
