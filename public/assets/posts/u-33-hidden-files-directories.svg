<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">점 이름과 숨김 디렉터리 내부 파일</title><desc id="desc">점 이름의 존재는 내용의 악성 여부를 판정하는 자료가 아니다. 끝 이름의 점 여부와 상위 디렉터리의 점 이름을 구별한다. 가상 트리의 두 파일을 비교하며 Windows 숨김 속성이나 악성 여부를 판단하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">자기 이름이 점으로 시작</text><g data-illustration="path-tree"><path d="M66 227v24h36V227H83l-5-6H66v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="114" y="246" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">docs/</text><path d="M84 258v38h28" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M114 276h23l9 9v29H114Z M137 276v9h9" fill="#f8e9b8" stroke="#536b60" stroke-width="2"/><text x="158" y="303" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">.draft.txt</text></g><text x="66" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">끝 이름: .draft.txt</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">상위 이름이 점으로 시작</text><g data-illustration="path-tree"><path d="M522 227v24h36V227H539l-5-6H522v6Z" fill="#f8e9b8" stroke="#536b60" stroke-width="2"/><text x="570" y="246" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">.cache/</text><path d="M540 258v38h28" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M570 276h23l9 9v29H570Z M593 276v9h9" fill="#fff" stroke="#536b60" stroke-width="2"/><text x="614" y="303" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key">session.txt</text></g><text x="522" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">끝 이름: session.txt</text></g></svg>
