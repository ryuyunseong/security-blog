<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 121 960 300" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">hosts 파일의 소유자, 일반 권한, 추가 접근 조건</title><desc id="desc">세 영역은 점검 순서가 아닌 독립된 조사 범위다. ACL·링크 표시는 가정한 입력이다. 세 항목은 독립된 점검 지점이다. 가상 JSON의 ACL 상태로 실제 유효 권한을 계산하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="121" width="960" height="300" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">소유자</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">UID 0</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">일반 계정 소유 제외</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">일반 권한</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">0644 허용 비트</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹·기타 쓰기 제외</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">추가 접근 조건</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">ACL·링크·상위 경로</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">실제 자료로 조사</text></g></svg>
