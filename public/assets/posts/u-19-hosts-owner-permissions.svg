<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">hosts 파일의 소유자, 일반 권한, 추가 접근 조건</title><desc id="desc">일반 소유권·모드의 기준과 추가 접근 경로를 나눠 그렸어요. 0644만으로 ACL과 상위 경로까지 조사한 것으로 보지 않아요. 세 항목은 독립된 점검 지점이에요. 가상 JSON의 ACL 상태로 실제 유효 권한을 계산하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="380" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="448" height="348" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/etc/hosts</tspan></text><text x="32" y="152" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">mode 0644</tspan></text><g data-illustration="permission-bits" data-mode="0644"><text x="101.33333333333333" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="36" y="199" width="40.888888888888886" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="56.44444444444444" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="80.88888888888889" y="199" width="40.888888888888886" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="101.33333333333333" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="125.77777777777777" y="199" width="40.888888888888886" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="146.22222222222223" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="240" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="174.66666666666666" y="199" width="40.888888888888886" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="195.1111111111111" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="219.55555555555554" y="199" width="40.888888888888886" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="240" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="264.44444444444446" y="199" width="40.888888888888886" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="284.8888888888889" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="378.66666666666663" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">기타</text><rect x="313.3333333333333" y="199" width="40.888888888888886" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="333.77777777777777" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="358.2222222222222" y="199" width="40.888888888888886" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="378.66666666666663" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="403.1111111111111" y="199" width="40.888888888888886" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="423.55555555555554" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text></g><text x="32" y="265" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">r 읽기, w 쓰기, x 실행, - 없음</tspan></text><text x="32" y="301" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">소유 UID</tspan></text><text x="32" y="332" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">0</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">일반 모드 밖의 조건</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">지점</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">추가 자료</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">파일</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">확장 ACL</tspan></text><rect x="508" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">링크</tspan></text><path d="M720 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">실제 목적지</tspan></text><rect x="508" y="214" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">상위 경로</tspan></text><path d="M720 214v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="