<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">rpc-statd 가상 발췌에서 주석을 건너뛰고 남는 명시값</title><desc id="desc">선택한 행에서 읽은 값이에요. 실제 서비스의 실행 여부는 별도로 살펴야 해요. 가상 comment-first 사례에서 줄 전체 주석을 건너뛴 뒤 하나 남은 disable 값을 읽는 순서예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="620" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="272" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">rpc-statd 발췌</tspan></text><rect x="28" y="79" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">속성 행</tspan></text><path d="M180 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">처리</tspan></text><rect x="28" y="126" width="304" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0"># disable =</tspan><tspan x="36" dy="28">yes</tspan></text><path d="M180 126v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">주석</tspan></text><rect x="28" y="198" width="304" height="72" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="36" y="226" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">disable =</tspan><tspan x="36" dy="28">no</tspan></text><path d="M180 198v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="226" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">선택</tspan></text></g><g data-panel="actor"><rect x="16" y="336" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="373" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 363l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="374" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">남은 명시값</tspan></text><text x="32" y="430" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">disable</tspan></text><text x="32" y="463" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">no</tspan></text><text x="32" y="506" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">발췌 해석</tspan></text><text x="32" y="539" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">활성 표기</tspan></text></g><path d="M180 293V328" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
