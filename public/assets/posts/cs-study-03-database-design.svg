<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 148 960 220" data-diagram-kind="timeline" role="img" aria-labelledby="title desc"><title id="title">SQL 문장 오류와 트랜잭션 취소 시점의 잔액</title><desc id="desc">잔액 단위는 가상 포인트다. 점 간격은 경과 시간에 비례하지 않는다. 처음 잔액은 100·50이며 두 번째 UPDATE를 CHECK 조건이 거부한 가상 메모리 실습이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="148" width="960" height="220" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M110 232H850" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="130" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">차감 뒤</text><text x="130" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">1번 70</text><text x="130" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">2번 50</text><circle cx="480" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="480" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">두 번째 문장 오류</text><text x="480" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">1번 70</text><text x="480" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">2번 50</text><circle cx="830" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="830" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">ROLLBACK 뒤</text><text x="830" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">1번 100</text><text x="830" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">2번 50</text></g></svg>
