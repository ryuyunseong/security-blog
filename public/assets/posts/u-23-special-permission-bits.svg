<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">U-23 원문 검색식의 파일 선택 조건</title><desc id="desc">조건을 모두 만족한 검색 후보다. 권한의 필요성과 변경 영향은 목록을 얻은 뒤 조사한다. 2026 가이드의 root 일반 파일 검색 조건이다. xdev에 따른 파일시스템 경계도 별도로 고려한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">root 소유</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">소유자 조건</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">다른 소유자는 별도</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">일반 파일</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">-type f 조건</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">디렉터리는 별도</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">SUID·SGID</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">mode &amp; 06000</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">비트가 있으면 후보</text></g></svg>
