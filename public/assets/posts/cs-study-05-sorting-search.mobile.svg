<svg xmlns="http://www.w3.org/2000/svg" width="360" height="663" viewBox="0 0 360 663" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">삽입 정렬에서 정렬된 앞부분이 늘어나는 과정</title><desc id="desc">색칠한 칸은 각 단계에서 정렬된 앞부분이에요. 같은 값인 두 2의 원래 순서를 유지하는 비교 조건은 본문 코드에서 이어 볼 수 있어요. 입력은 [5, 2, 4, 2]예요. 각 노드는 삽입 한 단계가 끝난 전체 배열이며 화살표 간격은 시간에 비례하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="663" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="array"><rect x="16" y="16" width="328" height="269" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">첫 2를 삽입</tspan></text><rect x="32" y="79" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="69" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="69" dy="0">2</tspan></text><rect x="106" y="79" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="143" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="143" dy="0">5</tspan></text><rect x="180" y="79" width="74" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="217" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="217" dy="0">4</tspan></text><rect x="254" y="79" width="74" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="291" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="291" dy="0">2</tspan></text><text x="32" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">첫 삽입 전</tspan></text><text x="32" y="176" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">[5, 2, 4, 2]</tspan></text><text x="32" y="219" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">초록 칸</tspan></text><text x="32" y="252" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">정렬이 끝난 앞부분</tspan></text></g><g data-panel="array"><rect x="16" y="333" width="328" height="117" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="371" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">4를 삽입</tspan></text><rect x="32" y="396" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="69" y="425" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="69" dy="0">2</tspan></text><rect x="106" y="396" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="143" y="425" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="143" dy="0">4</tspan></text><rect x="180" y="396" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="217" y="425" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="217" dy="0">5</tspan></text><rect x="254" y="396" width="74" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="291" y="425" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="291" dy="0">2</tspan></text></g><g data-panel="array"><rect x="16" y="498" width="328" height="117" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="536" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">두 번째 2를 삽입</tspan></text><rect x="32" y="561" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="69" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="69" dy="0">2</tspan></text><rect x="106" y="561" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="143" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="143" dy="0">2</tspan></text><rect x="180" y="561" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="217" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="217" dy="0">4</tspan></text><rect x="254" y="561" width="74" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="291" y="590" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="291" dy="0">5</tspan></text></g><path d="M180 290V325" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 455V490" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
