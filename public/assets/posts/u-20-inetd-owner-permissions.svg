<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">xinetd 주 설정과 포함 파일의 관계</title><desc id="desc">화살표는 포함 관계다. 주 설정의 권한이 서비스별 파일로 상속된다는 뜻은 아니다. 화살표는 설정을 불러오는 관계이며 권한 상속이나 권한 변경을 뜻하지 않는다. 경로와 모드는 가상 입력이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">주 설정 파일</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">/etc/xinetd.conf</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">가상 모드 0600</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">includedir</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">/etc/xinetd.d</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">읽을 디렉터리 지정</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">서비스 파일</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">/etc/xinetd.d/example</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">가상 모드 0644</text></g></svg>
