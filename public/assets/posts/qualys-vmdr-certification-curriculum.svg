<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">VMDR 정규 과정에서 평가까지 이어 가기</title><desc id="desc">랩에서는 과정에서 배정한 대상과 사용 기간을 따른다. 수강 상태와 시험·인증 상태를 구별한다. Video Library는 보충 자료이며 정규 과정의 시험·인증 상태를 대신하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">과정 등록</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">VMDR 과정 선택</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">교육 계정 사용</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">학습·랩</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">공식 교재와 허용 대상</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">과제별 진행 상태</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">평가·발급</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">등록 과정의 조건</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">결과와 인증서 대조</text></g></svg>
