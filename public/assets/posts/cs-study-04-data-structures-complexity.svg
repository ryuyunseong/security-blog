<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">여덟 원소를 FIFO로 전부 꺼내는 두 구현</title><desc id="desc">같은 여덟 원소를 전부 꺼낸다. 이동 모형과 호출 수는 서로 다른 연산이며 초 단위 시간 비교가 아니다. 리스트 이동 칸 수는 남은 원소 수를 합산한 모형이다. 두 수치는 서로 다른 연산이며 실행 시간을 측정하지 않았다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">list.pop(0)</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">8건 FIFO</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">앞당김 모형 28칸</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">deque.popleft()</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">8건 FIFO</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">삭제 호출 8회</text></g></svg>
