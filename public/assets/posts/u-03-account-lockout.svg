<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 120 960 340" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">계정 잠금 횟수·집계 구간·해제 시간</title><desc id="desc">집계 구간, 실패 횟수, 해제 시간은 서로 다른 정책이다. 이 값들을 사용하는 PAM 경로가 연결돼 있는지도 확인한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="120" width="960" height="340" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">실패 집계</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">fail_interval</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">얼마 동안 셀 것인가</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">잠금 임계값</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">deny</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">몇 번 실패하면 잠그나</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">해제 시간</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">unlock_time</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">얼마 뒤 풀 것인가</text></g></svg>
