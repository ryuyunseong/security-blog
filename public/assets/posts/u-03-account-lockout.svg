<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">계정 잠금 횟수·집계 구간·해제 시간</title><desc id="desc">집계 구간, 실패 횟수, 해제 시간은 서로 다른 정책이다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트  /  구조로 읽기</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">계정 잠금 횟수·집계 구간·해제 시간</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">실패 집계</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">fail_interval</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">얼마 동안 셀 것인가</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">잠금 임계값</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">deny</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">몇 번 실패하면 잠그나</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">해제 시간</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">unlock_time</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">얼마 뒤 풀 것인가</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">이 값들을 사용하는 PAM 경로가 연결돼 있는지도 확인한다.</text></g></svg>
