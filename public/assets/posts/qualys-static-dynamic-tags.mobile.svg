<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">태그 이름이 같아도 분류 근거는 다르다</title><desc id="desc">같은 업무 이름의 태그라도 직접 지정한 목록과 조건으로 고른 목록은 다를 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="498" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">태그 이름이 같아도 분류 근거는</tspan><tspan x="16" dy="31">다르다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">직접 지정한 목록</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">lab-01 · lab-02</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">업무 목적과 지정 이력 확인</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">Linux + prod 조건</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">lab-01</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">자산 정보와 평가 시점 확인</tspan></text><path d="M16 406H344" stroke="#cadbd1"/><text x="16" y="442" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">가상 자산의 Python 비교이며 실제</tspan><tspan x="16" dy="28">Qualys 태그 평가 결과가 아니다.</tspan></text></g></svg>
