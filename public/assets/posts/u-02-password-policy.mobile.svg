<svg xmlns="http://www.w3.org/2000/svg" width="360" height="645" viewBox="0 0 360 645" data-diagram-kind="layers" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">비밀번호 정책의 세 가지 확인 지점</title><desc id="desc">복잡성과 이력은 PAM 호출을, 사용 기간은 계정별 만료 정보까지 대조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="645" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">비밀번호 정책의 세 가지 확인</tspan><tspan x="16" dy="31">지점</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">복잡성</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">pwquality 설정과 인수</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">PAM 호출 경로 확인</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">사용 기간</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">신규 계정의 기본값</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">기존 계정의 만료 정보</tspan></text><rect x="16" y="398" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="436" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">재사용 제한</tspan></text><text x="32" y="471" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">pwhistory 설정</tspan></text><text x="32" y="505" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">검사 순서와 우회 분기</tspan></text><path d="M16 553H344" stroke="#cadbd1"/><text x="16" y="589" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">설정 후보를 읽는 일과 실제 인증</tspan><tspan x="16" dy="28">경로를 확인하는 일은 다르다.</tspan></text></g></svg>
