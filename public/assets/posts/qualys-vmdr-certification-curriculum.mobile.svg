<svg xmlns="http://www.w3.org/2000/svg" width="360" height="714" viewBox="0 0 360 714" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">VMDR 정규 과정에서 평가까지 이어 가기</title><desc id="desc">등록에서 평가로 이어지는 학습 경로예요. 수료·시험 통과·자격 발급을 같은 상태로 합치지 않아요. Video Library는 보충 자료이며 정규 과정의 시험·인증 상태를 대신하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="714" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 39v29c0 10 36 10 36 0V39" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><ellipse cx="50" cy="39" rx="18" ry="7" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">교육 계정으로 등록</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">선택한 과정</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">VMDR</tspan></text></g><g data-panel="actor"><rect x="16" y="224" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="240" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 252h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">학습 · 허용된 랩</tspan></text><text x="32" y="318" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">진행 자료</tspan></text><text x="32" y="351" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">공식 교재 · 과제</tspan></text></g><g data-panel="file"><rect x="16" y="432" width="328" height="234" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 448h23l9 9v32H32Z M55 448v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="524" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">평가 · 인증서</tspan></text><text x="32" y="569" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">대조할 조건</tspan></text><text x="32" y="602" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">등록한 과정의 평가·발급</tspan><tspan x="32" dy="31">기준</tspan></text></g><path d="M180 181V216" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 389V424" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
