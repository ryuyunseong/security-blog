<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">TLS 버전·인증서 신뢰·서버 이름은 각각 확인할 조건이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">암호화 연결과 서버 신원 확인</text><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">프로토콜</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">TLS 버전과 암호 협상</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">통신을 보호하는 조건</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">신뢰 경로</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">인증서 발급 CA 확인</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">신뢰할 수 있는 발급 경로</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">서버 이름</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">접속 이름과 SAN 대조</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">의도한 서버인지 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">TLS 1.3으로 협상돼도 이름이나 CA가 다르면 검증이 실패한다.</text></g></svg>
