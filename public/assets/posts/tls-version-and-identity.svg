<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">TLS 버전·인증서 신뢰·서버 이름은 각각 확인할 조건이다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">암호화 연결과 서버 신원 확인</text><rect x="44" y="145" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700">프로토콜</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400">TLS 버전과 암호 협상</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400">통신을 보호하는 조건</text><rect x="44" y="233" width="872" height="76" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700">신뢰 경로</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400">인증서 발급 CA 확인</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400">신뢰할 수 있는 발급 경로</text><rect x="44" y="321" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700">서버 이름</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400">접속 이름과 SAN 대조</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400">의도한 서버인지 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">TLS 1.3으로 협상돼도 이름이나 CA가 다르면 검증이 실패한다.</text></g></svg>
