<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">같은 루프백 서버에 네 조건으로 접속한 결과예요. 거절 사례의 TLS 1.3은 요청 조건이며 협상을 마쳤다는 뜻은 아니에요. TLS 1.3으로 협상돼도 이름이나 CA가 다르면 검증이 실패해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="464" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="288" height="418" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이름·신뢰 CA가 일치</tspan></text><rect x="28" y="79" width="264" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">허용 버전</tspan></text><path d="M160 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="168" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="168" dy="0">실행 결과</tspan></text><rect x="28" y="126" width="264" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TLS 1.3</tspan></text><path d="M160 126v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="168" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="168" dy="0">TLS 1.3,</tspan><tspan x="168" dy="28">HTTP 200</tspan></text><rect x="28" y="198" width="264" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="226" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TLS 