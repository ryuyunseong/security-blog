<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">TLS 버전, 인증서의 신뢰 경로, 서버 이름은 각각 검사하는 조건이에요. 이름은 루프백 실습의 비교 문자열이에요. TLS 1.3으로 협상돼도 이름이나 CA가 다르면 검증이 실패해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="302" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="157" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">프로토콜 협상</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">루프백 실습</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">TLS 1.2 · TLS 1.3</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">서버 인증서</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">이름 비교</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">lab.example.invalid</tspan></text><text x="352" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">대조 필드</tspan></text><text x="352" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">SAN</tspan></text></g><g data-panel="actor"><rect x="656" y="16" width="288" height="157" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="682" cy="45" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M692 45h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="726" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="726" dy="0">인증서 신뢰 경로</tspan></text><text x="672" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">신뢰 기준</tspan></text><text x="672" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">실습용 CA</tspan></text></g></g></svg>
