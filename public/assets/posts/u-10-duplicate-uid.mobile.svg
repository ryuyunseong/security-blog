<svg xmlns="http://www.w3.org/2000/svg" width="360" height="835" viewBox="0 0 360 835" data-diagram-kind="merge" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 UID를 쓰면 파일 소유권도 겹친다</title><desc id="desc">GID가 달라도 두 이름은 UID 1500을 공유해요. 중앙 계정 조회가 빠진 경우에는 이 가상 연결만으로 전체 범위를 판단하지 않아요. 숫자만 바꾸기 전에 파일 소유권과 실행 중인 작업을 확인해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="835" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="70" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">deploy</tspan></text><text x="52" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">UID</tspan></text><text x="52" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1500</tspan></text><text x="52" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">GID</tspan></text><text x="52" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1500</tspan></text></g><g data-panel="actor"><rect x="36" y="300" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="70" cy="326" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 358v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="338" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">backup</tspan></text><text x="52" y="394" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">UID</tspan></text><text x="52" y="427" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1500</tspan></text><text x="52" y="470" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">GID</tspan></text><text x="52" y="503" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1600</tspan></text></g><g data-panel="file"><rect x="36" y="584" width="308" height="203" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 600h23l9 9v32H52Z M75 600v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="676" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">같은 사용자 식별자</tspan></text><text x="52" y="721" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">UID</tspan></text><text x="52" y="754" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1500</tspan></text></g><path d="M36 134H16V685.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 418H16V685.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
