<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1063" viewBox="0 0 360 1063" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">동일한 중지 설정과 서로 다른 가상 실행 자료</title><desc id="desc">두 행은 같은 설정을 공유하는 별개의 가상 사례예요. 화살표는 설정과 실행 자료의 대조 관계이며 실제 서비스 시작·중지 동작이 아니에요. 운영 Finger 실행 결과가 아닌 가상 JSON 대조다. 수신 값은 서비스 실행 주체와 연결된 자료가 있다고 가정한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1063" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="36" y="16" width="308" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 32h23l9 9v32H52Z M75 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">공통 가상 설정값</tspan></text><text x="52" y="153" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">manager</tspan></text><text x="52" y="186" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">xinetd</tspan></text><text x="52" y="229" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">setting</tspan></text><text x="52" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">yes (시작 금지 속성)</tspan></text></g><g data-panel="actor"><rect x="36" y="343" width="308" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="359" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 371h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="381" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">x-stop</tspan></text><text x="52" y="437" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">runtime</tspan></text><text x="52" y="470" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">not-listening</tspan></text><text x="52" y="513" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Finger 수신 가정</tspan></text><text x="52" y="546" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">없음</tspan></text><text x="52" y="589" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">비교 결과</tspan></text><text x="52" y="622" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">입력 조건 일치</tspan></text></g><g data-panel="actor"><rect x="36" y="703" width="308" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="52" y="719" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M60 731h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="106" y="741" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">x-stale</tspan></text><text x="52" y="797" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">runtime</tspan></text><text x="52" y="830" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">listening</tspan></text><text x="52" y="873" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Finger 수신 가정</tspan></text><text x="52" y="906" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">있음</tspan></text><text x="52" y="949" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">비교 결과</tspan></text><