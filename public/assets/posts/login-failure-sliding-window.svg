<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="timeline" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">192.0.2.10의 0·4·9초 실패가 최근 10초 구간에 함께 남아 9초에 처음 알린다. 점 간격은 시간 비례가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">같은 IP의 세 번째 실패가 들어오는 시점</text><path d="M110 232H850" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="130" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">0초</text><text x="130" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">첫 실패: 1회</text><text x="130" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">192.0.2.10</text><circle cx="480" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="480" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">4초</text><text x="480" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">구간 안에 2회</text><text x="480" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">0초·4초가 남음</text><circle cx="830" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="830" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">9초</text><text x="830" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">3회 도달: 첫 알림</text><text x="830" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">구간 (-1, 9]</text><text x="480" y="418" font-size="17" fill="#287056" font-weight="400" text-anchor="middle">왼쪽에서 오른쪽으로 진행</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">본문의 W=10, K=3 예제에서 한 IP만 골랐다. 왼쪽 경계는 제외한다.</text></g></svg>
