<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" data-diagram-kind="timeline" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">칸 안의 숫자는 가상 실패 시각(초)이에요. 9초의 구간에는 0·4·9초가 함께 남으며 칸 간격은 시간 비례가 아니에요. 본문의 W=10, K=3 예제에서 한 IP만 골랐고 왼쪽 경계는 제외해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="260" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="array"><rect x="16" y="16" width="288" height="190" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">0초: 남은 실패 시각</tspan></text><rect x="32" y="79" width="256" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="160" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="160" dy="0">0</tspan></text><text x="32" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">건수</tspan></text><text x="32" y="174" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1회</tspan></text></g><g data-panel="array"><rect x="336" y="16" width="288" height="190" rx="10" fill="#fff" stroke="#cadbd1"/><text x="352" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">4초: 남은 실패 시각</tspan></text><rect x="352" y="79" width="128" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="416" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="416" dy="0">0</tspan></text><rect x="480" y="79" width="128" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="544" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="544" dy="0">4</tspan></text><text x="352" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">건수</tspan></text><text x="352" y="174" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">2회</tspan></text></g><g data-panel="array"><rect x="656" y="16" width="288" height="190" rx="10" fill="#fff" stroke="#cadbd1"/><text x="672" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">9초: 구간 (-1, 9]</tspan></text><rect x="672" y="79" width="85.33333333333333" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="714.6666666666666" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="714.6666666666666" dy="0">0</tspan></text><rect x="757.3333333333334" y="79" width="85.33333333333333" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="800" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="800" dy="0">4</tspan></text><rect x="842.6666666666666" y="79" width="85.33333333333333" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="885.3333333333333" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="885.3333333333333" dy="0">9</tspan></text><text x="672" y="143" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">건수</tspan></text><text x="672" y="174" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">3회: 첫 알림</tspan></text></g><path d="M307 111H320V111H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 111H640V111H650" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
