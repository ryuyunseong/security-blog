<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 148 960 220" data-diagram-kind="timeline" role="img" aria-labelledby="title desc"><title id="title">같은 IP의 세 번째 실패가 들어오는 시점</title><desc id="desc">W=10, K=3일 때 192.0.2.10은 9초에 처음 알린다. 왼쪽 경계는 제외하며 점 간격은 시간에 비례하지 않는다. 본문의 W=10, K=3 예제에서 한 IP만 골랐다. 왼쪽 경계는 제외한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="148" width="960" height="220" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M110 232H850" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="130" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">0초</text><text x="130" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">첫 실패: 1회</text><text x="130" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">192.0.2.10</text><circle cx="480" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="480" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">4초</text><text x="480" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">구간 안에 2회</text><text x="480" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">0초·4초가 남음</text><circle cx="830" cy="232" r="10" fill="#287056" stroke="#f1f6f2" stroke-width="4"/><text x="830" y="195" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle">9초</text><text x="830" y="295" font-size="19" fill="#536b60" font-weight="400" text-anchor="middle">3회 도달: 첫 알림</text><text x="830" y="332" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">구간 (-1, 9]</text></g></svg>
