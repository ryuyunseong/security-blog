<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">최근 구간 안의 실패만 남긴다</title><desc id="desc">슬라이딩 윈도는 덱에 남은 기록과 IP별 횟수를 함께 갱신한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">최근 구간 안의 실패만 남긴다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">오래된 기록 제거</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">시각 ≤ t − W</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">덱의 앞에서 꺼내기</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">현재 실패 추가</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">t − W &lt; 시각 ≤ t</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">IP별 횟수 갱신</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">임계값 확인</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">횟수 ≥ K</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">첫 알림 여부 기록</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">왼쪽 경계는 제외한다. 같은 시각의 입력은 읽은 순서대로 처리한다.</text></g></svg>
