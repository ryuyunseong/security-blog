<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">Search List의 연결 위치를 확인한다</title><desc id="desc">Search List가 스캔·보고서·티켓 중 어디에 연결됐는지에 따라 결과의 의미가 달라진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">Search List의 연결 위치를 확인한다</text><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">스캔 옵션</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">검사할 QID 선택</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">Custom 범위 확인</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">보고서 템플릿</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">표시할 QID 선택</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">원본 결과와 대조</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">티켓 규칙</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">생성할 대상 선택</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">탐지와 티켓 구분</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">목록에 QID가 있어도 해당 호스트의 탐지 결과를 뜻하지 않는다.</text></g></svg>
