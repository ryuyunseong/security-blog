<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">Search List의 연결 위치를 확인한다</title><desc id="desc">같은 QID 목록이 서로 다른 지점에 꽂히는 관계예요. 보고서 필터를 바꾼 것을 검사 범위 변경과 혼동하지 않도록 나눴어요. 목록에 QID가 있어도 해당 호스트의 탐지 결과를 뜻하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="510" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="attachments"><rect x="16" y="16" width="928" height="478" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">목록을 연결하는 세 지점</tspan></text><rect x="40" y="189" width="270" height="112" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><path d="M157 201h23l9 9v32H157Z M180 201v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="175" y="273" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="175" dy="0">Search List</tspan></text><rect x="489.28000000000003" y="79" width="438.71999999999997" height="111" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="505.28000000000003" y="91" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M513.28 103h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="551.28" y="113" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="551.28" dy="0">스캔 옵션 Custom</tspan></text><text x="505.28000000000003" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="505.28000000000003" dy="0">검사할 QID</tspan></text><path d="M310 245H396.64V134.5H483.28000000000003" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="489.28000000000003" y="214" width="438.71999999999997" height="111" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M505.28000000000003 226h23l9 9v32H505.28000000000003Z M528.28 226v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="551.28" y="248" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="551.28" dy="0">보고서 템플릿</tspan></text><text x="505.28000000000003" y="293" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="505.28000000000003" dy="0">원본 결과 중 표시할 QID</tspan></text><path d="M310 245H396.64V269.5H483.28000000000003" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="489.28000000000003" y="349" width="438.71999999999997" height="111" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M505.28000000000003 361h23l9 9v32H505.28000000000003Z M528.28 361v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="551.28" y="383" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="551.28" dy="0">티켓 규칙</tspan></text><text x="505.28000000000003" y="428" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="505.28000000000003" dy="0">티켓을 만들 탐지</tspan></text><path d="M310 245H396.64V404.5H483.28000000000003" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></g></svg>
