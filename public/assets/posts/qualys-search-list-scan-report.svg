<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 120 960 340" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">Search List의 연결 위치를 확인한다</title><desc id="desc">Search List는 QID 선택 조건이다. 호스트별 탐지 여부는 원본 스캔 결과에서 판단한다. 목록에 QID가 있어도 해당 호스트의 탐지 결과를 뜻하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="120" width="960" height="340" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">스캔 옵션</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">검사할 QID 선택</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">Custom 범위 확인</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">보고서 템플릿</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">표시할 QID 선택</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">원본 결과와 대조</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">티켓 규칙</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">생성할 대상 선택</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">탐지와 티켓 구분</text></g></svg>
