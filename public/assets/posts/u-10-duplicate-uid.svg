<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" data-diagram-kind="merge" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">같은 UID를 쓰면 파일 소유권도 겹친다</title><desc id="desc">GID가 달라도 두 이름은 UID 1500을 공유해요. 중앙 계정 조회가 빠진 경우에는 이 가상 연결만으로 전체 범위를 판단하지 않아요. 숫자만 바꾸기 전에 파일 소유권과 실행 중인 작업을 확인해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="524" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="50" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">deploy</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">UID</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1500</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">GID</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1500</tspan></text></g><g data-panel="actor"><rect x="16" y="270" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="50" cy="296" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 328v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="308" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">backup</tspan></text><text x="32" y="364" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">UID</tspan></text><text x="32" y="395" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1500</tspan></text><text x="32" y="437" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">GID</tspan></text><text x="32" y="468" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">1600</tspan></text></g><g data-panel="file"><rect x="534" y="16" width="410" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M550 32h23l9 9v32H550Z M573 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="550" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">같은 사용자 식별자</tspan></text><text x="550" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">UID</tspan></text><text x="550" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">1500</tspan></text></g><path d="M429 131H480V114.5H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M429 385H480V114.5H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
