<svg xmlns="http://www.w3.org/2000/svg" width="960" height="367" viewBox="0 117 960 367" data-diagram-kind="merge" role="img" aria-labelledby="title desc"><title id="title">같은 UID를 쓰면 파일 소유권도 겹친다</title><desc id="desc">UID 중복은 GID가 다른 계정 사이에서도 발생한다. 숫자만 바꾸기 전에 파일 소유권과 실행 중인 작업을 확인한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="117" width="960" height="367" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="141" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="176" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="218" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">deploy</text><text x="66" y="260" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID 1500</text><rect x="44" y="306" width="390" height="154" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="341" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="66" y="383" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">backup</text><text x="66" y="425" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID 1500</text><path d="M434 218H480V300H524 M434 382H480V300" fill="none" stroke="#7eaa93" stroke-width="3"/><rect x="524" y="202" width="392" height="205" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="237" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="546" y="279" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">공유한 사용자 ID</text><text x="546" y="321" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">UID = 1500</text><text x="546" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹이 달라도 UID 중복</text><text x="66" y="278" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">GID 1500</text><text x="66" y="443" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">GID 1600</text></g></svg>
