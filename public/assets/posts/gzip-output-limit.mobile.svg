<svg xmlns="http://www.w3.org/2000/svg" width="360" height="518" viewBox="0 0 360 518" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">gzip 544바이트 → 해제 결과 512 KiB</title><desc id="desc">막대는 같은 바이트 축을 사용해요. 작은 입력이 입력 한도를 통과해도 해제한 출력은 별도의 한도에서 멈춰야 해요. 압축 크기 수치는 이번 실행 환경의 값이며 버전에 따라 달라질 수 있어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="518" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="bytes"><rect x="16" y="16" width="328" height="478" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">압축 파일과 해제량의 차이</tspan></text><text x="32" y="101" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">압축 입력</tspan></text><rect x="36" y="118" width="288" height="24" rx="0" fill="#f1f6f2" stroke="#cadbd1"/><rect x="36" y="118" width="0.298828125" height="24" rx="0" fill="#9abfa9" stroke="#cadbd1"/><text x="32" y="170" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">544 바이트</tspan></text><text x="32" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">해제한 원문</tspan></text><rect x="36" y="241" width="288" height="24" rx="0" fill="#f1f6f2" stroke="#cadbd1"/><rect x="36" y="241" width="288" height="24" rx="0" fill="#9abfa9" stroke="#cadbd1"/><text x="32" y="293" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">524288 바이트</tspan></text><text x="32" y="347" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">출력 한도</tspan></text><rect x="36" y=