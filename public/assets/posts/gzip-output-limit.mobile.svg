<svg xmlns="http://www.w3.org/2000/svg" width="360" height="685" viewBox="0 0 360 685" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">gzip 544바이트 → 해제 결과 512 KiB</title><desc id="desc">입력 크기와 해제 출력량에 각각 상한을 둔다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="685" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">gzip 544바이트 → 해제 결과</tspan><tspan x="16" dy="31">512 KiB</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">압축 입력</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실습 예제 544바이트</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">입력 한도는 통과</tspan></text><path d="M180 240v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="271" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="309" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">압축 해제</tspan></text><text x="32" y="344" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">원문 524,288바이트</tspan></text><text x="32" y="378" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실제 반환량을 누적</tspan></text><path d="M180 407v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="438" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="476" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">출력 제한</tspan></text><text x="32" y="511" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">한도 65,536바이트</tspan></text><text x="32" y="545" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">한도 + 1에서 초과 감지</tspan></text><path d="M16 593H344" stroke="#cadbd1"/><text x="16" y="629" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">압축 크기 수치는 이번 실행 환경의</tspan><tspan x="16" dy="28">값이며 버전에 따라 달라질 수 있다.</tspan></text></g></svg>
