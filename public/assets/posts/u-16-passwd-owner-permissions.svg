<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">소유자와 권한 비트를 함께 대조하기</title><desc id="desc">예·아니요 분기는 소유자와 일반 권한 조건을 함께 적용한 결과다. 0606은 기타 쓰기 비트가 있어 불일치로 분기한다. 일반 권한 9비트의 비교이며 ACL과 특수 비트는 별도 조사 대상이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">기준 대조</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">UID 0이고</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">0644 허용 비트인가?</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">충족</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">0644·0640·0600</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">읽기 영향도 시험</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">불일치</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">소유자 다름·추가 비트</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">현재 속성부터 기록</text></g></svg>
