<svg xmlns="http://www.w3.org/2000/svg" width="360" height="513" viewBox="0 0 360 513" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">조건과 정렬로 도서 두 권 고르기</title><desc id="desc">가격이 같으면 book_id를 추가 정렬 기준으로 쓴다. 도서 번호는 조건 적용 뒤에도 유지된다. 가격 단위는 원이며 이 그림의 순서는 논리적 결과를 설명한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="513" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">입력</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">도서 목록 5행</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">번호는 book_id</tspan></text><path d="M180 152v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="183" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="221" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">조건</tspan></text><text x="32" y="256" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">재고 있음·2만원 이상</tspan></text><text x="32" y="290" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">1·4·5번이 대상</tspan></text><path d="M180 319v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="350" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="388" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">정렬·제한</tspan></text><text x="32" y="423" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">가격 내림차순·2행</tspan></text><text x="32" y="457" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">5번 다음 4번</tspan></text></g></svg>
