<svg xmlns="http://www.w3.org/2000/svg" width="360" height="614" viewBox="0 0 360 614" data-diagram-kind="matrix" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">TLS 버전·인증서 신뢰·서버 이름은 각각 확인할 조건이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="614" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">암호화 연결과 서버 신원 확인</tspan></text><rect x="16" y="73" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="111" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">프로토콜</tspan></text><text x="32" y="146" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">TLS 버전과 암호 협상</tspan></text><text x="32" y="180" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">통신을 보호하는 조건</tspan></text><rect x="16" y="220" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="258" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">신뢰 경로</tspan></text><text x="32" y="293" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">인증서 발급 CA 확인</tspan></text><text x="32" y="327" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">신뢰할 수 있는 발급 경로</tspan></text><rect x="16" y="367" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="405" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">서버 이름</tspan></text><text x="32" y="440" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">접속 이름과 SAN 대조</tspan></text><text x="32" y="474" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">의도한 서버인지 확인</tspan></text><path d="M16 522H344" stroke="#cadbd1"/><text x="16" y="558" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">TLS 1.3으로 협상돼도 이름이나</tspan><tspan x="16" dy="28">CA가 다르면 검증이 실패한다.</tspan></text></g></svg>
