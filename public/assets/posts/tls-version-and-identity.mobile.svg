<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1350" viewBox="0 0 360 1350" data-diagram-kind="matrix" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">암호화 연결과 서버 신원 확인</title><desc id="desc">같은 루프백 서버에 네 조건으로 접속한 결과예요. 거절 사례의 TLS 1.3은 요청 조건이며 협상을 마쳤다는 뜻은 아니에요. TLS 1.3으로 협상돼도 이름이나 CA가 다르면 검증이 실패해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1350" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="328" height="424" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이름·신뢰 CA가 일치</tspan></text><rect x="28" y="79" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">허용 버전</tspan></text><path d="M180 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">실행 결과</tspan></text><rect x="28" y="126" width="304" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TLS 1.3</tspan></text><path d="M180 126v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">TLS 1.3,</tspan><tspan x="188" dy="28">HTTP 200</tspan></text><rect x="28" y="198" width="304" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="226" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">TLS 1.2</tspan></text><path d="M180 198v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="226" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">TLS 1.2,</tspan><tspan x="188" dy="28">HTTP 200</tspan></text><text x="32" y="298" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">검증할 이름</tspan></text><text x="32" y="331" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">lab.example.invalid</tspan></text><text x="32" y="374" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">신뢰 CA</tspan></text><text x="32" y="407" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">발급 CA인 trusted.pem</tspan></text></g><g data-panel="actor"><rect x="16" y="464" width="328" height="419" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="493" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 493h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="502" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">다른 이름을 검증</tspan></text><text x="32" y="558" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">요청 버전</tspan></text><text x="32" y="591" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">TLS 1.3</tspan></text><text x="32" y="634" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">신뢰 CA</tspan></text><text x="32" y="667" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">발급 CA인 trusted.pem</tspan></text><text x="32" y="710" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">검증할 이름</tspan></text><text x="32" y="743" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">other.example.</tspan><tspan x="32" dy="31">invalid</tspan></text><text x="32" y="817" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">실행 결과</tspan></text><text x="32" y="850" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이름 검증 실패, 연결 거절</tspan></text></g><g data-panel="actor"><rect x="16" y="907" width="328" height="419" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="936" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 936h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="945" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">다른 CA를 신뢰</tspan></text><text x="32" y="1001" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">요청 버전</tspan></text><text x="32" y="1034" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">TLS 1.3</tspan></text><text x="32" y="1077" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">검증할 이름</tspan></text><text x="32" y="1110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">lab.example.invalid</tspan></text><text x="32" y="1153" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">신뢰 CA</tspan></text><text x="32" y="1186" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">관계없는 unrelated.pem</tspan></text><text x="32" y="1229" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">실행 결과</tspan></text><text x="32" y="1262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">신뢰 경로 검증 실패, 연결</tspan><tspan x="32" dy="31">거절</tspan></text></g></g></svg>
