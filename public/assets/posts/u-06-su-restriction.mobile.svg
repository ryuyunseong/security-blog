<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1073" viewBox="0 0 360 1073" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">su 파일 실행과 사용자 전환은 다른 단계다</title><desc id="desc">파일 실행 조건과 PAM 그룹 검사가 이어지는 지점을 그렸어요. 실제 su 인증은 이 실습에서 수행하지 않았어요. wheel 그룹을 만들었다는 사실만으로 su가 제한되지는 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1073" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="418" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/usr/bin/su</tspan></text><text x="32" y="155" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">mode 4750</tspan></text><g data-illustration="permission-bits" data-mode="4750"><text x="81.33333333333334" y="192" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="36" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="49.77777777777778" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="67.55555555555556" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="81.33333333333334" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="99.11111111111111" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="112.88888888888889" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">x</text><text x="180" y="192" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="134.66666666666669" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="148.44444444444446" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="166.22222222222223" y="202" width="27.555555555555557" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="180" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="197.7777777777778" y="202" width="27.555555555555557" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="211.55555555555557" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">x</text><text x="278.6666666666667" y="192" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">기타</text><rect x="233.33333333333334" y="202" width="27.555555555555557" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="247.11111111111111" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="264.8888888888889" y="202" width="27.555555555555557" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="278.6666666666667" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="296.44444444444446" y="202" width="27.555555555555557" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="310.22222222222223" y="224" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text></g><text x="32" y="268" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">특수 비트: SUID</tspan></text><text x="32" y="304" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">r 읽기, w 쓰기, x 실행, -</tsp