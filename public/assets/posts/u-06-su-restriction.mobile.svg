<svg xmlns="http://www.w3.org/2000/svg" width="360" height="713" viewBox="0 0 360 713" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">su 파일 실행과 사용자 전환은 다른 단계다</title><desc id="desc">su 실행 권한, PAM 인증 흐름, 요청자의 그룹 소속을 대조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="713" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">su 파일 실행과 사용자 전환은</tspan><tspan x="16" dy="31">다른 단계다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">실행 파일</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">소유권 · 실행 비트</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">ACL 등 추가 조건</tspan></text><path d="M180 240v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="271" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="309" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">인증 경로</tspan></text><text x="32" y="344" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">PAM 규칙과 분기</tspan></text><text x="32" y="378" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">pam_wheel 호출 확인</tspan></text><path d="M180 407v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="438" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="476" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">허용 계정</tspan></text><text x="32" y="511" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">기본 그룹 + 추가 그룹</tspan></text><text x="32" y="545" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">승인된 구성원과 대조</tspan></text><path d="M16 593H344" stroke="#cadbd1"/><text x="16" y="629" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">wheel 그룹을 만들었다는</tspan><tspan x="16" dy="28">사실만으로 su가 제한되지는</tspan><tspan x="16" dy="28">않는다.</tspan></text></g></svg>
