<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">원격 IPv4 목적지와 다음 홉을 나누는 가상 계산</title><desc id="desc">목적지 IP는 원격 서버를 가리키고 링크 주소를 구할 대상은 같은 연결망의 다음 홉이다. 192.0.2.0/24가 직접 연결된 가상 경로표다. 실제 ARP·소켓·패킷·운영 경로표는 수집하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">원격 목적지</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">198.51.100.8</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">직접 연결망 밖</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">가상 경로 선택</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">198.51.100.0/24</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">다음 홉 192.0.2.254</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">링크 전달 대상</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">게이트웨이 주소</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">목적지 IP와 구분</text></g></svg>
