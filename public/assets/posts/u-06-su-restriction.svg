<svg xmlns="http://www.w3.org/2000/svg" width="960" height="517" viewBox="0 0 960 517" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">su 파일 실행과 사용자 전환은 다른 단계다</title><desc id="desc">파일 실행 조건과 PAM 그룹 검사가 이어지는 지점을 그렸어요. 실제 su 인증은 이 실습에서 수행하지 않았어요. wheel 그룹을 만들었다는 사실만으로 su가 제한되지는 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="517" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="288" height="485" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/usr/bin/su</tspan></text><text x="32" y="152" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">mode 4750</tspan></text><g data-illustration="permission-bits" data-mode="4750"><text x="74.66666666666666" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="36" y="199" width="23.11111111111111" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="47.55555555555556" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="63.111111111111114" y="199" width="23.11111111111111" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="74.66666666666667" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="90.22222222222223" y="199" width="23.11111111111111" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="101.77777777777779" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">x</text><text x="160" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="121.33333333333333" y="199" width="23.11111111111111" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="132.88888888888889" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="148.44444444444443" y="199" width="23.11111111111111" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="159.99999999999997" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="175.55555555555554" y="199" width="23.11111111111111" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="187.1111111111111" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">x</text><text x="245.33333333333331" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">기타</text><rect x="206.66666666666666" y="199" width="23.11111111111111" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="218.2222222222222" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="233.77777777777777" y="199" width="23.11111111111111" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="245.33333333333331" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="260.88888888888886" y="199" width="23.11111111111111" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="272.4444444444444" y="221" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text></g><text x="32" y="265" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">특수 비트: SUID</tspan></text><text x="32" y="301" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">r 읽기, w 쓰기, x 실행, -</tspan><tspan x="32" dy="28">없음</tspan></text><text x="32" y="365" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">예시 소유자·그룹</tspan></text><text x="32" y="396" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">root : wheel</tspan></text><text x="32" y="438" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">기타 사용자</tspan></text><text x="32" y="469" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">실행 비트 없음</tspan></text></g><g data-panel="file"><rect x="336" y="16" width="288" height="371" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="352" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">/etc/pam.d/su</tspan></text><text x="352" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">그룹 제한 규칙 예시</tspan></text><text x="352" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">pam_wheel.so</tspan></text><text x="352" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">인수</tspan></text><text x="352" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">use_uid group=wheel</tspan></text><text x="352" y="296" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">거부가 적용될 조건</tspan></text><text x="352" y="327" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">이 규칙을 거쳐 최종 실패에</tspan><tspan x="352" dy="28">반영</tspan></text></g><g data-panel="table"><rect x="656" y="16" width="288" height="435" rx="10" fill="#fff" stroke="#cadbd1"/><text x="672" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">가상 구성원 조회</tspan></text><rect x="668" y="79" width="264" height="109" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="676" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="676" dy="0">계정</tspan></text><path d="M800 79v109" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="808" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="808" dy="0">wheel</tspan><tspan x="808" dy="31">구성원</tspan><tspan x="808" dy="31">근거</tspan></text><rect x="668" y="188" width="264" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="676" y="216" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="676" dy="0">admin</tspan></text><path d="M800 188v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="808" y="216" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="808" dy="0">기본 GID</tspan><tspan x="808" dy="28">10</tspan></text><rect x="668" y="260" width="264" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="676" y="288" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="676" dy="0">alice</tspan></text><path d="M800 260v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="808" y="288" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="808" dy="0">추가 구성원</tspan><tspan x="808" dy="28">목록</tspan></text><text x="672" y="360" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">관찰 범위</tspan></text><text x="672" y="391" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">조회만 수행, 실제 su</tspan><tspan x="672" dy="28">미실행</tspan></text></g><path d="M307 258.5H320V201.5H330" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M627 201.5H640V23