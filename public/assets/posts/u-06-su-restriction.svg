<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">su 파일 실행과 사용자 전환은 다른 단계다</title><desc id="desc">su 실행 권한, PAM 인증 흐름, 요청자의 그룹 소속을 대조한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">su 파일 실행과 사용자 전환은 다른 단계다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">실행 파일</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">소유권 · 실행 비트</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">ACL 등 추가 조건</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">인증 경로</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">PAM 규칙과 분기</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">pam_wheel 호출 확인</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">허용 계정</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">기본 그룹 + 추가 그룹</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">승인된 구성원과 대조</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">wheel 그룹을 만들었다는 사실만으로 su가 제한되지는 않는다.</text></g></svg>
