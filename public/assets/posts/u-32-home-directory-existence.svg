<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">홈 경로 조회 자료의 유무에 따른 조사 분기</title><desc id="desc">계정의 홈 필드와 같은 경로·시점의 자료를 사용한다. 이 분기는 로그인 성공 여부를 뜻하지 않는다. 실제 경로의 종류·부재를 알 수 있는 자료와 조회 오류·미수집을 구분한다. 실습은 임시 경로를 직접 조회하며 두 미확정 상태는 가상 입력이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">판별 자료가 있는가?</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">대상 경로와 수집 시점</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">조회 오류·미수집 구분</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">경로 결과 대조</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">디렉터리 / 부재</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">다른 종류도 분리</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">보류</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">조회 실패 또는 미수집</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">부재·양호로 바꾸지 않음</text></g></svg>
