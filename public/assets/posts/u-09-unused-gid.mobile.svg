<svg xmlns="http://www.w3.org/2000/svg" width="360" height="815" viewBox="0 0 360 815" data-diagram-kind="layers" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">구성원 없는 그룹이 곧 불필요한 그룹은 아니다</title><desc id="desc">alice 그룹의 구성원 칸이 비어 있어도 기본 GID가 연결돼 있어요. 서비스와 파일의 GID 사용 여부는 이 두 표 밖에서 더 조사해야 해요. 계정 연결이 없는 그룹은 검토 후보로 남기고 용도를 확인해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="815" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="36" y="16" width="308" height="172" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">passwd</tspan></text><rect x="48" y="79" width="284" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="56" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="56" dy="0">계정</tspan></text><path d="M190 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="198" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="198" dy="0">기본 GID</tspan></text><rect x="48" y="126" width="284" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="56" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="56" dy="0">alice</tspan></text><path d="M190 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="198" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="198" dy="0">1000</tspan></text></g><g data-panel="table"><rect x="36" y="236" width="308" height="247" rx="10" fill="#fff" stroke="#cadbd1"/><text x="52" y="274" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">group</tspan></text><rect x="48" y="299" width="284" height="78" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="56" y="329" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="56" dy="0">그룹</tspan></text><path d="M142.66666666666669 299v78" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="150.66666666666669" y="329" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="150.66666666666669" dy="0">GID</tspan></text><path d="M237.33333333333334 299v78" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="245.33333333333334" y="329" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="245.33333333333334" dy="0">추가</tspan><tspan x="245.33333333333334" dy="31">구성원</tspan></text><rect x="48" y="377" width="284" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="56" y="405" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="56" dy="0">alice</tspan></text><path d="M142.66666666666669 377v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="150.66666666666669" y="405" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="150.66666666666669" dy="0">1000</tspan></text><path d="M237.33333333333334 377v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="245.33333333333334" y="405" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="245.33333333333334" dy="0">빈 칸</tspan></text><rect x="48" y="421" width="284" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="56" y="449" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="56" dy="0">share</tspan></text><path d="M142.66666666666669 421v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="150.66666666666669" y="449" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="150.66666666666669" dy="0">2000</tspan></text>