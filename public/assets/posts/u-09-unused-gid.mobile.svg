<svg xmlns="http://www.w3.org/2000/svg" width="360" height="645" viewBox="0 0 360 645" data-diagram-kind="layers" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">구성원 없는 그룹이 곧 불필요한 그룹은 아니다</title><desc id="desc">기본·보조 구성원을 조회하고 서비스와 파일에서 해당 GID를 사용하는지 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="645" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">구성원 없는 그룹이 곧 불필요한</tspan><tspan x="16" dy="31">그룹은 아니다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">계정 연결</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">기본 GID · 추가 그룹</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">두 경로 모두 확인</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">운영 연결</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">서비스 실행 그룹</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">예약 작업 · 할당 계획</tspan></text><rect x="16" y="398" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="436" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">파일 연결</tspan></text><text x="32" y="471" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">숫자 소유 GID</tspan></text><text x="32" y="505" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">삭제해도 번호는 남음</tspan></text><path d="M16 553H344" stroke="#cadbd1"/><text x="16" y="589" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">계정 연결이 없는 그룹은 검토</tspan><tspan x="16" dy="28">후보로 남기고 용도를 확인한다.</tspan></text></g></svg>
