<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">PATH 순서에 따른 같은 이름의 선택</title><desc id="desc">같은 이름의 실행 후보를 둔 비교다. PATH의 앞쪽에서 파일을 찾으면 뒤쪽 후보까지 탐색하지 않는다. 두 디렉터리에 같은 이름의 실행 후보가 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">현재 경로 우선</text><g data-illustration="path-order"><rect x="66" y="221" width="167" height="90" rx="9" fill="#e6f0e9" stroke="#7eaa93"/><path d="M131.5 239v24h36V239H148.5l-5-6H131.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="149.5" y="296" font-size="20" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">.</text><text x="252" y="277" font-size="24" fill="#536b60" font-weight="400" text-anchor="middle">→</text><rect x="271" y="221" width="167" height="90" rx="9" fill="#fff" stroke="#7eaa93"/><path d="M336.5 239v24h36V239H353.5l-5-6H336.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="354.5" y="296" font-size="20" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">/usr/bin</text></g><text x="66" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">작업 폴더의 도구 선택</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">시스템 경로 우선</text><g data-illustration="path-order"><rect x="522" y="221" width="167" height="90" rx="9" fill="#e6f0e9" stroke="#7eaa93"/><path d="M587.5 239v24h36V239H604.5l-5-6H587.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="605.5" y="296" font-size="20" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">/usr/bin</text><text x="708" y="277" font-size="24" fill="#536b60" font-weight="400" text-anchor="middle">→</text><rect x="727" y="221" width="167" height="90" rx="9" fill="#fff" stroke="#7eaa93"/><path d="M792.5 239v24h36V239H809.5l-5-6H792.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="810.5" y="296" font-size="20" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">.</text></g><text x="522" y="352" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">시스템의 도구 선택</text></g></svg>
