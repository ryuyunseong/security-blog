<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">PATH 순서에 따른 같은 이름의 선택</title><desc id="desc">같은 이름의 실행 후보를 둔 비교다. PATH의 앞쪽에서 파일을 찾으면 뒤쪽 후보까지 탐색하지 않는다. 두 디렉터리에 같은 이름의 실행 후보가 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">현재 경로 우선</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">. → /usr/bin</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">작업 폴더의 도구 선택</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">시스템 경로 우선</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">/usr/bin → .</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">시스템의 도구 선택</text></g></svg>
