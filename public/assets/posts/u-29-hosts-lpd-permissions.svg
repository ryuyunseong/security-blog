<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">hosts.lpd 부재 근거와 수집 상태 분리</title><desc id="desc">조회 실패를 파일 부재로 바꾸면 ‘예’ 쪽으로 잘못 분류된다. 가상 수집 자료를 나누는 분기다. 미수집은 보류하며 존재가 입증된 일반 파일의 사용 필요성·UID·권한을 이어서 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">파일 부재 입증?</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">가상 수집 자료의</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">부재 근거를 비교</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">예: 부재 근거</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">소유자·모드</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">비교 생략</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">아니요: 분리</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">존재: 필요성 조사</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">미수집: 보류</text></g></svg>
