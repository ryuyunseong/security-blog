<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" data-diagram-kind="decision" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">직접 로그인 필요성에 따라 셸을 검토한다</title><desc id="desc">로그인이 불필요하다고 정한 가상 대상에서 셸 문자열을 비교한 결과예요. daemon이 빠졌다는 사실이 모든 실행 경로의 차단을 입증하지는 않아요. 셸 제한은 모든 프로세스 실행을 차단하는 설정이 아니에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="380" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="448" height="348" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 계정의 셸</tspan></text><rect x="28" y="79" width="424" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="111" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">계정: svc_report</tspan></text><text x="40" y="145" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">셸: /bin/bash</tspan></text><rect x="28" y="176" width="424" height="87" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="208" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">계정: daemon</tspan></text><text x="40" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">셸: /usr/sbin/nologin</tspan></text><text x="32" y="301" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">비교 전제</tspan></text><text x="32" y="332" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대화형 로그인이 불필요한 가상 대상</tspan></text></g><g data-panel="set"><rect x="496" y="16" width="448" height="210" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">검토 후보</tspan></text><rect x="512" y="79" width="164" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="594" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="594" dy="0">svc_report</tspan></text><text x="512" y="163" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">후보로 남는 이유</tspan></text><text x="512" y="194" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">/bin/bash가 지정됨</tspan></text></g><path d="M467 190H480V121H490" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
