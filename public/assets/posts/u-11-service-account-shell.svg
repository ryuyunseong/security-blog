<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">직접 로그인 필요성에 따라 셸을 검토한다</title><desc id="desc">로그인 필요성을 정한 뒤 계정의 셸과 변경 시 영향을 받는 서비스·작업을 조사한다. 셸 제한은 모든 프로세스 실행을 차단하는 설정이 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">로그인이 필요한가</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">계정 용도·담당자 확인</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">서비스 계정별 검토</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">업무용 셸 검토</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">승인된 로그인 방식과 대조</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">서비스·예약 작업 영향 조사</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">제한용 셸 검토</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">nologin 등 적용 여부</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">서비스·예약 작업 영향 조사</text></g></svg>
