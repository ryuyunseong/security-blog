<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">계정 용도를 확인한 뒤 셸을 판단한다</title><desc id="desc">로그인 불필요 계정을 정하고 셸과 업무 영향을 순서대로 확인하는 도식.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">계정 용도를 확인한 뒤 셸을 판단한다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">업무 확인</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">직접 로그인이 필요한가</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">담당자와 용도 확인</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">셸 확인</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">제한용 셸과 빈 값 구분</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">가상 자료로 후보 분류</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">영향 확인</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">서비스 · 예약 작업</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">로그인 제한과 함께 검증</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">셸 제한은 모든 프로세스 실행을 차단하는 설정이 아니다.</text></g></svg>
