<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">계정 삭제 전에는 사용 관계부터 확인한다</title><desc id="desc">담당자와 계정 용도를 확인한 뒤 서비스·예약 작업·소유 파일을 조사한다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트  /  구조로 읽기</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">계정 삭제 전에는 사용 관계부터 확인한다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">계정 목록</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">로컬 파일 · 중앙 계정</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">점검 범위 구분</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">유지 근거</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">담당자 · 승인 목록</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">서비스 · 배치 작업</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">처리 결정</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">검토 후보 정리</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">변경 후 동작 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">승인 목록에서 빠진 계정은 담당자와 용도를 확인한 뒤 처리한다.</text></g></svg>
