<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">승인 목록과 계정의 실제 용도를 대조한다</title><desc id="desc">담당자와 계정 용도를 확인한 뒤 서비스·예약 작업·소유 파일을 조사한다. 승인 목록에서 빠진 계정은 담당자와 용도를 확인한 뒤 처리한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">승인 목록에 있나</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">로컬·중앙 계정 구분</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">계정별 검토</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">사용 목적 대조</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">담당자·서비스·배치 작업</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">등록된 계정도 용도 검토</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">목록 차이 조사</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">누락·계약 종료 여부</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">자동 삭제 목록으로 쓰지 않음</text></g></svg>
