<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" data-diagram-kind="decision" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">승인 목록과 로컬 계정 이름의 차이</title><desc id="desc">oldvendor는 승인 목록과 다른 가상 사례예요. 차이는 필요성을 조사할 출발점이며 삭제 지시가 아니에요. 승인 목록에서 빠진 계정은 담당자와 용도를 확인한 뒤 처리해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="292" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="set"><rect x="16" y="16" width="448" height="137" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 실행의 승인 목록</tspan></text><rect x="32" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="77" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="77" dy="0">root</tspan></text><rect x="132" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="177" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="177" dy="0">svc</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">가상 로컬 자료와 차이</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">이름</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">승인 목록</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">root</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">있음</tspan></text><rect x="508" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">svc</tspan></text><path d="M720 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">있음</tspan></text><rect x="508" y="214" width="424" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="516" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">oldvendor</tspan></text><path d="M720 214v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">없음</tspan></text></g></g></svg>
