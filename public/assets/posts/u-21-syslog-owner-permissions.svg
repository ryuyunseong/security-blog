<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 121 960 300" data-diagram-kind="layers" role="img" aria-labelledby="title desc"><title id="title">로그 설정의 소유자와 권한을 조사하는 세 지점</title><desc id="desc">설정 파일의 소유자는 로그를 처리하는 프로세스의 실행 계정과 구분한다. 세 항목은 별도의 조사 자료다. 코드의 계정명과 모드는 가상 입력이며 실제 로그 전송이나 권한을 수집하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="121" width="960" height="300" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="145" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">소유자 목록</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">root · bin · sys</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">해당 OS의 계정 자료 대조</text><rect x="44" y="233" width="872" height="76" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">일반 권한</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">허용 비트 0640</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹 쓰기·기타 권한 제외</text><rect x="44" y="321" width="872" height="76" rx="12" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700" text-anchor="start">적용 설정 경로</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400" text-anchor="start">주 설정·포함 설정</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">파일·링크·ACL 구분</text></g></svg>
