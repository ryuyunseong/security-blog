<svg xmlns="http://www.w3.org/2000/svg" width="960" height="549" viewBox="0 0 960 549" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">로그 설정의 소유자와 권한을 조사하는 세 지점</title><desc id="desc">허용 소유자와 일반 권한 조건이 같은 설정 파일에 함께 적용돼요. 실제 경로와 계정은 해당 OS 자료로 대조해야 해요. 세 항목은 별도의 조사 자료예요. 코드의 계정명과 모드는 가상 입력이며 실제 로그 전송이나 권한을 수집하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="set"><rect x="16" y="16" width="410" height="137" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">원문이 제시한 소유자</tspan></text><rect x="32" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="77" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="77" dy="0">root</tspan></text><rect x="132" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="177" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="177" dy="0">bin</tspan></text><rect x="232" y="79" width="90" height="48" rx="24" fill="#fff" stroke="#cadbd1"/><text x="277" y="110" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="277" dy="0">sys</tspan></text></g><g data-panel="file"><rect x="16" y="177" width="410" height="348" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 193h23l9 9v32H32Z M55 193v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="267" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">일반 권한 기준</tspan></text><text x="32" y="313" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">mode 0640</tspan></text><g data-illustration="permission-bits" data-mode="0640"><text x="95" y="350" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="36" y="360" width="36.666666666666664" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="54.33333333333333" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="76.66666666666666" y="360" width="36.666666666666664" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="94.99999999999999" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="117.33333333333333" y="360" width="36.666666666666664" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="135.66666666666666" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="221" y="350" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="162" y="360" width="36.666666666666664" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="180.33333333333334" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="202.66666666666666" y="360" width="36.666666666666664" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="221" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="243.33333333333331" y="360" width="36.666666666666664" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="261.66666666666663" y="382" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="347" y="350" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle">기타</text><rect x="288" y="360" width="36.666666666666664" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"