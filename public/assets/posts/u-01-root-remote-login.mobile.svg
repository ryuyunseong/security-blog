<svg xmlns="http://www.w3.org/2000/svg" width="360" height="685" viewBox="0 0 360 685" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">SSH 설정은 접속 조건까지 읽어야 한다</title><desc id="desc">Include와 Match를 거친 값을 확인한 뒤 실제 서비스 적용 여부를 살핀다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="685" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">SSH 설정은 접속 조건까지</tspan><tspan x="16" dy="31">읽어야 한다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">설정 파일</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">Include로 다른 파일 포함</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">PermitRootLogin no</tspan></text><path d="M180 240v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="271" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="309" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">접속 조건</tspan></text><text x="32" y="344" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">Match Address / User</tspan></text><text x="32" y="378" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">조건별 설정 해석</tspan></text><path d="M180 407v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="438" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="476" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">적용값 확인</tspan></text><text x="32" y="511" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">sshd -T -C</tspan></text><text x="32" y="545" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실제 로그인 시험은 별도</tspan></text><path d="M16 593H344" stroke="#cadbd1"/><text x="16" y="629" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">한 줄의 설정과 특정 접속 조건의</tspan><tspan x="16" dy="28">적용값을 구분한다.</tspan></text></g></svg>
