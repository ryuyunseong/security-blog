<svg xmlns="http://www.w3.org/2000/svg" width="360" height="998" viewBox="0 0 360 998" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">SSH 설정은 접속 조건까지 읽어야 한다</title><desc id="desc">두 주소는 설정 해석에 넣는 문자열이에요. 서비스 반영이나 실제 원격 로그인 결과를 그린 것은 아니에요. 한 줄의 설정과 특정 접속 조건의 적용값을 구분해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="998" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="386" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 sshd_config</tspan></text><text x="32" y="153" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">전역</tspan></text><text x="32" y="186" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">PermitRootLogin no</tspan></text><text x="32" y="229" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">주소 조건</tspan></text><text x="32" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Match Address</tspan><tspan x="32" dy="31">192.0.2.10</tspan></text><text x="32" y="336" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">조건 안</tspan></text><text x="32" y="369" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">PermitRootLogin yes</tspan></text></g><g data-panel="actor"><rect x="16" y="450" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="487" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 477l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="488" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">sshd -T -C</tspan></text><text x="32" y="544" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">바뀌는 입력</tspan></text><text x="32" y="577" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">addr</tspan></text><text x="32" y="620" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수행 범위</tspan></text><text x="32" y="653" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">설정 해석</tspan></text></g><g data-panel="table"><rect x="16" y="734" width="328" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="772" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">주소 조건별 유효값</tspan></text><rect x="28" y="797" width="304" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="827" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">addr</tspan></text><path d="M180 797v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="827" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="188" dy="0">값</tspan></text><rect x="28" y="844" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="872" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">192.0.2.11</tspan></text><path d="M180 844v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="872" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">no</tspan></text><rect x="28" y="888" width="304" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="916" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">192.0.2.10</tspan></text><path d="M180 888v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="188" y="916" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="188" dy="0">yes</tspan></text></g><path d="M180 407V442" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 691V726" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
