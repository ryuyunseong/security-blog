<svg xmlns="http://www.w3.org/2000/svg" width="360" height="673" viewBox="0 0 360 673" data-diagram-kind="layers" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">교육 계정과 제품 사용 환경을 구분한다</title><desc id="desc">접속한 환경에서 제공하는 앱, 사용자 권한, 할당된 자산을 확인한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="673" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">교육 계정과 제품 사용 환경을</tspan><tspan x="16" dy="31">구분한다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">교육 사이트</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">학습 자료 · 교육 과정</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">제품 구독과 별개</tspan></text><rect x="16" y="251" width="328" height="159" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">제품 환경</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">Community Edition ·</tspan><tspan x="32" dy="28">VMDR</tspan></text><text x="32" y="386" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">제공 앱과 범위 확인</tspan></text><rect x="16" y="426" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="464" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">실습 준비</tspan></text><text x="32" y="499" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">사용자 역할 · 자산 할당</tspan></text><text x="32" y="533" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">스캔 가능한 조건 확인</tspan></text><path d="M16 581H344" stroke="#cadbd1"/><text x="16" y="617" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">Qualys 공식 문서의 실습 준비</tspan><tspan x="16" dy="28">항목을 정리한 도식이다.</tspan></text></g></svg>
