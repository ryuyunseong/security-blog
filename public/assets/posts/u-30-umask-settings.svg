<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">UMASK 0022와 0031의 일반 파일 생성 권한</title><desc id="desc">0646의 마지막 6에는 기타 사용자 쓰기 2가 포함된다. 숫자 크기 비교만으로 이 비트를 알아낼 수 없다. 기본 ACL이 없는 부모 디렉터리에서 새 일반 파일을 0666으로 요청한 가상 계산이다. 숫자 크기와 쓰기 비트 차단은 별도 비교다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">umask 0022</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 0666 → 0644</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹·기타 쓰기 차단</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">umask 0031</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 0666 → 0646</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">기타 쓰기 비트 남음</text></g></svg>
