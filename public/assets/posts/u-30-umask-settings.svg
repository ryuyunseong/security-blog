<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">UMASK 0022와 0031의 일반 파일 생성 권한</title><desc id="desc">0646의 마지막 6에는 기타 사용자 쓰기 2가 포함돼요. 숫자 크기 비교만으로 이 비트를 알아낼 수 없어요. 기본 ACL이 없는 부모 디렉터리에서 새 일반 파일을 0666으로 요청한 가상 계산이에요. 숫자 크기와 쓰기 비트 차단은 별도 비교예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">umask 0022</text><text x="66" y="235" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 0666 → 0644</text><text x="66" y="265" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹·기타 쓰기 차단</text><g data-illustration="permission-bits" data-mode="0644"><text x="128" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="70" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="88" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="110" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="128" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="150" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="168" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="252" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="194" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="212" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="234" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="252" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="274" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="292" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="376" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">기타</text><rect x="318" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="336" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="358" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="376" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="398" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="416" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text></g><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">umask 0031</text><text x="522" y="235" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">요청 0666 → 0646</text><text x="522" y="265" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">기타 쓰기 비트 남음</text><g data-illustration="permission-bits" data-mode="0646"><text x="584" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="526" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="544" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</te