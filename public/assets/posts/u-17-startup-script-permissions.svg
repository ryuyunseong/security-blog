<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 146 960 266" data-diagram-kind="flow" role="img" aria-labelledby="title desc"><title id="title">시작 항목에서 수정 가능한 파일까지 추적하기</title><desc id="desc">화살표는 변경 권한을 조사하는 순서다. 실제 서비스가 실행되는 순서를 나타내지는 않는다. 파일 변경 권한을 조사하는 순서이며 서비스 실행 순서가 아니다. 실습의 경로는 모두 가상 자료다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="146" width="960" height="266" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">시작 항목</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">init·systemd 경로</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">적용 파일부터 수집</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">실제 대상</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">링크 목적지 추적</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">소유자·모드 대조</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700" text-anchor="start">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">수정 권한</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">일반 계정 쓰기</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹·ACL도 검토</text></g></svg>
