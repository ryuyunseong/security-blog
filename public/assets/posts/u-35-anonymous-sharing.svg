<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" data-diagram-kind="compare" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">주석 한 줄과 활성 설정 한 줄의 차이</title><desc id="desc">#으로 시작하는 주석은 활성 항목 수에 포함하지 않아요. 두 패널은 별개의 입력이며 실행 순서를 나타내지 않아요. 가상 JSON의 설정 문자열을 비교한다. 실제 FTP 로그인이나 전체 서비스 판정이 아니며 기본값과 반영 상태는 따로 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="448" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="448" height="343" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">commented</tspan></text><text x="32" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">문자열 1행 (# 주석)</tspan></text><text x="32" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">anonymous_enable=NO</tspan></text><text x="32" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">활성 대상 항목</tspan></text><text x="32" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">0개</tspan></text><text x="32" y="296" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">출력 상태</tspan></text><text x="32" y="327" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">보류</tspan></text></g><g data-panel="file"><rect x="496" y="16" width="448" height="416" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M512 32h23l9 9v32H512Z M535 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="512" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">explicit-off</tspan></text><text x="512" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">문자열 1행 (# 주석)</tspan></text><text x="512" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">anonymous_enable=YES</tspan></text><text x="512" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">문자열 2행</tspan></text><text x="512" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">anonymous_enable=NO</tspan></text><text x="512" y="296" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">활성 대상 항목</tspan></text><text x="512" y="327" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">1개</tspan></text><text x="512" y="369" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">출력 상태</tspan></text><text x="512" y="400" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">명시적 제한값</tspan></text></g></g></svg>
