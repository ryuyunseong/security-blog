<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" data-diagram-kind="flow" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">가상 short의 두 행을 세 서비스 이름에 맞춰 놓은 결과</title><desc id="desc">no-row는 받은 자료의 빈자리를 표시해요. 실제로 서비스가 꺼졌다는 관찰은 inactive로 적어요. tftp는 비활성 기록이 있고 ntalk는 조회 오류이며 talk에 해당하는 행은 없어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="292" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="table"><rect x="16" y="16" width="448" height="216" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">short · 받은 두 행</tspan></text><rect x="28" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="36" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="36" dy="0">이름</tspan></text><path d="M240 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="248" dy="0">수집값</tspan></text><rect x="28" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">tftp</tspan></text><path d="M240 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">inactive</tspan></text><rect x="28" y="170" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="36" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="36" dy="0">ntalk</tspan></text><path d="M240 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="248" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="248" dy="0">query-error</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">세 이름에 맞춘 결과</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">이름</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">출력값</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">tftp</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">inactive</tspan></text><rect x="508" y="170" width="424" height="44" rx="0" fill="#d5e8dc" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">talk</tspan></text><path d="M720 170v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">no-row</tspan></text><rect x="508" y="214" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">ntalk</tspan></text><path d="M720 214v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="242" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">query-error</tspan></text></g><path d="M467 124H480V146H490" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
