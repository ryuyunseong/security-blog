<svg xmlns="http://www.w3.org/2000/svg" width="360" height="839" viewBox="0 0 360 839" data-diagram-kind="matrix" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">CORS·인증·인가는 서로 다른 질문이다</title><desc id="desc">Origin, 사용자 신원, 문서 소유권은 다른 자료예요. CORS 허용이 bob에게 alice 문서의 읽기 권한을 주지는 않아요. CORS 허용 헤더가 있어도 사용자 권한이 없으면 자료를 거부해야 해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="839" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">브라우저의 출처</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Origin 문자열</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">https://app.example</tspan></text><text x="32" y="186" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">CORS의 역할</tspan></text><text x="32" y="219" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">응답 공개 여부</tspan></text></g><g data-panel="actor"><rect x="16" y="276" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="50" cy="302" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 334v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="314" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">검증된 사용자</tspan></text><text x="32" y="370" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 신원</tspan></text><text x="32" y="403" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">alice / bob</tspan></text><text x="32" y="446" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증의 역할</tspan></text><text x="32" y="479" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">요청자 신원</tspan></text></g><g data-panel="file"><rect x="16" y="536" width="328" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 552h23l9 9v32H32Z M55 552v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="628" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 문서</tspan></text><text x="32" y="673" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">소유자</tspan></text><text x="32" y="706" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">alice</tspan></text><text x="32" y="749" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인가의 역할</tspan></text><text x="32" y="782" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이 문서의 읽기 허용</tspan></text></g></g></svg>
