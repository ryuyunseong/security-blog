<svg xmlns="http://www.w3.org/2000/svg" width="360" height="673" viewBox="0 0 360 673" data-diagram-kind="matrix" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">CORS·인증·인가는 서로 다른 질문이다</title><desc id="desc">CORS는 브라우저의 응답 공개, 인증은 신원, 인가는 사용자별 접근 권한을 다룬다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="673" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">CORS·인증·인가는 서로 다른</tspan><tspan x="16" dy="31">질문이다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">CORS</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">어느 웹 출처인가</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">브라우저의 응답 공개</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">인증</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청자는 누구인가</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">검증된 사용자 신원</tspan></text><rect x="16" y="398" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="436" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">인가</tspan></text><text x="32" y="471" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">이 자료를 읽어도 되나</tspan></text><text x="32" y="505" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">사용자별 접근 정책</tspan></text><path d="M16 553H344" stroke="#cadbd1"/><text x="16" y="589" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">CORS 허용 헤더가 있어도 사용자</tspan><tspan x="16" dy="28">권한이 없으면 자료를 거부해야</tspan><tspan x="16" dy="28">한다.</tspan></text></g></svg>
