<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1038" viewBox="0 0 360 1038" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">같은 호스트·스캔에서 두 QID가 함께 보인다고 가정한 해석 예예요. 로그인 성공과 모든 파일 접근 성공을 구분해요. 인증 성공을 전체 취약점 검사의 완료나 안전 판정으로 해석하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="1038" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="256" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="45" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 45h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">Windows 로그인 성공</tspan><tspan x="86" dy="31">예</tspan></text><text x="32" y="130" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 상태</tspan></text><text x="32" y="163" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Passed</tspan></text><text x="32" y="206" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 성공 QID</tspan></text><text x="32" y="239" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">70053</tspan></text></g><g data-panel="file"><rect x="16" y="320" width="328" height="310" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 336h23l9 9v32H32Z M55 336v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="412" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">같은 스캔의 파일 접근</tspan></text><text x="32" y="457" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">일부 파일 읽기 거부 QID</tspan></text><text x="32" y="490" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">90399</tspan></text><text x="32" y="533" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">읽지 못한 파일</tspan></text><text x="32" y="566" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">해당 QID의 Results에</tspan><tspan x="32" dy="31">표시</tspan></text></g><g data-panel="actor"><rect x="16" y="678" width="328" height="312" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="715" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 705l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="716" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">남은 평가 근거 조사</tspan></text><text x="32" y="772" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">로그인</tspan></text><text x="32" y="805" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">성공</tspan></text><text x="32" y="848" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">파일 접근</tspan></text><text x="32" y="881" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">일부 거부</tspan></text><text x="32" y="924" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 조사</tspan></text><text x="32" y="957" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">빠진 파일과 관련 검사 근거</tspan></text></g><path d="M180 277V312" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 635V670" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
