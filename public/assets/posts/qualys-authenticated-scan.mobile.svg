<svg xmlns="http://www.w3.org/2000/svg" width="360" height="726" viewBox="0 0 360 726" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">Passed에서 곧바로 전체 검사 성공으로 건너뛰지 않도록 접근할 자료와 평가 근거를 사이에 뒀어요. 제품 실행 결과를 재현한 화면은 아니에요. 인증 성공을 전체 취약점 검사의 완료나 안전 판정으로 해석하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="726" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="42" cy="45" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 45h22v8m-10-8v8" stroke="#7eaa93" stroke-width="3" fill="none"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">로그인 단계</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">인증 보고서</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">Passed</tspan></text></g><g data-panel="file"><rect x="16" y="224" width="328" height="203" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 240h23l9 9v32H32Z M55 240v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="316" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">파일 · 레지스트리</tspan></text><text x="32" y="361" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 조건</tspan></text><text x="32" y="394" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">실제로 읽을 권한</tspan></text></g><g data-panel="file"><rect x="16" y="475" width="328" height="203" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 491h23l9 9v32H32Z M55 491v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="567" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">취약점 평가 근거</tspan></text><text x="32" y="612" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">해석할 자료</tspan></text><text x="32" y="645" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">실행된 검사 · 평가 시점</tspan></text></g><path d="M180 181V216" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 432V467" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
