<svg xmlns="http://www.w3.org/2000/svg" width="360" height="713" viewBox="0 0 360 713" data-diagram-kind="flow" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">인증 성공 뒤에도 검사 범위를 확인한다</title><desc id="desc">인증 보고서의 상태에서 접근 거부 QID로 조사 범위를 좁히고 취약점 결과와 대조한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="713" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">인증 성공 뒤에도 검사 범위를</tspan><tspan x="16" dy="31">확인한다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">로그인</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">인증 보고서 Passed</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">접속 성공 확인</tspan></text><path d="M180 240v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="271" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="309" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">접근 가능한 범위</tspan></text><text x="32" y="344" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">파일 · 레지스트리 등</tspan></text><text x="32" y="378" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실제 읽기 권한 확인</tspan></text><path d="M180 407v22" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="438" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="476" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">취약점 평가</tspan></text><text x="32" y="511" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">탐지 근거와 검사 시점</tspan></text><text x="32" y="545" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실행된 검사 범위 확인</tspan></text><path d="M16 593H344" stroke="#cadbd1"/><text x="16" y="629" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">인증 성공을 전체 취약점 검사의</tspan><tspan x="16" dy="28">완료나 안전 판정으로 해석하지</tspan><tspan x="16" dy="28">않는다.</tspan></text></g></svg>
