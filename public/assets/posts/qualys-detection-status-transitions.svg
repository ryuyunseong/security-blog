<svg xmlns="http://www.w3.org/2000/svg" width="960" height="573" viewBox="0 0 960 573" data-diagram-kind="cycle" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">수정과 재탐지 사이의 상태 전이</title><desc id="desc">상태 사이의 선은 새 검사 결과에 따른 전이를 뜻해요. 조치 완료 보고와 Fixed 판정은 같은 사건이 아니에요. 동일한 자산과 탐지 항목을 비교하는 흐름이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="573" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="states"><rect x="16" y="16" width="928" height="541" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">검사 결과에 따른 탐지 상태</tspan></text><rect x="62" y="79" width="836" height="59" rx="29.5" fill="#e6f0e9" stroke="#cadbd1"/><text x="480" y="113" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="480" dy="0">New</tspan></text><text x="68" y="168" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="68" dy="0">다음 검사에서도 탐지</tspan></text><rect x="62" y="196" width="836" height="59" rx="29.5" fill="#e6f0e9" stroke="#cadbd1"/><text x="480" y="230" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="480" dy="0">Active</tspan></text><text x="68" y="285" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="68" dy="0">새 검사로 수정 검증</tspan></text><rect x="62" y="313" width="836" height="59" rx="29.5" fill="#e6f0e9" stroke="#cadbd1"/><text x="480" y="347" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="480" dy="0">Fixed</tspan></text><text x="68" y="402" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="68" dy="0">수정 뒤 다시 탐지</tspan></text><rect x="62" y="430" width="836" height="59" rx="29.5" fill="#e6f0e9" stroke="#cadbd1"/><text x="480" y="464" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="480" dy="0">Re-Opened</tspan></text><text x="68" y="519" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="68" dy="0">다음 검사에서도 탐지</tspan></text><path d="M62 108.5H26V225.5H56" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M62 225.5H36V342.5H56" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M62 342.5H46V459.5H56" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M62 459.5H26V225.5H56" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></g></svg>
