<svg xmlns="http://www.w3.org/2000/svg" width="960" height="771" viewBox="0 0 960 771" data-diagram-kind="cycle" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">수정과 재탐지 사이의 상태 전이</title><desc id="desc">각 줄은 다음 검사 결과에 따라 이전 상태가 바뀌는 경로예요. 같은 상태가 유지되는 경로는 생략했어요. 동일한 자산과 탐지 항목을 비교하는 흐름이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="771" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="states"><rect x="16" y="16" width="928" height="739" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">재검사 결과에 따른 주요 상태 변경</tspan></text><rect x="32" y="79" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="490" y="79" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="251" y="111" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="251" dy="0">New</tspan></text><text x="709" y="111" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="709" dy="0">Active</tspan></text><path d="M472 104.5H487" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="158" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 검사에서도 탐지</tspan></text><rect x="32" y="190" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="490" y="190" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="251" y="222" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="251" dy="0">New</tspan></text><text x="709" y="222" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="709" dy="0">Fixed</tspan></text><path d="M472 215.5H487" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="269" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">다음 검사에서 더 이상 탐지되지 않음</tspan></text><rect x="32" y="301" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="490" y="301" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="251" y="333" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="251" dy="0">Active</tspan></text><text x="709" y="333" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="709" dy="0">Fixed</tspan></text><path d="M472 326.5H487" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="380" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">새 검사로 수정 검증</tspan></text><rect x="32" y="412" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="490" y="412" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="251" y="444" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="251" dy="0">Fixed</tspan></text><text x="709" y="444" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="709" dy="0">Re-Opened</tspan></text><path d="M472 437.5H487" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="491" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수정 뒤 다시 탐지</tspan></text><rect x="32" y="523" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><rect x="490" y="523" width="438" height="51" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="251" y="555" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="