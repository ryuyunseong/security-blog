<svg xmlns="http://www.w3.org/2000/svg" width="960" height="333" viewBox="0 119 960 333" data-diagram-kind="cycle" role="img" aria-labelledby="title desc"><title id="title">수정과 재탐지 사이의 상태 전이</title><desc id="desc">화살표는 조건에 맞는 새 결과를 처리했을 때의 전이다. 재탐지 후에도 계속 탐지되면 Active이며, 자료가 없는 회차는 상태 변경 근거에서 뺀다. 동일한 자산과 탐지 항목을 비교하는 흐름이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="119" width="960" height="333" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M600 214Q744 218 744 298" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 377H347" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M215 308Q211 211 350 211" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="143" width="240" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="382" y="177" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">탐지</text><text x="382" y="210" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">New·Active</text><text x="382" y="239" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">스캔 결과 처리</text><rect x="620" y="308" width="250" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="642" y="342" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">수정 검증</text><text x="642" y="375" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">Fixed</text><text x="642" y="404" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">새 검사로 검증</text><rect x="90" y="308" width="250" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="112" y="342" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">재탐지</text><text x="112" y="375" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">Re-Opened</text><text x="112" y="404" font-size="16" fill="#536b60" font-weight="400" text-anchor="start">연속 탐지→Active</text></g></svg>
