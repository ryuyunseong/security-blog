<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">CORS·인증·인가는 서로 다른 질문이다</title><desc id="desc">세 상자는 요청의 고정 처리 순서가 아니라 서로 다른 역할을 나타낸다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">CORS·인증·인가는 서로 다른 질문이다</text><rect x="44" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="205" font-size="16" fill="#287056" font-weight="700">01</text><text x="66" y="247" font-size="25" fill="#193e2f" font-weight="700">CORS</text><text x="66" y="289" font-size="19" fill="#536b60" font-weight="400">어느 웹 출처인가</text><text x="66" y="320" font-size="19" fill="#536b60" font-weight="400">브라우저의 응답 공개</text><path d="M324 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="345" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="367" y="205" font-size="16" fill="#287056" font-weight="700">02</text><text x="367" y="247" font-size="25" fill="#193e2f" font-weight="700">인증</text><text x="367" y="289" font-size="19" fill="#536b60" font-weight="400">요청자는 누구인가</text><text x="367" y="320" font-size="19" fill="#536b60" font-weight="400">검증된 사용자 신원</text><path d="M625 279h12m-5-5 5 5-5 5" stroke="#7eaa93" stroke-width="2" fill="none"/><rect x="646" y="170" width="270" height="218" rx="12" fill="#fff" stroke="#cadbd1"/><text x="668" y="205" font-size="16" fill="#287056" font-weight="700">03</text><text x="668" y="247" font-size="25" fill="#193e2f" font-weight="700">인가</text><text x="668" y="289" font-size="19" fill="#536b60" font-weight="400">이 자료를 읽어도 되나</text><text x="668" y="320" font-size="19" fill="#536b60" font-weight="400">사용자별 접근 정책</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">CORS 허용 헤더가 있어도 사용자 권한이 없으면 자료를 거부해야 한다.</text></g></svg>
