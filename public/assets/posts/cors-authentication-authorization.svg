<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">CORS·인증·인가는 서로 다른 질문이다</title><desc id="desc">CORS는 브라우저의 응답 공개, 인증은 신원, 인가는 사용자별 접근 권한을 다룬다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">CORS·인증·인가는 서로 다른 질문이다</text><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">CORS</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">어느 웹 출처인가</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">브라우저의 응답 공개</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">인증</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">요청자는 누구인가</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">검증된 사용자 신원</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">인가</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">이 자료를 읽어도 되나</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">사용자별 접근 정책</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">CORS 허용 헤더가 있어도 사용자 권한이 없으면 자료를 거부해야 한다.</text></g></svg>
