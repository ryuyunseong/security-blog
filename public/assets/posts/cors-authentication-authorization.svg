<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">CORS·인증·인가는 서로 다른 질문이다</title><desc id="desc">Origin, 사용자 신원, 문서 소유권은 다른 자료예요. CORS 허용이 bob에게 alice 문서의 읽기 권한을 주지는 않아요. CORS 허용 헤더가 있어도 사용자 권한이 없으면 자료를 거부해야 해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="302" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">브라우저의 출처</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Origin 문자열</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">https://app.example</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">CORS의 역할</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">응답 공개 여부</tspan></text></g><g data-panel="actor"><rect x="336" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="370" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M352 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="406" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="406" dy="0">검증된 사용자</tspan></text><text x="352" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">가상 신원</tspan></text><text x="352" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">alice / bob</tspan></text><text x="352" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">인증의 역할</tspan></text><text x="352" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">요청자 신원</tspan></text></g><g data-panel="file"><rect x="656" y="16" width="288" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M672 32h23l9 9v32H672Z M695 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="672" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">가상 문서</tspan></text><text x="672" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">소유자</tspan></text><text x="672" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">alice</tspan></text><text x="672" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">인가의 역할</tspan></text><text x="672" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">이 문서의 읽기 허용</tspan></text></g></g></svg>
