<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">0400과 0600의 소유자 쓰기 비트 비교</title><desc id="desc">모드와 추가 비트는 모두 8진수이며, 두 경우 모두 UID 0이라고 가정했다. UID 0의 가상 일반 권한이며 실제 인증 파일을 조회하거나 변경하지 않았다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">0400</text><text x="66" y="235" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">소유자 읽기</text><text x="66" y="265" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">허용 밖 비트 000</text><g data-illustration="permission-bits" data-mode="0400"><text x="128" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="70" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="88" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="110" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="128" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><rect x="150" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="168" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="252" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="194" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="212" y="336" font-size="22" fill="#193e2f" fo