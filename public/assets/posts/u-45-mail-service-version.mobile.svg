<svg xmlns="http://www.w3.org/2000/svg" width="360" height="792" viewBox="0 0 360 792" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 설치 버전을 두 공급 경로의 기준과 대조한 결과</title><desc id="desc">각 화살표는 한 입력 행이 참조한 공급 경로를 가리켜요. match와 different는 해당 기준값과의 비교 결과예요. 가상 입력 두 줄의 설치값은 1.0-2예요. 각 행의 공급 경로가 참조하는 기준이 달라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="792" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 32h23l9 9v32H52Z M75 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">같은 설치 기록</tspan></text><text x="52" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">설치 버전</tspan></text><text x="52" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">1.0-2</tspan></text></g><g data-panel="actor"><rect x="36" y="224" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 247v29c0 10 36 10 36 0V247" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><ellipse cx="70" cy="247" rx="18" ry="7" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">lab-a</tspan></text><text x="52" y="318" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">기준</tspan></text><text x="52" y="351" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" d