<svg xmlns="http://www.w3.org/2000/svg" width="360" height="926" viewBox="0 0 360 926" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">서비스 이름표를 조회하는 순서</title><desc id="desc">같은 domain 이름에서 udp 행을 고르는 과정이에요. 등록 포트 53을 얻은 것이 해당 소켓의 열림을 검사한 결과는 아니에요. 가상 파일의 조회 순서예요. 별칭도 해당 행의 번호·프로토콜로 조회하며 실제 소켓 상태는 수집하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="926" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="split"><rect x="16" y="16" width="328" height="189" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">조회 키</tspan></text><rect x="32" y="79" width="148" height="100" rx="0" fill="#fff" stroke="#cadbd1"/><text x="106" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="106" dy="0">이름</tspan></text><text x="106" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="106" dy="0">domain</tspan></text><rect x="180" y="79" width="148" height="100" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="254" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="254" dy="0">프로토콜</tspan></text><text x="254" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="254" dy="0">udp</tspan></text></g><g data-panel="table"><rect x="16" y="253" width="328" height="341" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="291" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 services 자료</tspan></text><rect x="28" y="316" width="304" height="120" rx="10" fill="#fff" stroke="#cadbd1"/><text x="40" y="348" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">이름: domain</tspan></text><text x="40" y="382" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">프로토콜: tcp</tspan></text><text x="40" y="415" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">포트: 53</tspan></text><rect x="28" y="446" width="304" height="120" rx="10" fill="#d5e8dc" stroke="#cadbd1"/><text x="40" y="478" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="40" dy="0">이름: domain</tspan></text><text x="40" y="512" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">프로토콜: udp</tspan></text><text x="40" y="545" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="40" dy="0">포트: 53</tspan></text></g><g data-panel="actor"><rect x="16" y="642" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="679" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 669l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="680" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">반환할 등록값</tspan></text><text x="32" y="736" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">포트</tspan></text><text x="32" y="769" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">53</tspan></text><text x="32" y="812" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">범위</tspan></text><text x="32" y="845" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">서비스 이름표 조회</tspan></text></g><path d="M180 210V245" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 599V634" fill="none