<svg xmlns="http://www.w3.org/2000/svg" width="360" height="473" viewBox="0 0 360 473" data-diagram-kind="matrix" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">서비스 사용 상태와 U-27 비교 범위</title><desc id="desc">미수집 행을 미사용 행에 합치지 않는다. 두 상태는 판단에 쓸 수 있는 자료가 다르다. 가상 입력의 사용·미사용·미수집을 나눈다. 사용 시 소유자, 600 이하 권한, 플러스 설정 없음을 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="473" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">사용</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">파일의 세 조건 비교</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실제 인증 구성도 조사</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">미사용</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">파일 조건 비교 생략</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">실제 미사용의 근거 필요</tspan></text><rect x="16" y="310" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="348" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">미수집</tspan></text><text x="32" y="383" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">서비스 사용 상태 불명</tspan></text><text x="32" y="417" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">추가 조사로 유지</tspan></text></g></svg>
