<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">서비스 사용 상태와 U-27 비교 범위</title><desc id="desc">파일 자료와 서비스 사용 상태는 서로 다른 입력이에요. 미사용이 입증되면 파일 비교를 생략할 수 있지만 미수집은 보류로 남겨요. 가상 입력의 사용·미사용·미수집을 나눠요. 사용 시 소유자, 600 이하 권한, 플러스 설정 없음을 비교해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="286" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="448" height="254" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">.rhosts · hosts.equiv</tspan></text><rect x="28" y="127" width="424" height="45" rx="10" fill="#d5e8dc" stroke="#cadbd1"/><text x="32" y="152" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">자료 있음</tspan></text><text x="32" y="207" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">서비스 사용이 입증된 경우</tspan></text><text x="32" y="238" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">소유자 · 권한 · 내용 비교</tspan></text></g><g data-panel="file"><rect x="496" y="16" width="448" height="254" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M512 32h23l9 9v32H512Z M535 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><circle cx="529" cy="53" r="17" fill="#f8e9b8" stroke="#956c30"/><text x="529" y="61" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="529" dy="0">?</tspan></text><text x="512" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">서비스 사용 상태 자료</tspan></text><rect x="508" y="127" width="424" height="45" rx="10" fill="#f8e9b8" stroke="#cadbd1"/><text x="512" y="152" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">미수집</tspan></text><text x="512" y="207" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">사용 상태를 모르는 경우</tspan></text><text x="512" y="238" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">미사용으로 간주하지 않음</tspan></text></g></g></svg>
