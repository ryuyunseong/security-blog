<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 120 960 340" data-diagram-kind="matrix" role="img" aria-labelledby="title desc"><title id="title">서비스 사용 상태와 U-27 비교 범위</title><desc id="desc">미수집 행을 미사용 행에 합치지 않는다. 두 상태는 판단에 쓸 수 있는 자료가 다르다. 가상 입력의 사용·미사용·미수집을 나눈다. 사용 시 소유자, 600 이하 권한, 플러스 설정 없음을 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="120" width="960" height="340" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="144" width="872" height="292" rx="12" fill="#fff" stroke="#cadbd1"/><path d="M44 190H916 M44 272H916 M44 354H916 M272 144V436 M576 144V436" stroke="#cadbd1"/><text x="66" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">항목</text><text x="294" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">동작·조건</text><text x="598" y="175" font-size="18" fill="#287056" font-weight="700" text-anchor="start">의미·확인 대상</text><text x="66" y="240" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">사용</text><text x="294" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">파일의 세 조건 비교</text><text x="598" y="240" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">실제 인증 구성도 조사</text><text x="66" y="322" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">미사용</text><text x="294" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">파일 조건 비교 생략</text><text x="598" y="322" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">실제 미사용의 근거 필요</text><text x="66" y="404" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">미수집</text><text x="294" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">서비스 사용 상태 불명</text><text x="598" y="404" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">추가 조사로 유지</text></g></svg>
