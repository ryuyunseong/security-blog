<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" data-diagram-kind="matrix" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">서비스 사용 상태와 U-27 비교 범위</title><desc id="desc">파일 자료와 서비스 사용 근거를 함께 읽어요. 미수집 상태는 서비스 미사용이나 양호 판정으로 바꾸지 않아요. 가상 입력의 사용·미사용·미수집을 나눠요. 사용 시 소유자, 600 이하 권한, 플러스 설정 없음을 비교해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="348" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="448" height="197" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">.rhosts · hosts.equiv</tspan></text><text x="32" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">파일 자료</tspan></text><text x="32" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">소유자 · 권한 · 내용</tspan></text></g><g data-panel="table"><rect x="496" y="16" width="448" height="316" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">서비스 사용 근거별 처리</tspan></text><rect x="508" y="79" width="424" height="47" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="516" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="516" dy="0">사용 상태 근거</tspan></text><path d="M720 79v47" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="109" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="728" dy="0">처리</tspan></text><rect x="508" y="126" width="424" height="44" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">불필요함을 확인</tspan></text><path d="M720 126v44" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="154" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">파일 제거 여부 검토</tspan></text><rect x="508" y="170" width="424" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">불가피한 사용 확인</tspan></text><path d="M720 170v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="198" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">소유자·권한·내용</tspan><tspan x="728" dy="28">비교</tspan></text><rect x="508" y="242" width="424" height="72" rx="0" fill="#fff" stroke="#cadbd1"/><text x="516" y="270" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="516" dy="0">사용 여부 미수집</tspan></text><path d="M720 242v72" fill="none" stroke="#7eaa93" stroke-width="2"/><text x="728" y="270" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="728" dy="0">미사용으로 바꾸지</tspan><tspan x="728" dy="28">않고 보류</tspan></text></g></g></svg>
