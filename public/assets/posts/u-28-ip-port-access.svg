<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">가상 접근표의 첫 두 규칙 순서 비교</title><desc id="desc">두 경우 모두 출발지 192.0.2.13의 같은 요청이다. /32와 /25 사이 화살표는 검사 순서이며 첫 일치 뒤에는 멈춘다. 첫 일치에서 반환하는 가상 모형이다. 단일 주소 거부와 넓은 주소 범위 허용의 순서를 바꿔 같은 요청을 비교했다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">01</text><text x="66" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">거부 우선</text><text x="66" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">거부 /32 → 허용 /25</text><text x="66" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">TCP 22: 가상 거부</text><rect x="500" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="522" y="199" font-size="16" fill="#287056" font-weight="700" text-anchor="start">02</text><text x="522" y="241" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">허용 우선</text><text x="522" y="283" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">허용 /25 → 거부 /32</text><text x="522" y="314" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">TCP 22: 가상 허용</text></g></svg>
