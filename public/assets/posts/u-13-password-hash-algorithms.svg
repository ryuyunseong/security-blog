<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" data-diagram-kind="decision" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">저장된 비밀번호 형식을 분류하기</title><desc id="desc">잠금 표지와 해시 형식을 분리해서 읽는 예시예요. 정책 변수의 SHA512를 바꿔도 저장된 가상 필드가 자동으로 바뀌지는 않아요. 형식 분류와 계정의 최종 점검 판정은 구분해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="302" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="split"><rect x="16" y="16" width="448" height="262" rx="10" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">가상 필드 !$1$salt$DEMO</tspan></text><rect x="32" y="79" width="208" height="100" rx="0" fill="#fff" stroke="#cadbd1"/><text x="136" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="136" dy="0">잠금 표지</tspan></text><text x="136" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="136" dy="0">!</tspan></text><rect x="240" y="79" width="208" height="100" rx="0" fill="#e6f0e9" stroke="#cadbd1"/><text x="344" y="109" font-size="20" fill="#536b60" font-weight="400" text-anchor="middle"><tspan x="344" dy="0">형식 접두부</tspan></text><text x="344" y="157" font-size="26" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="344" dy="0">$1$</tspan></text><text x="32" y="215" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">형식 분류</tspan></text><text x="32" y="246" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">MD5-crypt</tspan></text></g><g data-panel="file"><rect x="496" y="16" width="448" height="270" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M512 32h23l9 9v32H512Z M535 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="512" y="106" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">새 비밀번호 정책</tspan></text><text x="512" y="150" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">가정한 정책</tspan></text><text x="512" y="181" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">SHA512</tspan></text><text x="512" y="223" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="512" dy="0">기존 가상 문자열</tspan></text><text x="512" y="254" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">변경 없음</tspan></text></g></g></svg>
