<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 108 960 370" data-diagram-kind="decision" role="img" aria-labelledby="title desc"><title id="title">저장된 비밀번호 형식을 분류하기</title><desc id="desc">분기는 저장 형식을 읽는 방법을 고른다. 화살표가 양호·취약 판정이나 비밀번호 변경을 뜻하지는 않는다. 형식 분류와 계정의 최종 점검 판정은 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="108" width="960" height="370" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><path d="M480 140L650 220L480 300L310 220Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="480" y="214" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle">$번호$ 형식인가</text><text x="480" y="244" font-size="17" fill="#536b60" font-weight="400" text-anchor="middle">잠금 접두부 분리</text><text x="480" y="132" font-size="16" fill="#536b60" font-weight="400" text-anchor="middle">저장값의 형식 조회</text><path d="M310 220H240V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 220H720V329" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="254" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">예</text><text x="734" y="295" font-size="19" fill="#287056" font-weight="700" text-anchor="start">아니요</text><rect x="44" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">알고리즘 조회</text><text x="66" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">$1$·$5$·$6$</text><text x="66" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">새 비밀번호 정책과 대조</text><rect x="524" y="338" width="392" height="116" rx="12" fill="#fff" stroke="#cadbd1"/><text x="546" y="372" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">기타 필드</text><text x="546" y="405" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">대상 OS 형식</text><text x="546" y="434" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">빈값·잠금·AIX 등 구분</text></g></svg>
