<svg xmlns="http://www.w3.org/2000/svg" width="360" height="749" viewBox="0 0 360 749" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">승인 목록과 계정의 실제 용도를 대조한다</title><desc id="desc">담당자와 계정 용도를 확인한 뒤 서비스·예약 작업·소유 파일을 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="749" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">승인 목록과 계정의 실제 용도를</tspan><tspan x="16" dy="31">대조한다</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">승인 목록에 있나</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">로컬·중앙 계정 구분</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">계정별 검토</tspan></text><text x="60" y="277" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="289" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="327" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">사용 목적 대조</tspan></text><text x="76" y="362" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">담당자·서비스·배치 작업</tspan></text><text x="76" y="396" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">등록된 계정도 용도 검토</tspan></text><text x="60" y="462" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="474" width="284" height="159" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="512" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">목록 차이 조사</tspan></text><text x="76" y="547" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">누락·계약 종료 여부</tspan></text><text x="76" y="581" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">자동 삭제 목록으로 쓰지</tspan><tspan x="76" dy="28">않음</tspan></text><path d="M180 235v18H26V502" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 317H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 502H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M16 657H344" stroke="#cadbd1"/><text x="16" y="693" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">승인 목록에서 빠진 계정은 담당자와</tspan><tspan x="16" dy="28">용도를 확인한 뒤 처리한다.</tspan></text></g></svg>
