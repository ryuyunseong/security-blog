<svg xmlns="http://www.w3.org/2000/svg" width="360" height="868" viewBox="0 0 360 868" data-diagram-kind="decision" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">홈 경로의 수집 상태 비교</title><desc id="desc">그림은 가상 수집 상태의 차이를 보여 줘요. 경로 부재가 기록된 자료와 수집하지 못한 자료를 같은 칸에 넣지 않아요. 실제 경로의 종류·부재를 알 수 있는 자료와 조회 오류·미수집을 구분해요. 실습은 임시 경로를 직접 조회하며 두 미확정 상태는 가상 입력이에요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="868" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 40v28h38V40H52l-8-8H32v8Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대상 홈 경로</tspan></text><rect x="28" y="130" width="304" height="45" rx="10" fill="#d5e8dc" stroke="#cadbd1"/><text x="32" y="155" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">자료 있음</tspan></text><text x="32" y="210" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 결과</tspan></text><text x="32" y="243" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">디렉터리</tspan></text></g><g data-panel="file"><rect x="16" y="300" width="328" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 324v28h38V324H52l-8-8H32v8Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M32 318l34 34m0-34-34 34" stroke="#956c30" stroke-width="3"/><text x="32" y="392" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대상 홈 경로</tspan></text><rect x="28" y="414" width="304" height="45" rx="10" fill="#f8e9b8" stroke="#cadbd1"/><text x="32" y="439" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">부재 근거</tspan></text><text x="32" y="494" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 결과</tspan></text><text x="32" y="527" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">경로 부재</tspan></text></g><g data-panel="file"><rect x="16" y="584" width="328" height="260" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 608v28h38V608H52l-8-8H32v8Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><circle cx="49" cy="621" r="17" fill="#f8e9b8" stroke="#956c30"/><text x="49" y="629" font-size="24" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="49" dy="0">?</tspan></text><text x="32" y="676" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대상 홈 경로</tspan></text><rect x="28" y="698" width="304" height="45" rx="10" fill="#f8e9b8" stroke="#cadbd1"/><text x="32" y="723" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">미수집</tspan></text><text x="32" y="778" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">조회 오류도 별도 보류</tspan></text><text x="32" y="811" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">부재로 바꾸지 않음</tspan></text></g></g></svg>
