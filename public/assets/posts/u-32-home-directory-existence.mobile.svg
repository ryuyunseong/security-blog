<svg xmlns="http://www.w3.org/2000/svg" width="360" height="549" viewBox="0 0 360 549" data-diagram-kind="decision" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">홈 경로 조회 자료의 유무에 따른 조사 분기</title><desc id="desc">계정의 홈 필드와 같은 경로·시점의 자료를 사용한다. 이 분기는 로그인 성공 여부를 뜻하지 않는다. 실제 경로의 종류·부재를 알 수 있는 자료와 조회 오류·미수집을 구분한다. 실습은 임시 경로를 직접 조회하며 두 미확정 상태는 가상 입력이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">판별 자료가 있는가?</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">대상 경로와 수집 시점</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">조회 오류·미수집 구분</tspan></text><text x="60" y="189" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">예</tspan></text><rect x="60" y="201" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="239" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">경로 결과 대조</tspan></text><text x="76" y="274" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">디렉터리 / 부재</tspan></text><text x="76" y="308" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">다른 종류도 분리</tspan></text><text x="60" y="374" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="60" dy="0">아니요</tspan></text><rect x="60" y="386" width="284" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="76" y="424" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="76" dy="0">보류</tspan></text><text x="76" y="459" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">조회 실패 또는 미수집</tspan></text><text x="76" y="493" font-size="20" fill="#536b60" font-weight="400"><tspan x="76" dy="0">부재·양호로 바꾸지 않음</tspan></text><path d="M180 147v18H26V414" fill="none" stroke="#7eaa93" stroke-width="2"/><path d="M26 229H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M26 414H54" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
