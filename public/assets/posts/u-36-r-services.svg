<svg xmlns="http://www.w3.org/2000/svg" width="960" height="335" viewBox="0 0 960 335" data-diagram-kind="layers" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">가상 inetd 파일의 서비스 이름과 서버 파일</title><desc id="desc">shell의 2행 주석은 1행의 활성 후보를 없애지 않아요. TCP 포트는 정해 둔 대응값이며 실제 네트워크 관찰값은 아니에요. 가상 파일의 세 서비스 행을 독립적으로 비교한다. 포트는 가이드의 대응값이며 실제 대기 포트 조회 결과가 아니다. rsync 5행은 별도 조사한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="335" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="288" height="303" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">shell → rsh</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">TCP 514</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">in.rshd</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가상 파일 1행</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">활성 행 후보</tspan></text><text x="32" y="256" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">같은 이름의 2행</tspan></text><text x="32" y="287" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">주석도 있음</tspan></text></g><g data-panel="actor"><rect x="336" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M352 32h23l9 9v32H352Z M375 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="406" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="406" dy="0">login → rlogin</tspan></text><text x="352" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">TCP 513</tspan></text><text x="352" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">in.rlogind</tspan></text><text x="352" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="352" dy="0">가상 파일 3행</tspan></text><text x="352" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="352" dy="0">주석 행만 있음</tspan></text></g><g data-panel="actor"><rect x="656" y="16" width="288" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M672 32h23l9 9v32H672Z M695 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="726" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="726" dy="0">exec → rexec</tspan></text><text x="672" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">TCP 512</tspan></text><text x="672" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">in.rexecd</tspan></text><text x="672" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="672" dy="0">가상 파일 4행</tspan></text><text x="672" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="672" dy="0">활성 행 후보</tspan></text></g></g></svg>
