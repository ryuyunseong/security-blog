<svg xmlns="http://www.w3.org/2000/svg" width="960" height="549" viewBox="0 0 960 549" data-diagram-kind="topology" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">연결선은 관리 통신과 대상 검사 경로를 구분해요. 플랫폼에 연결됐다는 사실만으로 대상까지 검사됐다고 볼 수는 없어요. 선은 플랫폼 통신을 나타내요. 센서에서 검사 대상까지의 접근 경로는 별도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="549" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="448" height="303" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">호스트 안의 Cloud Agent</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 위치</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">설치된 호스트 내부</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">플랫폼 연결</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">HTTPS 443</tspan></text><text x="32" y="256" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">평가 조건</tspan></text><text x="32" y="287" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">VM 활성화 · 평가 시점</tspan></text></g><g data-panel="attachments"><rect x="496" y="16" width="448" height="517" rx="10" fill="#fff" stroke="#cadbd1"/><text x="512" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="512" dy="0">스캐너의 두 통신 경로</tspan></text><rect x="520" y="189" width="170.24" height="140" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><rect x="587.12" y="201" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M595.12 213h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="605.12" y="273" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key"><tspan x="605.12" dy="0">Scanner</tspan><tspan x="605.12" dy="31">Appliance</tspan></text><rect x="724.48" y="79" width="203.51999999999998" height="226" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M747.48 125a10 10 0 0 1 0-20a14 14 0 0 1 27-2a11 11 0 0 1 3 22Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="786.48" y="113" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="786.48" dy="0">Qualys</tspan><tspan x="786.48" dy="31">플랫폼</tspan></text><text x="740.48" y="189" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="740.48" dy="0">HTTPS 443:</tspan><tspan x="740.48" dy="28">작업·업데이트</tspan><tspan x="740.48" dy="28">수신, 상태·결과</tspan><tspan x="740.48" dy="28">전송</tspan></text><path d="M690.24 259H704.36V192H718.48" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="724.48" y="329" width="203.51999999999998" height="170" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="740.48" y="341" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M748.48 353h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="786.48" y="363" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="786.48" dy="0">허가된 검사</tspan><tspan x="786.48" dy="31">대상</tspan></text><text x="740.48" y="439" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="740.48" dy="0">포트·QID·인증</tspan><tspan x="740.48" dy="28">조건에 따른 검사</tspan></text><path d="M690.24 259H704.36V414H718.48" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></g></svg>
