<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">취약점 결과가 없을 때 확인할 항목</title><desc id="desc">통신 상태, VM 활성화, 검사 대상과 최근 평가 시점을 확인하는 도식이다.</desc><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700">보안 노트  /  구조로 읽기</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700">취약점 결과가 없을 때 확인할 항목</text><rect x="44" y="145" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="190" font-size="18" fill="#287056" font-weight="700">01</text><text x="110" y="190" font-size="24" fill="#193e2f" font-weight="700">연결</text><text x="380" y="176" font-size="21" fill="#536b60" font-weight="400">센서가 통신하는가</text><text x="380" y="203" font-size="19" fill="#536b60" font-weight="400">마지막 통신 시점</text><rect x="44" y="233" width="872" height="76" rx="10" fill="#e6f0e9" stroke="#cadbd1"/><text x="65" y="278" font-size="18" fill="#287056" font-weight="700">02</text><text x="110" y="278" font-size="24" fill="#193e2f" font-weight="700">활성화와 범위</text><text x="380" y="264" font-size="21" fill="#536b60" font-weight="400">앱이 활성화됐는가</text><text x="380" y="291" font-size="19" fill="#536b60" font-weight="400">대상 · 모듈 · 권한</text><rect x="44" y="321" width="872" height="76" rx="10" fill="#fff" stroke="#cadbd1"/><text x="65" y="366" font-size="18" fill="#287056" font-weight="700">03</text><text x="110" y="366" font-size="24" fill="#193e2f" font-weight="700">평가 근거</text><text x="380" y="352" font-size="21" fill="#536b60" font-weight="400">언제 무엇을 검사했나</text><text x="380" y="379" font-size="19" fill="#536b60" font-weight="400">최신 평가 시점과 결과</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400">Cloud Agent와 Scanner Appliance의 수집 조건은 따로 확인한다.</text></g></svg>
