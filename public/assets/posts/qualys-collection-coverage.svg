<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-diagram-kind="topology" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">Cloud Agent와 Scanner는 플랫폼으로 HTTPS 연결을 시작한다. 선은 작업·결과 통신을 나타내며 대상 검사 경로를 뜻하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="540" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="44" y="49" font-size="16" fill="#287056" font-weight="700" text-anchor="start">보안 노트</text><text x="44" y="102" font-size="31" fill="#193e2f" font-weight="700" text-anchor="start">두 센서가 플랫폼과 통신하는 경로</text><path d="M344 210H475V280H580" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><path d="M344 380H475V320H580" fill="none" stroke="#7eaa93" stroke-width="3" marker-end="url(#arrow)"/><text x="407" y="180" font-size="17" fill="#287056" font-weight="700" text-anchor="start">HTTPS</text><text x="407" y="421" font-size="17" fill="#287056" font-weight="700" text-anchor="start">HTTPS</text><rect x="44" y="150" width="300" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="184" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">Cloud Agent</text><text x="66" y="217" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">호스트 내부 정보</text><text x="66" y="246" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">VM 활성화·평가 시점</text><rect x="44" y="320" width="300" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="354" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">Scanner</text><text x="66" y="387" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">대상 네트워크 검사</text><text x="66" y="416" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">대상까지의 접근 경로</text><rect x="590" y="242" width="326" height="120" rx="12" fill="#fff" stroke="#cadbd1"/><text x="612" y="276" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start">Qualys 플랫폼</text><text x="612" y="309" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">작업·업데이트·결과</text><text x="612" y="338" font-size="18" fill="#536b60" font-weight="400" text-anchor="start">최신 평가 결과 확인</text><path d="M44 480H916" stroke="#cadbd1"/><text x="44" y="516" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">선은 플랫폼 통신이다. 센서에서 검사 대상까지의 접근 경로는 별도다.</text></g></svg>
