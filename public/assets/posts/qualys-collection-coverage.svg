<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" data-diagram-kind="topology" data-explanation="structured" role="img" aria-labelledby="title desc"><title id="title">두 센서가 플랫폼과 통신하는 경로</title><desc id="desc">두 수집 주체가 플랫폼으로 연결되는 관계예요. Scanner가 대상에 닿는 경로와 호스트 내부 평가의 범위는 따로 살펴야 해요. 선은 플랫폼 통신을 나타내요. 센서에서 검사 대상까지의 접근 경로는 별도예요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="960" height="524" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="32" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 44h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">호스트 안의 Cloud Agent</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 위치</tspan></text><text x="32" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">호스트 내부</tspan></text><text x="32" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">평가 조건</tspan></text><text x="32" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">VM 활성화 · 평가 시점</tspan></text></g><g data-panel="actor"><rect x="16" y="270" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><rect x="32" y="286" width="38" height="36" rx="4" fill="#e6f0e9" stroke="#cadbd1"/><path d="M40 298h22m-22 8h22m-22 8h12" stroke="#7eaa93" stroke-width="2"/><text x="86" y="308" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">네트워크 쪽 Scanner</tspan></text><text x="32" y="364" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 위치</tspan></text><text x="32" y="395" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대상 네트워크</tspan></text><text x="32" y="437" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">검사 조건</tspan></text><text x="32" y="468" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">대상까지 접근 경로</tspan></text></g><g data-panel="actor"><rect x="534" y="16" width="410" height="230" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M557 66a10 10 0 0 1 0-20a14 14 0 0 1 27-2a11 11 0 0 1 3 22Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="604" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="604" dy="0">Qualys 플랫폼</tspan></text><text x="550" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">연결</tspan></text><text x="550" y="141" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">HTTPS</tspan></text><text x="550" y="183" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="550" dy="0">모으는 자료</tspan></text><text x="550" y="214" font-size="20" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="550" dy="0">작업 · 업데이트 · 결과</tspan></text></g><path d="M429 131H480V131H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M429 385H480V131H528" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
