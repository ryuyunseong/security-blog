<svg xmlns="http://www.w3.org/2000/svg" width="360" height="759" viewBox="0 0 360 759" data-diagram-kind="merge" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">이름이 달라도 UID 0은 같다</title><desc id="desc">두 이름이 같은 UID 0으로 모여요. 로그인 셸이나 비밀번호 잠금과 UID 중복은 서로 다른 조건이에요. UID 0과 GID 0, sudo 권한을 같은 조건으로 취급하지 않아요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="759" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="70" cy="42" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 74v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">root</tspan></text><text x="52" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">UID</tspan></text><text x="52" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">0</tspan></text></g><g data-panel="actor"><rect x="36" y="224" width="308" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="70" cy="250" r="10" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M52 282v-10q18-18 36 0v10Z" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="106" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">backup</tspan></text><text x="52" y="318" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">UID</tspan></text><text x="52" y="351" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">0</tspan></text><text x="52" y="394" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">로그인 제한</tspan></text><text x="52" y="427" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">잠금 · nologin</tspan></text></g><g data-panel="file"><rect x="36" y="508" width="308" height="203" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 524h23l9 9v32H52Z M75 524v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="600" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">숫자로 연결되는 소유권</tspan></text><text x="52" y="645" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">사용자 식별자</tspan></text><text x="52" y="678" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">UID 0</tspan></text></g><path d="M36 96H16V609.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 342H16V609.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
