<svg xmlns="http://www.w3.org/2000/svg" width="360" height="501" viewBox="0 0 360 501" data-diagram-kind="merge" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">이름이 달라도 UID 0은 같다</title><desc id="desc">가상 backup 계정의 셸을 nologin으로 바꿔도 UID 중복은 남는다. UID 0과 GID 0, sudo 권한을 같은 조건으로 취급하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="501" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="52" y="16" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">root</tspan></text><text x="68" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">UID 0</tspan></text><text x="68" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">정상 관리자 계정</tspan></text><rect x="52" y="171" width="292" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="68" y="209" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="68" dy="0">backup</tspan></text><text x="68" y="244" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">UID 0</tspan></text><text x="68" y="278" font-size="20" fill="#536b60" font-weight="400"><tspan x="68" dy="0">잠금·nologin이어도 검출</tspan></text><path d="M52 81.5H26V322H180V332 M52 236.5H26" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="338" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="376" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">같은 숫자 식별자</tspan></text><text x="32" y="411" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">UID = 0</tspan></text><text x="32" y="445" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">이름만으로 권한 분리 불가</tspan></text></g></svg>
