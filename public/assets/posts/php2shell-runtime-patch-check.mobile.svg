<svg xmlns="http://www.w3.org/2000/svg" width="360" height="759" viewBox="0 0 360 759" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 워커의 요청 사이에 남은 상태 참조</title><desc id="desc">같은 워커가 이어서 요청을 처리할 때의 객체 수명 관계예요. 실제 메모리 주소와 구체적인 생산·소비 연산은 생략했어요. CVE-2026-109619의 요청 간 관계를 단순화했어요. 구체적인 생산·소비 연산과 적용 조건은 본문 권고를 따라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="759" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="36" y="16" width="308" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="71" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M66 43l14 10-14 10Z" fill="#7eaa93"/><text x="106" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">앞 요청</tspan></text><text x="52" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">수명 종료</tspan></text><text x="52" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">메모리 해제</tspan></text></g><g data-panel="actor"><rect x="36" y="224" width="308" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="71" cy="261" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M66 251l14 10-14 10Z" fill="#7eaa93"/><text x="106" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="106" dy="0">다음 요청</tspan></text><text x="52" y="318" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">조건</tspan></text><text x="52" y="351" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">같은 워커에서 처리</tspan></text></g><g data-panel="file"><rect x="36" y="432" width="308" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M52 448h23l9 9v32H52Z M75 448v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="52" y="524" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">해제된 객체의 참조</tspan></text><text x="52" y="569" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">문제 지점</tspan></text><text x="52" y="602" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">워커에 이전 참조가 남음</tspan></text><text x="52" y="645" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="52" dy="0">접근 시점</tspan></text><text x="52" y="678" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="52" dy="0">다음 초기화 전</tspan></text></g><path d="M36 96H16V571.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 304H16V571.5H30" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
