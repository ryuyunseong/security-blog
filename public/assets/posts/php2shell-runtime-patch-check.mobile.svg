<svg xmlns="http://www.w3.org/2000/svg" width="360" height="835" viewBox="0 0 360 835" data-diagram-kind="flow" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">같은 워커의 요청 사이에 남은 상태 참조</title><desc id="desc">같은 워커가 다음 요청을 처리하는 시간 순서예요. 실제 메모리 주소와 구체적인 생산·소비 연산은 생략했어요. CVE-2026-109619의 요청 간 관계를 단순화했어요. 구체적인 생산·소비 연산과 적용 조건은 본문 권고를 따라요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="835" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="actor"><rect x="16" y="16" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="53" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 43l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="54" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">앞 요청의 종료</tspan></text><text x="32" y="110" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수명 종료</tspan></text><text x="32" y="143" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">요청 메모리 해제</tspan></text></g><g data-panel="file"><rect x="16" y="224" width="328" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 240h23l9 9v32H32Z M55 240v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="316" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">워커에 남은 이전 참조</tspan></text><text x="32" y="361" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">가리키는 대상</tspan></text><text x="32" y="394" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">이미 해제된 메모리</tspan></text><text x="32" y="437" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">계속 처리하는 주체</tspan></text><text x="32" y="470" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">같은 워커</tspan></text></g><g data-panel="actor"><rect x="16" y="551" width="328" height="236" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="588" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 578l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="589" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">다음 요청의 초기화 전</tspan></text><text x="32" y="645" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">문제 동작</tspan></text><text x="32" y="678" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">남은 참조를 사용</tspan></text><text x="32" y="721" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">발생 가능한 결과</tspan></text><text x="32" y="754" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">해제된 메모리에 다시 접근</tspan></text></g><path d="M180 181V216" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 508V543" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
