<svg xmlns="http://www.w3.org/2000/svg" width="960" height="258" viewBox="0 140 960 258" data-diagram-kind="compare" role="img" aria-labelledby="title desc"><title id="title">가상 cron.allow의 0640과 0604 읽기 비트 비교</title><desc id="desc">두 입력 모두 UID 0이에요. config-604의 기타 r이 기준 밖 비트 0004로 남아요. 같은 /etc/cron.allow 경로와 UID 0을 가정한 독립 입력이다. 실제 권한 변경 전후가 아니며 0604는 0640에 없는 기타 읽기 비트를 갖는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect y="140" width="960" height="258" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="44" y="164" width="416" height="210" rx="12" fill="#fff" stroke="#cadbd1"/><text x="66" y="202" font-size="25" fill="#193e2f" font-weight="700" text-anchor="start">config-640</text><text x="66" y="235" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">0640 · cron.allow</text><text x="66" y="265" font-size="19" fill="#536b60" font-weight="400" text-anchor="start">그룹 읽기</text><g data-illustration="permission-bits" data-mode="0640"><text x="128" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">소유자</text><rect x="70" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="88" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">r</text><rect x="110" y="314" width="36" height="30" rx="4" fill="#d5e8dc" stroke="#cadbd1"/><text x="128" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">w</text><rect x="150" y="314" width="36" height="30" rx="4" fill="#f1f6f2" stroke="#cadbd1"/><text x="168" y="336" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">-</text><text x="252" y="304" font-size="18" fill="#536b60" font-weight="400" text-anchor="middle">그룹</text><rect x="194" y="314" width="36" height="30" rx="4" fill="#d5