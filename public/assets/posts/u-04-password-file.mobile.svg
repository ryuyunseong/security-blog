<svg xmlns="http://www.w3.org/2000/svg" width="360" height="467" viewBox="0 0 360 467" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">passwd의 x가 알려 주는 것</title><desc id="desc">계정 파일에서 필요한 표지와 메타데이터만 확인한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="467" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">passwd의 x가 알려 주는 것</tspan></text><rect x="16" y="73" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="111" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">/etc/passwd</tspan></text><text x="32" y="146" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">두 번째 필드: x</tspan></text><text x="32" y="180" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">쉐도우 저장소 참조 표지</tspan></text><rect x="16" y="220" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="258" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">/etc/shadow</tspan></text><text x="32" y="293" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">접근 권한과 저장 상태</tspan></text><text x="32" y="327" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">해시 원문은 수집하지 않음</tspan></text><path d="M16 375H344" stroke="#cadbd1"/><text x="16" y="411" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">x 표지와 파일 존재만으로 계정별</tspan><tspan x="16" dy="28">저장 상태를 확정하지 않는다.</tspan></text></g></svg>
