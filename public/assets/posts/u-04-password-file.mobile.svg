<svg xmlns="http://www.w3.org/2000/svg" width="360" height="878" viewBox="0 0 360 878" data-diagram-kind="compare" data-explanation="structured" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">U-04 수집기의 두 가지 조회 범위</title><desc id="desc">x는 저장소를 참조한다는 표지예요. 이 수집기가 두 파일의 계정별 대응이나 해시 내용을 대조했다는 뜻은 아니에요. 계정별 저장 방식과 실제 인증 동작은 별도로 조사해요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="878" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><g data-panel="file"><rect x="16" y="16" width="328" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 32h23l9 9v32H32Z M55 32v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="108" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/etc/passwd</tspan></text><text x="32" y="153" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">두 번째 필드</tspan></text><text x="32" y="186" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">x</tspan></text><text x="32" y="229" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 내용</tspan></text><text x="32" y="262" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">필드 유형별 건수</tspan></text></g><g data-panel="actor"><rect x="16" y="343" width="328" height="160" rx="10" fill="#fff" stroke="#cadbd1"/><circle cx="51" cy="380" r="18" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><path d="M46 370l14 10-14 10Z" fill="#7eaa93"/><text x="86" y="381" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="86" dy="0">참조 관계 대조</tspan></text><text x="32" y="437" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">x의 의미</tspan></text><text x="32" y="470" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">쉐도우 참조 표지</tspan></text></g><g data-panel="file"><rect x="16" y="551" width="328" height="279" rx="10" fill="#fff" stroke="#cadbd1"/><path d="M32 567h23l9 9v32H32Z M55 567v9h9" fill="#e6f0e9" stroke="#7eaa93" stroke-width="2"/><text x="32" y="643" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">/etc/shadow</tspan></text><text x="32" y="688" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">수집 속성</tspan></text><text x="32" y="721" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">UID · GID · 모드</tspan></text><text x="32" y="764" font-size="20" fill="#536b60" font-weight="400" text-anchor="start"><tspan x="32" dy="0">내용</tspan></text><text x="32" y="797" font-size="22" fill="#193e2f" font-weight="700" text-anchor="start" data-role="key"><tspan x="32" dy="0">해시 원문 미수집</tspan></text></g><path d="M180 300V335" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 508V543" fill="none" stroke="#7eaa93" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
