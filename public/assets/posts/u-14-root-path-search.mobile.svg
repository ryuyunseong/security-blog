<svg xmlns="http://www.w3.org/2000/svg" width="360" height="326" viewBox="0 0 360 326" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">PATH 순서에 따른 같은 이름의 선택</title><desc id="desc">같은 이름의 실행 후보를 둔 비교다. PATH의 앞쪽에서 파일을 찾으면 뒤쪽 후보까지 탐색하지 않는다. 두 디렉터리에 같은 이름의 실행 후보가 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="326" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">현재 경로 우선</tspan></text><text x="32" y="89" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">. → /usr/bin</tspan></text><text x="32" y="123" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">작업 폴더의 도구 선택</tspan></text><rect x="16" y="163" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="201" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">시스템 경로 우선</tspan></text><text x="32" y="236" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">/usr/bin → .</tspan></text><text x="32" y="270" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">시스템의 도구 선택</tspan></text></g></svg>
