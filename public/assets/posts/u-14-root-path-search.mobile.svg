<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">PATH 순서에 따른 같은 이름의 선택</title><desc id="desc">같은 이름의 실행 후보를 둔 비교예요. PATH의 앞쪽에서 파일을 찾으면 뒤쪽 후보까지 탐색하지 않아요. 두 디렉터리에 같은 이름의 실행 후보가 있어요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="498" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><rect x="16" y="16" width="328" height="217" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="54" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">현재 경로 우선</tspan></text><g data-illustration="path-order"><rect x="32" y="71" width="129" height="90" rx="9" fill="#e6f0e9" stroke="#7eaa93"/><path d="M78.5 89v24h36V89H95.5l-5-6H78.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="96.5" y="146" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">.</text><text x="180" y="127" font-size="24" fill="#536b60" font-weight="400" text-anchor="middle">→</text><rect x="199" y="71" width="129" height="90" rx="9" fill="#fff" stroke="#7eaa93"/><path d="M245.5 89v24h36V89H262.5l-5-6H245.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="263.5" y="146" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">/usr/bin</text></g><text x="32" y="201" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">작업 폴더의 도구 선택</tspan></text><rect x="16" y="249" width="328" height="217" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="287" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">시스템 경로 우선</tspan></text><g data-illustration="path-order"><rect x="32" y="304" width="129" height="90" rx="9" fill="#e6f0e9" stroke="#7eaa93"/><path d="M78.5 322v24h36V322H95.5l-5-6H78.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="96.5" y="379" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">/usr/bin</text><text x="180" y="360" font-size="24" fill="#536b60" font-weight="400" text-anchor="middle">→</text><rect x="199" y="304" width="129" height="90" rx="9" fill="#fff" stroke="#7eaa93"/><path d="M245.5 322v24h36V322H262.5l-5-6H245.5v6Z" fill="#e6f0e9" stroke="#536b60" stroke-width="2"/><text x="263.5" y="379" font-size="22" fill="#193e2f" font-weight="700" text-anchor="middle" data-role="key">.</text></g><text x="32" y="434" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">시스템의 도구 선택</tspan></text></g></svg>
