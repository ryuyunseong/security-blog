<svg xmlns="http://www.w3.org/2000/svg" width="360" height="526" viewBox="0 0 360 526" data-diagram-kind="compare" data-layout="mobile" role="img" aria-labelledby="title desc"><title id="title">umask가 같은데 결과가 다른 이유</title><desc id="desc">같은 umask라도 부모 디렉터리의 기본 ACL에 따라 생성 권한이 달라진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7eaa93"/></marker></defs><rect width="360" height="526" fill="#f1f6f2"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif"><text x="16" y="40" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="16" dy="0">umask가 같은데 결과가 다른</tspan><tspan x="16" dy="31">이유</tspan></text><rect x="16" y="104" width="328" height="131" rx="12" fill="#fff" stroke="#cadbd1"/><text x="32" y="142" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">기본 ACL 없음</tspan></text><text x="32" y="177" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청 0666 · umask 0077</tspan></text><text x="32" y="211" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">새 파일 0600</tspan></text><rect x="16" y="251" width="328" height="131" rx="12" fill="#e6f0e9" stroke="#cadbd1"/><text x="32" y="289" font-size="22" fill="#193e2f" font-weight="700" data-role="key"><tspan x="32" dy="0">기본 ACL 있음</tspan></text><text x="32" y="324" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">u:rwx / g:r-x / o:---</tspan></text><text x="32" y="358" font-size="20" fill="#536b60" font-weight="400"><tspan x="32" dy="0">요청 0666 → 새 파일 0640</tspan></text><path d="M16 406H344" stroke="#cadbd1"/><text x="16" y="442" font-size="20" fill="#536b60" font-weight="400"><tspan x="16" dy="0">기본 ACL을 상속하는 경우</tspan><tspan x="16" dy="28">프로그램이 요청한 모드도 함께</tspan><tspan x="16" dy="28">적용된다.</tspan></text></g></svg>
